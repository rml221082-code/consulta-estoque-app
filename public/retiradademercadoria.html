  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Retirada de Mercadoria</title>

  <style>
  body{
    margin:0;
    font-family:Segoe UI, Arial;
    background:#f4f6f8;
  }

  /* HEADER */
  header{
    background:#1b5500;
    color:#fff;
    padding:12px 15px;
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
  }

  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  h2{
    font-size:18px;
    margin:0;
  }

  /* CONTAINER */
  .container{
    margin-top:80px;
    padding:15px;
  }

  /* FORM */
  .form{
    background:#fff;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;

    display:grid;
    gap:10px;
  }

  input,select{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
  }

  /* BOTÕES */
  .btn{
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    color:#fff;
    font-size:16px;
  }

  .salvar{background:#0078d4}
  .retirar{background:#16a34a}
  .retirado{background:#555}

  /* ===== DESKTOP TABELA ===== */
  table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
  }

  th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
  }

  th{background:#f0f2f5}

  /* ===== BADGE ===== */
  .badge{
    padding:4px 8px;
    border-radius:10px;
    font-size:12px;
  }

  .sim{background:#ffdede;color:#b30000}
  .nao{background:#e3f3ff;color:#005a9e}

  /* ===== MOBILE CARDS ===== */
  .cards{
    display:none;
  }

  .card{
  background:#fff;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
  border:1px solid #ddd;
}

  .card p{
    margin:5px 0;
    font-size:14px;
  }

  .card .linha{
    display:flex;
    justify-content:space-between;
  }

  .card .acoes{
    margin-top:10px;
  }

  /* ===== RESPONSIVO ===== */
  @media (max-width: 700px){

    table{
      display:none;
    }

    .cards{
      display:block;
    }

    header{
      padding:10px;
    }

    h2{
      font-size:16px;
    }

  }
  </style>
  </head>

  <body>

  <header>
    <div class="header-top">
      <h2>Retirada</h2>
      <div id="userBox"></div>
    </div>
  </header>

  <div class="container">

    <!-- FORM -->
    <div class="form">
      <input id="empresa" placeholder="Empresa">
      <input id="produto" placeholder="Produto / Máquina">
      <select id="emergencial" required>
    <option value="" disabled selected>Selecione Emergencial</option>
    <option value="NÃO">NÃO</option>
    <option value="SIM">SIM</option>
  </select>

      <button onclick="salvar()" class="btn salvar">Salvar</button>
    </div>

    <!-- DESKTOP -->
    <div style="margin-bottom:10px; display:flex; gap:10px; flex-wrap:wrap;">
    
    <select id="filtroStatus" onchange="render()"
      style="padding:10px;border-radius:8px;border:1px solid #ccc;">
      <option value="TODOS">Todos</option>
      <option value="PENDENTE">Pendentes</option>
      <option value="RETIRADO">Retirados</option>
    </select>
    <select id="filtroDias" onchange="render()"
    style="padding:10px;border-radius:8px;border:1px solid #ccc;">
    
    <option value="1">Hoje</option>
    <option value="7">7 dias</option>
    <option value="10">Últimos 10 dias</option>
    <option value="30">30 dias</option>
  </select>

  </div>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Solicitante</th>
          <th>Empresa</th>
          <th>Produto</th>
          <th>🚨EMERGENCIAL</th>
          <th>Status</th>
          <th>Local</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>

    <!-- MOBILE -->
    <div id="cards" class="cards"></div>

  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="config.js?v=2"></script>

  <script>
  const firebaseConfig = {
    apiKey: "AIzaSyCxrHKJhD7sY3msvUrDBbeNNvFeuYsAQuA",
    authDomain: "consulta-estoque-app.firebaseapp.com",
    projectId: "consulta-estoque-app",
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();
  const API_URL = window.CONFIG.API_URL;

  let usuarioLogado = null;
  let dados = [];

  /* LOGIN */
  auth.onAuthStateChanged(async user => {

    if (!user) {
      window.location.href = "login.html";
      return;
    }

    const doc = await db.collection("usuarios").doc(user.uid).get();

    usuarioLogado = doc.exists ? doc.data() : {
      nome: user.displayName || "Usuário"
    };

    try{
  await carregarFuncionarios();
}catch(e){
  console.log("Sem permissão para carregar funcionários");
}

criarUserBox(user);
carregar();
  });

  /* USER BOX */
  function criarUserBox(user){

    const box = document.getElementById("userBox");
    box.innerHTML = "";

    const avatar = document.createElement("img");
    avatar.src = user.photoURL || "https://i.imgur.com/6VBx3io.png";
    avatar.style.width = "30px";
    avatar.style.height = "30px";
    avatar.style.borderRadius = "50%";

    const nome = document.createElement("span");
    nome.innerText = usuarioLogado.nome;

    const sair = document.createElement("button");
    sair.innerText = "Sair";
    sair.onclick = () => auth.signOut();

    box.appendChild(avatar);
    box.appendChild(nome);
    box.appendChild(sair);
  }

  /* SALVAR */
  function salvar(){

    if(!empresa.value || !produto.value){
      alert("Preencha os campos");
      return;
    }

    const formData = new FormData();

    formData.append("action","novaRetirada");
    formData.append("solicitante", usuarioLogado.nome);
    formData.append("empresa", empresa.value);
    formData.append("produto", produto.value);
    formData.append("emergencial", emergencial.value);

    fetch(API_URL,{ method:"POST", body:formData })
    .then(()=>{
      alert("Salvo!");
      empresa.value="";
      produto.value="";
      carregar();
    })
  }

  /* CARREGAR */

  function carregar(){

  lista.innerHTML =
    `<tr><td colspan="8">⏳ Carregando...</td></tr>`;

  cards.innerHTML =
    `<p>⏳ Carregando...</p>`;

  fetch(API_URL + "?action=listarretirada&_=" + Date.now(),{
  cache: "no-store"
})

  .then(r=>r.json())

  .then(lista=>{

    dados = lista;

    render();

  })

  .catch(err=>{

    console.error(err);

    lista.innerHTML =
      `<tr><td colspan="8">Erro ao carregar</td></tr>`;

    cards.innerHTML =
      `<p>Erro ao carregar</p>`;
  });
}

  /* RETIRAR */
  function retirar(id){

    navigator.geolocation.getCurrentPosition(pos => {

      const formData = new FormData();
      formData.append("action","retirar");
      formData.append("id", id);
      formData.append("funcionario", usuarioLogado.nome);
      formData.append("lat", pos.coords.latitude);
      formData.append("lng", pos.coords.longitude);

      fetch(API_URL,{ method:"POST", body:formData })
      .then(()=> carregar());

    });
  }

  let funcionarios = [];

async function carregarFuncionarios(){
    const snap = await db.collection("usuarios").get();

    funcionarios = [];

    snap.forEach(doc => {
      const u = doc.data();

      if(u.nome && u.whatsapp){
        funcionarios.push({
          nome: u.nome,
          numero: u.whatsapp
        });
      }
    });

    console.log("Funcionários carregados:", funcionarios);

    render(); // 🔥 ESSENCIAL
  }
  /* lista funcionario whatsapp */
  function montarSelectFuncionarios(uid){

    if(funcionarios.length === 0){
      return `<small>Carregando contatos...</small>`;
    }

    return `
      <select id="func_${uid}" style="width:100%; margin-top:5px;">
        <option value="">Enviar para...</option>
        ${funcionarios.map(f => 
          `<option value="${f.numero}">${f.nome}</option>`
        ).join("")}
      </select>
    `;
  }
  /* mensagem para whatsapp */
function enviarWhatsPorFuncionario(id, numero){

  if(!numero) return;

  // remove desk_ e mob_
  const idReal = String(id)
    .replace("desk_","")
    .replace("mob_","");

  const n = dados.find(x => String(x.id) == String(idReal));

  if(!n){
    alert("Registro não encontrado");
    return;
  }

  numero = numero.replace(/\D/g,'');

  // adiciona 55
  if(!numero.startsWith("55")){
    numero = "55" + numero;
  }

  // mensagem SEM template string
  const msg =
    "📦 RETIRADA DE MERCADORIA\n\n" +
    "👤 Solicitante: " + (n.solicitante || "-") + "\n" +
    "🏢 Empresa: " + n.empresa + "\n" +
    "🔧 Produto: " + n.produto + "\n" +
    "🚨 Emergencial: " + n.emergencial + "\n" +
    "📅 Data: " + n.data;

  const url =
    "https://api.whatsapp.com/send?phone=" +
    numero +
    "&text=" +
    encodeURIComponent(msg);

  window.open(url, "_blank");
}
  </script>
  <script>
  function converterData(dataStr){
    if(!dataStr) return new Date(0);

    const partes = dataStr.split(" ");
    const [d,m,a] = partes[0].split("/");
    const [h,min] = (partes[1] || "00:00").split(":");

    return new Date(a, m-1, d, h, min);
  }

  function render(){

    const listaEl = document.getElementById("lista");
    const cardsEl = document.getElementById("cards");

    if(!dados || dados.length === 0){

      listaEl.innerHTML =
        `<tr><td colspan="8">Nenhum registro</td></tr>`;

      cardsEl.innerHTML =
        `<p>Nenhum registro</p>`;

      return;
    }

    let htmlTabela = "";
    let htmlCards = "";

    const filtroStatus =
      document.getElementById("filtroStatus").value;

    const dias =
      Number(document.getElementById("filtroDias").value);

    // 🔥 hoje final do dia
    const hoje = new Date();
    hoje.setHours(23,59,59,999);

    // 🔥 inicio
    const inicio = new Date();
    inicio.setHours(0,0,0,0);
    inicio.setDate(inicio.getDate() - (dias - 1));

    // 🔥 ordenar mais recente primeiro
    const dadosOrdenados = [...dados].sort((a,b)=>{
      return converterData(b.data) - converterData(a.data);
    });

    

      dadosOrdenados.forEach(n=>{

      if(!n.data) return;

      const dataItem = converterData(n.data);

      // 🔥 filtro data
      if(dataItem < inicio || dataItem > hoje) return;

      // 🔥 filtro status
      if(
        filtroStatus !== "TODOS" &&
        n.status !== filtroStatus
      ) return;

      let statusHtml = "";

      if(n.status === "RETIRADO"){

        statusHtml = `
          <b style="color:green">RETIRADO</b><br>
          <small>${n.funcionario || ""}</small><br>
          <small>${n.dataRetirada || ""}</small>
        `;

      }else{

        statusHtml =
          `<b style="color:#b30000">PENDENTE</b>`;
      }

      // =========================
      // DESKTOP
      // =========================

      htmlTabela += `
      <tr>

        <td>${n.data}</td>

        <td>${n.solicitante || "-"}</td>

        <td>${n.empresa}</td>

        <td>${n.produto}</td>

        <td>
          <span class="badge ${
            n.emergencial==="SIM"
            ? "sim"
            : "nao"
          }">
            ${n.emergencial}
          </span>
        </td>

        <td>${statusHtml}</td>

      <td>
  ${
    usuarioLogado &&
    (
      usuarioLogado.tipo === "admin" ||
      usuarioLogado.tipo === "administrativo"
    )

    ? (
        n.local
        ? `<a href="${n.local}" target="_blank">🗺️ Local</a>`
        : "-"
      )

    : "-"
  }
</td>

        <td>

          ${
            n.status==="RETIRADO"

            ? "✔"

            : `
              <button
                class="btn retirar"
                onclick="retirar(${n.id})"
              >
                Retirar
              </button>

              ${
(
  usuarioLogado.tipo === "admin" ||
  usuarioLogado.tipo === "administrativo"
)

  ? `
                  <br><br>

                  ${montarSelectFuncionarios("desk_" + n.id)}

                  <br><br>

                  <button
                    type="button"
                    class="btn salvar"
                    onclick="enviarWhatsManual('desk_${n.id}')"
                      >
                    📲 Whats
                  </button>
                `
                : ""
              }
            `
          }

        </td>

      </tr>
      `;

// =========================
// MOBILE
// =========================

htmlCards += `
<div class="card">

  <p><b>${n.produto}</b></p>

  <p>${n.empresa}</p>

  <div class="linha">

    <span>${n.data}</span>

    <span class="badge ${
      n.emergencial==="SIM"
      ? "sim"
      : "nao"
    }">
      ${n.emergencial}
    </span>

  </div>

  <p>${statusHtml}</p>

  ${
    usuarioLogado &&
    (
      usuarioLogado.tipo === "admin" ||
      usuarioLogado.tipo === "administrativo"
    )

    ? `
      <p>
        ${
          n.local
          ? `<a href="${n.local}" target="_blank">🗺️ Ver Local</a>`
          : "Local não disponível"
        }
      </p>
    `
    : ""
  }

  <div class="acoes">

    ${
      n.status==="RETIRADO"

      ? `
        <button class="btn retirado">
          ✔ Retirado
        </button>
      `

      : `
        <button
          class="btn retirar"
          onclick="retirar(${n.id})"
        >
          Retirar
        </button>

        ${
          usuarioLogado &&
          (
            usuarioLogado.tipo === "admin" ||
            usuarioLogado.tipo === "administrativo"
          )

          ? `
            <br><br>

            ${montarSelectFuncionarios("mob_" + n.id)}

            <br><br>

            <button
              type="button"
              class="btn salvar"
              onclick="enviarWhatsManual('mob_${n.id}')"
            >
              📲 Whats
            </button>
          `
          : ""
        }
      `
    }

  </div>

</div>
`;
    });


    // 🔥 atualiza tudo de uma vez
    listaEl.innerHTML = htmlTabela || `
      <tr>
        <td colspan="8">
          Nenhum registro encontrado
        </td>
      </tr>
    `;

    cardsEl.innerHTML = htmlCards || `
      <p>Nenhum registro encontrado</p>
    `;
  }
  function enviarWhatsManual(id){

  const select =
    document.getElementById("func_" + id);

  if(!select){
    alert("Erro ao localizar lista");
    return;
  }

  if(!select.value){
    alert("Selecione um funcionário");
    return;
  }

  // remove desk_ ou mob_
  const idReal = id
    .replace("desk_","")
    .replace("mob_","");

  enviarWhatsPorFuncionario(idReal, select.value);
}
  </script>
 <script>

// força atualizar sempre sem cache
window.addEventListener("load", () => {

  if ('serviceWorker' in navigator) {

    navigator.serviceWorker.getRegistration()
    .then(reg => {

      // NÃO remove o service worker global
      // apenas atualiza
      if(reg){
        reg.update();
      }

    });

  }

});

</script>
  </body>
  </html>
