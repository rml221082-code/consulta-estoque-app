<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Retirada de Mercadoria</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#f4f6f8;
}

/* HEADER */
header{
  background:#1b5500;
  color:#fff;
  padding:15px 20px;
  position:fixed;
  width:100%;
  top:0;
  z-index:1000;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.usuario{
  font-size:14px;
}

/* CONTAINER */
.container{
  margin-top:90px;
  padding:20px;
}

/* FORM */
.form{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

input,select{
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
}

/* BOTÕES */
.btn{
  border:none;
  padding:10px;
  border-radius:6px;
  cursor:pointer;
  color:#fff;
}

.salvar{background:#0078d4}
.retirar{background:#16a34a}
.retirado{background:#555}

/* TABELA */
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:center;
}

th{background:#f0f2f5}

/* BADGE */
.badge{
  padding:4px 8px;
  border-radius:10px;
  font-size:12px;
}

.sim{background:#ffdede;color:#b30000}
.nao{background:#e3f3ff;color:#005a9e}

/* LINHA EMERGENCIAL */
tr.emergencial{
  background:#fff5f5;
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <h2>Retirada de Mercadoria</h2>
    <div class="usuario" id="usuarioNome"></div>
  </div>
</header>

<div class="container">

  <div class="form">
    <input id="empresa" placeholder="Empresa">
    <input id="produto" placeholder="Produto / Máquina">

    <select id="emergencial">
      <option value="NAO">NÃO</option>
      <option value="SIM">SIM</option>
    </select>

    <button onclick="salvar()" class="btn salvar">Salvar</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Solicitante</th>
        <th>Empresa</th>
        <th>Produto</th>
        <th>🚨Emergencial</th>
        <th>Status</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

</div>
<script src="config.js"></script>
  <script>
  const API_URL = window.CONFIG.API_URL;
  </script>
<script>


/* 🔥 USUÁRIO LOGADO (MESMO PADRÃO DO SEU SISTEMA) */
const usuarioLogado = localStorage.getItem("usuario") || "Sem usuário";
document.getElementById("usuarioNome").innerText = "👤 " + usuarioLogado;

let dados = [];

/* 🔥 SALVAR */
function salvar(){

  if(!empresa.value || !produto.value){
    alert("Preencha os campos");
    return;
  }

  const formData = new FormData();

  formData.append("action","novaRetirada");
  formData.append("solicitante", usuarioLogado); // ✅ NOVO
  formData.append("empresa", empresa.value);
  formData.append("produto", produto.value);
  formData.append("emergencial", emergencial.value);

  fetch(API_URL,{
    method:"POST",
    body:formData
  })
  .then(()=>{

    alert("Salvo com sucesso!");

    empresa.value="";
    produto.value="";

    carregar();

  })
}

/* 🔥 CARREGAR */
function carregar(){

  fetch(API_URL+"?action=listarretirada")
  .then(r=>r.json())
  .then(lista=>{
    dados = lista;
    render();
  })
}

/* 📍 LOCALIZAÇÃO */
function pegarLocalizacao(){
  return new Promise((resolve)=>{

    if(!navigator.geolocation){
      resolve({lat:"",lng:""});
      return;
    }

    navigator.geolocation.getCurrentPosition(
      pos=>{
        resolve({
          lat:pos.coords.latitude,
          lng:pos.coords.longitude
        });
      },
      ()=> resolve({lat:"",lng:""})
    );

  })
}

/* 🔥 RETIRAR */
async function retirar(id){

  const loc = await pegarLocalizacao();

  const formData = new FormData();

  formData.append("action","retirar");
  formData.append("id", id);
  formData.append("funcionario", usuarioLogado);
  formData.append("lat", loc.lat);
  formData.append("lng", loc.lng);

  fetch(API_URL,{
    method:"POST",
    body:formData
  })
  .then(()=>{
    alert("Retirada registrada!");
    carregar();
  })
}

/* 🔥 RENDER */
function render(){

  lista.innerHTML="";

  dados.forEach(n=>{

    lista.innerHTML += `
    <tr class="${n.emergencial==="SIM" ? "emergencial":""}">

      <td>${n.data}</td>
      <td>${n.solicitante || "-"}</td>
      <td>${n.empresa}</td>
      <td>${n.produto}</td>

      <td>
        <span class="badge ${n.emergencial==="SIM"?"sim":"nao"}">
          ${n.emergencial}
        </span>
      </td>

      <td>
        ${n.status}
        ${n.status==="RETIRADO" ? `<br><small>${n.funcionario}</small>` : ""}
      </td>

      <td>
        ${
          n.status==="RETIRADO"
          ? `<button class="btn retirado">✔ Retirado</button>`
          : `<button class="btn retirar" onclick="retirar(${n.id})">Retirar</button>`
        }
      </td>

    </tr>
    `;
  });

}

window.onload = carregar;
</script>

</body>
</html>
