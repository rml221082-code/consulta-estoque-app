<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos de Compras</title>

<style>
/* ===== ESTILO GERAL ===== */
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
}

h1, h2 {
  text-align: center;
}

/* ===== FORMULÁRIO ===== */
.form-container {
  background: #fff;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  border-radius: 6px;
}

.form-containerbotao {
  background: #fff;
  max-width: 250px;
  margin: auto;
  padding: 15px;
  border-radius: 6px;
  margin-bottom: 20px;
}

.grupo {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin-bottom: 15px;
}

label {
  font-size: 13px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

textarea {
  resize: vertical;
}

.botoes {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

button {
  padding: 10px 18px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}

.btn-salvar {
  background: #2f80ed;
  color: #fff;
}

.btn-limpar {
  background: #ccc;
}

/* ===== TABELA ===== */
.tabela-nova table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  font-size: 14px;
  border-radius: 6px;
  overflow: hidden;
}

.tabela-nova th {
  background: #1f6feb;
  color: #fff;
  padding: 12px;
  border: 1px solid #d0d7de;
  text-align: center;
}

.tabela-nova td {
  padding: 10px;
  border: 1px solid #e0e0e0;
  text-align: center;
}

.tabela-nova tbody tr:nth-child(even) {
  background: #f9fafb;
}
</style>
</head>

<body>

<h1>Solicitação de Compras</h1>

<div class="form-containerbotao">
  <div class="botoes" style="justify-content:center">
    <a href="https://consulta-estoque-app.web.app/veiculo.html">
      <button type="button" class="btn-salvar">Voltar</button>
    </a>
  </div>
</div>

<div class="form-container">
  <form id="formPedidos">

    <div class="grupo">
      <div>
        <label>Funcionário</label>
        <select name="funcionario" required>
          <option value="">Selecione</option>
          <option>Altair</option>
          <option>Daniel</option>
          <option>Duarte</option>
          <option>Guilherme</option>
          <option>Josué</option>
          <option>Juliana</option>
          <option>Júlio</option>
          <option>Mayara</option>
          <option>Robson</option>
          <option>Samuel</option>
        </select>
      </div>

      <div>
        <label>Departamento</label>
        <select name="departamento" required>
          <option value="">Selecione</option>
          <option>Oficina</option>
          <option>Pintura</option>
          <option>Escritório</option>
          <option>Limpeza</option>
          <option>Outros</option>
        </select>
      </div>
    </div>

    <div>
      <label>Observações</label>
      <textarea name="observacao"></textarea>
    </div>

    <div class="botoes">
      <button type="reset" class="btn-limpar">Limpar</button>
      <button type="submit" class="btn-salvar">Salvar</button>
    </div>

  </form>
</div>

<div style="margin-top:30px;">
  <h2>Últimos Pedidos de Compras</h2>

  <div class="tabela-nova">
    <table id="tabelaPedidos">
      <thead>
        <tr>
          <th>Data/Hora</th>
          <th>Funcionário</th>
          <th>Departamento</th>
          <th>Observação</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4">Carregando...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const URL_WEBAPP = "https://script.google.com/macros/s/AKfycbyqArNZnGzgDzn1mOCkHB2UGinLbANe4HBRfZgZ5neBLj-cQFPGSQl5aWnvf5Joh-vwsA/exec";

// ===== SALVAR =====
document.getElementById("formPedidos").addEventListener("submit", function(e) {
  e.preventDefault();

  const formData = new FormData(this);
  formData.append("action", "salvarPedido");

  fetch(URL_WEBAPP, {
    method: "POST",
    body: formData
  })
  .then(() => {
    alert("Pedido salvo com sucesso!");
    this.reset();
    carregarUltimos();
  })
  .catch(() => alert("Erro ao salvar"));
});

// ===== LISTAR =====
function carregarUltimos() {
  fetch(URL_WEBAPP + "?action=listarPedidos")
    .then(r => r.json())
    .then(dados => {
      const tbody = document.querySelector("#tabelaPedidos tbody");
      tbody.innerHTML = "";

      if (!dados.length) {
        tbody.innerHTML = `<tr><td colspan="4">Nenhum registro</td></tr>`;
        return;
      }

      dados.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${formatarDataHora(p.dataHora)}</td>
            <td>${p.funcionario}</td>
            <td>${p.departamento}</td>
            <td>${p.observacao || ""}</td>
          </tr>
        `;
      });
    });
}

document.addEventListener("DOMContentLoaded", carregarUltimos);
function formatarDataHora(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("pt-BR", {
    timeZone: "America/Sao_Paulo"
  });
}

</script>

</body>
</html>
