<html lang="pt-BR">
<head>

<style>
  header {

  display:flex;

}

  display:flex;

  padding:10px 18px;

}

.btn-salvar { background:#2f80ed;color:#fff; }
.btn-limpar { background:#ccc; }

table {
  width:100%;

  background:#fff;
}

th {
  background:#1f6feb;
  color:#fff;
  padding:10px;
}

td {
  padding:8px;

  text-align:center;
}
.status-pendente {
  background: #fff3cd;
  color: #856404;
  font-weight: bold;
  border-radius: 6px;
  padding: 4px;
}

.status-comprado {
  background: #cce5ff;
  color: #004085;
  font-weight: bold;
  border-radius: 6px;
  padding: 4px;
}

.status-entregue {
  background: #d4edda;
  color: #155724;
  font-weight: bold;
  border-radius: 6px;
  padding: 4px;
}

.linha-emergencial {
  background: #ffe6e6 !important;
}
</style>
</head>
<header>
  <div>📦 Pedidos de Compras</div>

  <div class="header-right" id="headerRight">
    <!-- JS vai preencher -->
  </div>
</header>
<body>
            <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>


        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

        <script>
        const firebaseConfig = {
        apiKey: "AIzaSyCxrHKJhD7sY3msvUrDBbeNNvFeuYsAQuA",
        authDomain: "consulta-estoque-app.firebaseapp.com",
        projectId: "consulta-estoque-app",
        storageBucket: "consulta-estoque-app.firebasestorage.app",
        messagingSenderId: "1065893590092",
        appId: "1:1065893590092:web:479ebc4a07cf66457430e9"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        let usuarioLogado = null;
        let mostrarEntregues = false;
        let filtroStatus = "PENDENTE"; // padrão
        let buscaTexto = "";
        let filtroData = "";
        let filtroEmergencial = false;
        let dadosGlobal = [];

        // 🔐 CONTROLE COMPLETO DE LOGIN
    auth.onAuthStateChanged(async user => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

        let doc = await db.collection("usuarios").doc(user.uid).get();

        // 🔥 CRIA USUÁRIO AUTOMATICO
        if (!doc.exists) {
            const novoUsuario = {
            nome: user.displayName || "Usuário",
            email: user.email,
            tipo: "funcionario",
            ativo: true,
            nivel: 0
            };

            await db.collection("usuarios").doc(user.uid).set(novoUsuario);
            usuarioLogado = novoUsuario;

        } else {
        usuarioLogado = doc.data();

        const tipo = (usuarioLogado.tipo || "").toLowerCase();

// ✅ variável GLOBAL (IMPORTANTE)
window.podeEditar = (tipo === "admin" || tipo === "administrativo");
// ✅ DEFINE PERMISSÃO GLOBAL
window.podeEditar = (tipo === "admin" || tipo === "administrativo");

// ❌ NÃO BLOQUEIA MAIS FUNCIONÁRIO
// apenas deixa ele sem permissão de edição
    }

        // 🔒 BLOQUEIO
        if (usuarioLogado.ativo === false) {
            alert("Seu acesso está aguardando liberação do administrador.");

            await auth.signOut();
            window.location.href = "login.html";
            return;
        }

        // 🔥 HEADER USUÁRIO
        const userBox = document.createElement("div");
userBox.id = "userBox";

const avatar = document.createElement("img");
avatar.src = user.photoURL || "https://i.imgur.com/6VBx3io.png";

const info = document.createElement("div");
info.innerHTML = `
  <div><b>${usuarioLogado.nome}</b></div>
  <div style="font-size:11px;">${usuarioLogado.tipo}</div>
`;

const btn = document.createElement("button");
btn.innerText = "Sair";
btn.onclick = () => {
  auth.signOut().then(() => {
    window.location.href = "login.html";
  });
};

userBox.appendChild(avatar);
userBox.appendChild(info);
userBox.appendChild(btn);

const headerRight = document.getElementById("headerRight");
headerRight.appendChild(userBox);

        // 🔥 BOTÃO ADMIN
        if (usuarioLogado.tipo === "admin") {
  const btnAdmin = document.createElement("button");
  btnAdmin.innerText = "Admin";

  btnAdmin.onclick = () => {
    window.location.href = "admin.html";
  };

  headerRight.appendChild(btnAdmin);
}

        // 🔥 SÓ CARREGA PRODUTOS DEPOIS DO LOGIN
        carregarPedidos();

        });
        </script>

<h1>Solicitação de Compras</h1>

<div class="form-container">
<form id="formPedidos">

<div class="grupo">
  
  <div>
    <label>Departamento</label>
    <select name="departamento" required>
      <option value="">Selecione</option>
      <option>Oficina</option>
      <option>Pintura</option>

      <option>Pedido</option>

    </select>
  </div>
</div>

  <label>Nº do Pedido</label>

</div>

  <label>Observação</label>
  <textarea name="observacao"></textarea>
</div>

<div>
  <label>Emergencial</label>

    <option value="NAO">Não</option>

</div>

<h2>Pedidos</h2>
<div style="background:#fff;padding:15px;border-radius:8px;margin-bottom:15px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">

  <!-- STATUS -->
  <button type="button" onclick="filtrarStatus('PENDENTE')" id="btnPendente">🟡 Pendente</button>
  <button type="button" onclick="filtrarStatus('COMPRADO')" id="btnComprado">🔵 Comprado</button>
  <button type="button" onclick="filtrarStatus('ENTREGUE')" id="btnEntregue">🟢 Entregue</button>
  <button type="button" onclick="filtrarStatus('TODOS')" id="btnTodos">📋 Todos</button>

  <!-- BUSCA -->
  <input type="text" placeholder="🔍 Buscar..." oninput="buscarTexto(this.value)">

  <!-- DATA -->
  <input type="date" onchange="filtrarData(this.value)">

  <!-- EMERGENCIAL -->
  <button type="button" onclick="toggleEmergencial()" id="btnEmergencial">
    🚨 Emergencial
  </button>

</div>

<table>
<thead>
<tr>
  <th>Data</th>
  <th>Funcionário</th>
  <th>Departamento</th>
  <th>Obs</th>
  <th>Pedido</th>
  <th>🚨Emergencial</th>
  <th>Status</th>
  <th>Previsão</th>
  <th>Ação</th>
</tr>
</thead>
<tbody id="tbodyPedidos"></tbody>
</table>
<script src="config.js"></script>
<script>
const API_URL = window.CONFIG.API_URL;
</script>
<script>
const el = document.getElementById("usuarioNome");
if (el) {
  el.innerText = "👤 " + localStorage.getItem("usuarioLogado");
}
function filtrarStatus(status){
  filtroStatus = status;
  atualizarBotoes();
  renderTabela();
}

function buscarTexto(valor){
  buscaTexto = valor.toLowerCase();
  renderTabela();
}

function filtrarData(valor){
  filtroData = valor;
  renderTabela();
}

function toggleEmergencial(){
  filtroEmergencial = !filtroEmergencial;

  document.getElementById("btnEmergencial").style.background =
    filtroEmergencial ? "#e74c3c" : "#ccc";

  renderTabela();
}
function atualizarBotoes(){

  const ids = ["btnPendente","btnComprado","btnEntregue","btnTodos"];

  ids.forEach(id => {
    document.getElementById(id).style.background = "#ccc";
  });

  if(filtroStatus === "PENDENTE") document.getElementById("btnPendente").style.background = "#f1c40f";
  if(filtroStatus === "COMPRADO") document.getElementById("btnComprado").style.background = "#3498db";
  if(filtroStatus === "ENTREGUE") document.getElementById("btnEntregue").style.background = "#2ecc71";
  if(filtroStatus === "TODOS") document.getElementById("btnTodos").style.background = "#1f6feb";
}
function logout(){
  localStorage.removeItem("usuarioLogado");
  window.location.href = "login.html";
}
</script>
<script>
function toggleEntregues(){
  mostrarEntregues = !mostrarEntregues;

  const btn = document.getElementById("btnEntregues");

  btn.innerText = mostrarEntregues
    ? "Ocultar Entregues"
    : "Mostrar Entregues";

  carregarPedidos();
}
// ===== FORMATAR DATA =====
function formatarDataBR(data){
  if(!data) return "";

  const d = new Date(data);
  if(isNaN(d)) return "";

  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR");
}
function formatarDataISO(data){
  if(!data) return "";
  const d = new Date(data);
  if(isNaN(d)) return "";
  return d.toISOString().split("T")[0];
}




// ===== AÇÕES =====
function comprar(linha){
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
  action:"marcarcomprado",
  linha:linha,
  tipo: usuarioLogado?.tipo || ""
})
  }).then(()=>carregarPedidos());
}

function entregar(linha){
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
  action:"marcarentregue",
  linha:linha,
  tipo: usuarioLogado?.tipo || ""
})
  }).then(()=>carregarPedidos());
}

function salvarPrevisao(linha, data){

  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
      action:"salvarprevisao",
      linha:linha,
      previsao: data || "", // permite limpar
      tipo: usuarioLogado?.tipo || ""
    })
  })
  .then(() => {

    // só muda status se tiver data
    if(data){
      return fetch(API_URL,{
        method:"POST",
        body:new URLSearchParams({
          action:"marcarcomprado",
          linha:linha,
          tipo: usuarioLogado?.tipo || ""
        })
      });
    }

  })
  .then(() => carregarPedidos());

}

// ===== SALVAR FORM =====
async function carregarPedidos(){

  const tbody = document.getElementById("tbodyPedidos");

  tbody.innerHTML = `
    <tr>
      <td colspan="9">Carregando...</td>
    </tr>
  `;

  try{

    const res = await fetch(API_URL + "?action=listarpedidos");
    const resJson = await res.json();

    const dados = Array.isArray(resJson)
      ? resJson
      : (resJson.rows || resJson.dados || []);

    if(dados.length === 0){
      tbody.innerHTML = `
        <tr>
          <td colspan="9">Nenhum pedido encontrado</td>
        </tr>
      `;
      return;
    }

    dadosGlobal = dados;

    renderTabela();
    atualizarContadores();

  } catch(err){
    console.error(err);

    tbody.innerHTML = `
      <tr>
        <td colspan="9">Erro ao carregar pedidos</td>
      </tr>
    `;
  }
} 
function renderTabela(){

  const tbody = document.getElementById("tbodyPedidos");
  tbody.innerHTML = "";

  let filtrados = dadosGlobal;

  if (filtroStatus !== "TODOS") {
  filtrados = filtrados.filter(p => {
    const status = (p.status || "")
      .toString()
      .trim()
      .toUpperCase();

    return status === filtroStatus;
  });
}

  if(buscaTexto){
  filtrados = filtrados.filter(p =>
    String(p.funcionario || "").toLowerCase().includes(buscaTexto) ||
    String(p.pedido || "").toLowerCase().includes(buscaTexto) ||
    String(p.observacao || "").toLowerCase().includes(buscaTexto)
  );
}

  if(filtroData){
    filtrados = filtrados.filter(p =>
      formatarDataISO(p.previsao) === filtroData
    );
  }

  if(filtroEmergencial){
    filtrados = filtrados.filter(p => p.emergencial === "SIM");
  }

  if(filtrados.length === 0){
    tbody.innerHTML = `<tr><td colspan="9">Nenhum resultado</td></tr>`;
    return;
  }

  filtrados.forEach(p => {

  const status = (p.status || "")
    .toString()
    .trim()
    .toUpperCase(); 

    tbody.innerHTML += `
      <tr class="${p.emergencial === "SIM" ? "linha-emergencial" : ""}">
        <td>${formatarDataBR(p.dataHora)}</td>
        <td>${p.funcionario || ""}</td>
        <td>${p.departamento || ""}</td>
        <td>${p.observacao || ""}</td>
        <td>${p.pedido|| ""}</td>
        <td>${p.emergencial === "SIM" ? "🚨SIM🚨" : "NÃO"}</td>

        <td class="${
  status === "PENDENTE" ? "status-pendente" :
  status === "COMPRADO" ? "status-comprado" :
  "status-entregue"
}">
  ${
    status === "PENDENTE" ? "🟡 PENDENTE" :
    status === "COMPRADO" ? "🔵 COMPRADO" :
    "🟢 ENTREGUE"
  }
</td> 
        <td>
          ${
            podeEditar
            ? `<input type="date"
                value="${formatarDataISO(p.previsao)}"
                onchange="salvarPrevisao(${p.linha}, this.value)">`
            : `<input type="date" value="${formatarDataISO(p.previsao)}" disabled>`
          }
        </td>

        <td>
          ${
            podeEditar
              ? (
                  status === "PENDENTE"
                    ? `<button onclick="comprar(${p.linha})">🛒 Comprar</button>`
                    : p.status === "COMPRADO"
                    ? `<button onclick="entregar(${p.linha})">📦 Entregar</button>`
                    : `<span style="color:green;">✔ Finalizado</span>`
                )
              : `<span style="color:#999;">🔒</span>`
          }
        </td>
      </tr>
    `;
  });
}
function atualizarContadores(){
const totalP = dadosGlobal.filter(p => (p.status || "").toUpperCase().trim() === "PENDENTE").length;
const totalC = dadosGlobal.filter(p => (p.status || "").toUpperCase().trim() === "COMPRADO").length;
const totalE = dadosGlobal.filter(p => (p.status || "").toUpperCase().trim() === "ENTREGUE").length;

  document.getElementById("btnPendente").innerText = `🟡 Pendente (${totalP})`;
  document.getElementById("btnComprado").innerText = `🔵 Comprado (${totalC})`;
  document.getElementById("btnEntregue").innerText = `🟢 Entregue (${totalE})`;
}
// ===== ENVIAR PEDIDO (FORMULÁRIO) =====
document.getElementById("formPedidos").addEventListener("submit", async function(e){
  e.preventDefault();

  const form = e.target;

  const dados = {
    action: "salvarpedido",
    funcionario: usuarioLogado?.nome || "Sem nome",
    departamento: form.departamento.value,
    observacao: form.observacao.value,
    pedido: form.pedido.value,
    emergencial: form.emergencial.value
  };

  try{

    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams(dados)
    });

    const json = await res.json();

    if(json.success){

      alert("✅ Pedido enviado com sucesso!");

      form.reset();

      carregarPedidos(); // atualiza tabela

    }else{
      alert("Erro: " + (json.erro || "Falha ao salvar"));
    }

  }catch(err){
    console.error(err);
    alert("Erro de conexão");
  }

});
// ===== INICIAR =====
carregarPedidos();
atualizarBotoes();
</script>

</body>
</html>
