<body>
            <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

        <script>
        const firebaseConfig = {
        apiKey: "AIzaSyCxrHKJhD7sY3msvUrDBbeNNvFeuYsAQuA",
        authDomain: "consulta-estoque-app.firebaseapp.com",
        projectId: "consulta-estoque-app",
        storageBucket: "consulta-estoque-app.firebasestorage.app",

        };

        firebase.initializeApp(firebaseConfig);

        const db = firebase.firestore();

    auth.onAuthStateChanged(async user => {

            };

            await db.collection("usuarios").doc(user.uid).set(novoUsuario);
            usuarioLogado = novoUsuario;

        } else {
        usuarioLogado = doc.data();

        const tipo = (usuarioLogado.tipo || "").toLowerCase();

// ✅ variável GLOBAL (IMPORTANTE)
window.podeEditar = (tipo === "admin" || tipo === "administrativo");
// ✅ DEFINE PERMISSÃO GLOBAL
window.podeEditar = (tipo === "admin" || tipo === "administrativo");

// ❌ NÃO BLOQUEIA MAIS FUNCIONÁRIO
// apenas deixa ele sem permissão de edição
    }

        // 🔒 BLOQUEIO
        if (usuarioLogado.ativo === false) {

const headerRight = document.getElementById("headerRight");
headerRight.appendChild(userBox);

        // 🔥 BOTÃO ADMIN
        if (usuarioLogado.tipo === "admin") {

        // 🔥 SÓ CARREGA PRODUTOS DEPOIS DO LOGIN
        carregarPedidos();

<h1>Solicitação de Compras</h1>

<div class="form-container">
<form id="formPedidos">

<div class="grupo">
  
  <div>
    <label>Departamento</label>
    <select name="departamento" required>
      <option value="">Selecione</option>
      <option>Oficina</option>
      <option>Pintura</option>
      <option>Escritório</option>
      <option>Limpeza</option>
      <option>Pedido</option>
      <option>Outros</option>
    </select>
  </div>
</div>
<div>
  <label>Nº do Pedido</label>

</div>

<h2>Pedidos</h2>

<table>
<thead>
<tr>
  <th>Data</th>
  <th>Funcionário</th>
  <th>Departamento</th>
  <th>Obs</th>
  <th>Pedido</th>
  <th>🚨Emergencial</th>
  <th>Status</th>
  <th>Previsão</th>
  <th>Ação</th>
</tr>
</thead>
<tbody id="tbodyPedidos"></tbody>
</table>
<script src="config.js"></script>
<script>
const API_URL = window.CONFIG.API_URL;
</script>
<script>
const el = document.getElementById("usuarioNome");
if (el) {
  el.innerText = "👤 " + localStorage.getItem("usuarioLogado");
}
function logout(){
  localStorage.removeItem("usuarioLogado");
  window.location.href = "login.html";
}
</script>
<script>

// ===== FORMATAR DATA =====
function formatarDataBR(data){
  if(!data) return "";

  const d = new Date(data);
  if(isNaN(d)) return "";

  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR");
}
function formatarDataISO(data){
  if(!data) return "";
  const d = new Date(data);
  if(isNaN(d)) return "";
  return d.toISOString().split("T")[0];
}




// ===== AÇÕES =====
function comprar(linha){
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
  action:"marcarcomprado",
  linha:linha,
  tipo: usuarioLogado?.tipo || ""
})
  }).then(()=>carregarPedidos());
}

function entregar(linha){
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
  action:"marcarentregue",
  linha:linha,
  tipo: usuarioLogado?.tipo || ""
})
  }).then(()=>carregarPedidos());
}

function salvarPrevisao(linha,data){

  if(!data) return;

  // 1. Salva a data
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
  action:"salvarprevisao",
  linha:linha,
  previsao:data,
  tipo: usuarioLogado?.tipo || ""
})
  })
  .then(() => {

    // 2. MUDA STATUS PARA COMPRADO AUTOMATICAMENTE
   return fetch(API_URL,{
  method:"POST",
  body:new URLSearchParams({
    action:"marcarcomprado",
    linha:linha,
    tipo: usuarioLogado?.tipo || ""
  })
});

  })
  .then(() => {

    // 3. Atualiza a tela
    carregarPedidos();

  });
}

// ===== SALVAR FORM =====
async function carregarPedidos(){

  const tbody = document.getElementById("tbodyPedidos");

  tbody.innerHTML = `
    <tr>
      <td colspan="8">Carregando...</td>
    </tr>
  `;

  try{

    const res = await fetch(API_URL + "?action=listarpedidos");
    const resJson = await res.json();

    console.log("PEDIDOS:", resJson);

    const dados = Array.isArray(resJson)
      ? resJson
      : (resJson.rows || resJson.dados || []);

    tbody.innerHTML = "";

    if(dados.length === 0){
      tbody.innerHTML = `
        <tr>
          <td colspan="8">Nenhum pedido encontrado</td>
        </tr>
      `;
      return;
    }

    dados.forEach(p => {

      tbody.innerHTML += `
        <tr>
          <td>${formatarDataBR(p.dataHora)}</td>
          <td>${p.funcionario || ""}</td>
          <td>${p.departamento || ""}</td>
          <td>${p.observacao || ""}</td>
          <td>${p.pedido|| ""}</td>
          <td>${p.emergencial === "SIM" ? "🚨SIM🚨" : "NÃO"}</td>
          <td class="${
  p.status === "PENDENTE" ? "status-pendente" :
  p.status === "COMPRADO" ? "status-comprado" :
  "status-entregue"
}">
  ${
    p.status === "PENDENTE" ? "🟡 PENDENTE" :
    p.status === "COMPRADO" ? "🔵 COMPRADO" :
    "🟢 ENTREGUE"
  }
</td>
         <td>
  ${
    podeEditar
    ? `<input type="date"
        value="${formatarDataISO(p.previsao)}"
        onchange="salvarPrevisao(${p.linha}, this.value)">`
    : `<input type="date"
        value="${formatarDataISO(p.previsao)}"
        disabled>`
  }
</td>

<td>
  ${
    podeEditar
    ? (
        p.status === "PENDENTE"
        ? `<button onclick="comprar(${p.linha})">Comprar</button>`
        : `<button onclick="entregar(${p.linha})">Entregue</button>`
      )
    : `<span style="color:#999;">🔒 Bloqueado</span>`
  }
</td>
        </tr>
      `;
    });

  }catch(err){
    console.error(err);
    tbody.innerHTML = `
      <tr>
        <td colspan="8">Erro ao carregar pedidos</td>
      </tr>
    `;
  }
}
// ===== ENVIAR PEDIDO (FORMULÁRIO) =====
document.getElementById("formPedidos").addEventListener("submit", async function(e){
  e.preventDefault();

  const form = e.target;

  const dados = {
    action: "salvarpedido",
    funcionario: usuarioLogado?.nome || "Sem nome",
    departamento: form.departamento.value,
    observacao: form.observacao.value,
    pedido: form.pedido.value,
    emergencial: form.emergencial.value
  };

  try{

    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams(dados)
    });

    const json = await res.json();

    if(json.success){

      alert("✅ Pedido enviado com sucesso!");

      form.reset();

      carregarPedidos(); // atualiza tabela

    }else{
      alert("Erro: " + (json.erro || "Falha ao salvar"));
    }

  }catch(err){
    console.error(err);
    alert("Erro de conexão");
  }

});
// ===== INICIAR =====
carregarPedidos();
</script>

</body>
