function filtrarStatus(status){
  filtroStatus = status;
  atualizarBotoes();
  renderTabela();
}

function buscarTexto(valor){
  buscaTexto = valor.toLowerCase();
  renderTabela();
}

function filtrarData(valor){
  filtroData = valor;
  renderTabela();
}

function toggleEmergencial(){
  filtroEmergencial = !filtroEmergencial;

  document.getElementById("btnEmergencial").style.background =
    filtroEmergencial ? "#e74c3c" : "#ccc";

  renderTabela();
}
function atualizarBotoes(){

  const ids = ["btnPendente","btnComprado","btnEntregue","btnTodos"];

  ids.forEach(id => {
    document.getElementById(id).style.background = "#ccc";
  });

  if(filtroStatus === "PENDENTE") document.getElementById("btnPendente").style.background = "#f1c40f";
  if(filtroStatus === "COMPRADO") document.getElementById("btnComprado").style.background = "#3498db";
  if(filtroStatus === "ENTREGUE") document.getElementById("btnEntregue").style.background = "#2ecc71";
  if(filtroStatus === "TODOS") document.getElementById("btnTodos").style.background = "#1f6feb";
}

<script>
function toggleEntregues(){
  mostrarEntregues = !mostrarEntregues;

  const btn = document.getElementById("btnEntregues");

  btn.innerText = mostrarEntregues
    ? "Ocultar Entregues"
    : "Mostrar Entregues";

  carregarPedidos();

// ===== FORMATAR DATA =====
function formatarDataBR(data){
  if(!data) return "";

  const d = new Date(data);
  if(isNaN(d)) return "";

  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR");
}
function formatarDataISO(data){
  if(!data) return "";
  const d = new Date(data);
  if(isNaN(d)) return "";
  return d.toISOString().split("T")[0];
}




// ===== AÇÕES =====
function comprar(linha){
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
  action:"marcarcomprado",
  linha:linha,
  tipo: usuarioLogado?.tipo || ""
})
  }).then(()=>carregarPedidos());
}

function entregar(linha){
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
  action:"marcarentregue",
  linha:linha,
  tipo: usuarioLogado?.tipo || ""
})
  }).then(()=>carregarPedidos());
}

function salvarPrevisao(linha, data){

  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
      action:"salvarprevisao",
      linha:linha,
      previsao: data || "", // permite limpar
      tipo: usuarioLogado?.tipo || ""
    })
  })
  .then(() => {

    // só muda status se tiver data
    if(data){
      return fetch(API_URL,{
        method:"POST",
        body:new URLSearchParams({
          action:"marcarcomprado",
          linha:linha,
          tipo: usuarioLogado?.tipo || ""
        })
      });
    }

  })
  .then(() => carregarPedidos());

}
// ===== CARREGAR PEDIDOS =====
async function carregarPedidos(){

  const tbody = document.getElementById("tbodyPedidos");

  tbody.innerHTML = `
    <tr>
      <td colspan="9">Carregando...</td>
    </tr>
  `;

  try{

    const res = await fetch(API_URL + "?action=listarpedidos");
    const resJson = await res.json();

    const dados = Array.isArray(resJson)
      ? resJson
      : (resJson.rows || resJson.dados || []);

    dadosGlobal = dados;

    renderTabela();
    atualizarContadores();

  }catch(err){

    console.error(err);

    tbody.innerHTML = `
      <tr>
        <td colspan="9">Erro ao carregar pedidos</td>
      </tr>
    `;
  }

}
// ===== SALVAR FORM =====
function quebrarLinha(texto, limite = 65){

  if(!texto) return "";

  let resultado = "";

  for(let i = 0; i < texto.length; i += limite){
    resultado += texto.substring(i, i + limite) + "<br>";
  }

  return resultado;
}
function renderTabela(){

  const tbody = document.getElementById("tbodyPedidos");
  tbody.innerHTML = "";

  let filtrados = dadosGlobal;

  if (filtroStatus !== "TODOS") {
    filtrados = filtrados.filter(p => {
      const status = (p.status || "")
        .toString()
        .trim()
        .toUpperCase();

      return status === filtroStatus;
    });
  }

  if(buscaTexto){
    filtrados = filtrados.filter(p =>
      String(p.funcionario || "").toLowerCase().includes(buscaTexto) ||
      String(p.pedido || "").toLowerCase().includes(buscaTexto) ||
      String(p.observacao || "").toLowerCase().includes(buscaTexto)
    );
  }

  if(filtroData){
    filtrados = filtrados.filter(p =>
      formatarDataISO(p.previsao) === filtroData
    );
  }

  if(filtroEmergencial){
    filtrados = filtrados.filter(p => p.emergencial === "SIM");
  }

  if(filtrados.length === 0){
    tbody.innerHTML = `
      <tr>
        <td colspan="9">Nenhum resultado</td>
      </tr>
    `;
    return;
  }

  // 🔥 MOBILE
  if(window.innerWidth <= 768){

    tbody.innerHTML = `
      <tr>
        <td colspan="9" style="padding:0;border:none;background:none;">
          <div id="cardsPedidos"></div>
        </td>
      </tr>
    `;

    const cards = document.getElementById("cardsPedidos");

    filtrados.forEach(p => {

      const status = (p.status || "")
        .toString()
        .trim()
        .toUpperCase();

      let classeStatus =
        status === "PENDENTE" ? "status-pendente" :
        status === "COMPRADO" ? "status-comprado" :
        "status-entregue";

      let textoStatus =
        status === "PENDENTE" ? "🟡 PENDENTE" :
        status === "COMPRADO" ? "🔵 COMPRADO" :
        "🟢 ENTREGUE";

      cards.innerHTML += `
        <div class="pedido-card ${p.emergencial === "SIM" ? "linha-emergencial" : ""}">

          <div class="pedido-topo">
            <div class="pedido-funcionario">
              👤 ${p.funcionario || ""}
            </div>

            <div class="${classeStatus}">
              ${textoStatus}
            </div>
          </div>

          <div class="pedido-item">
            <b>📅 Data:</b><br>
            ${p.dataHora || ""}
          </div>

          <div class="pedido-item">
            <b>🏢 Departamento:</b><br>
            ${p.departamento || ""}
          </div>

          <div class="pedido-item" style="
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:break-word;
">
  <b>📝 Observação:</b><br>
  ${p.observacao || ""}
</div>

          <div class="pedido-item">
            <b>📦 Pedido:</b><br>
            ${p.pedido || ""}
          </div>

          <div class="pedido-item">
            <b>🚨 Emergencial:</b><br>
            ${p.emergencial === "SIM" ? "SIM" : "NÃO"}
          </div>

          <div class="pedido-item">
            <b>📆 Previsão:</b><br>

            ${
              podeEditar
              ? `<input type="date"
                  value="${formatarDataISO(p.previsao)}"
                  onchange="salvarPrevisao(${p.linha}, this.value)">`
              : `<input type="date"
                  value="${formatarDataISO(p.previsao)}"
                  disabled>`
            }
          </div>

          <div class="pedido-acoes">

            ${
              podeEditar
                ? (
                    status === "PENDENTE"
                      ? `<button onclick="comprar(${p.linha})">
                          🛒 Comprar
                        </button>`
                      : status === "COMPRADO"
                      ? `<button onclick="entregar(${p.linha})">
                          📦 Entregar
                        </button>`
                      : `<span style="color:green;font-weight:bold;">
                          ✔ Finalizado
                        </span>`
                  )
                : `<span style="color:#999;">🔒 Sem permissão</span>`
            }

          </div>

        </div>
      `;
    });

    return;
  }

  // 🔥 DESKTOP NORMAL
  filtrados.forEach(p => {

    const status = (p.status || "")
      .toString()
      .trim()
      .toUpperCase();

    tbody.innerHTML += `
      <tr class="${p.emergencial === "SIM" ? "linha-emergencial" : ""}">
        <td>${p.dataHora}</td>
        <td>${p.funcionario || ""}</td>
        <td>${p.departamento || ""}</td>
        <td style="
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:break-word;
  max-width:300px;
">
  ${p.observacao || ""}
</td>
        <td>${p.pedido|| ""}</td>
        <td>${p.emergencial === "SIM" ? "🚨SIM🚨" : "NÃO"}</td>

        <td class="${
          status === "PENDENTE" ? "status-pendente" :
          status === "COMPRADO" ? "status-comprado" :
          "status-entregue"
        }">

          ${
            status === "PENDENTE" ? "🟡 PENDENTE" :
            status === "COMPRADO" ? "🔵 COMPRADO" :
            "🟢 ENTREGUE"
          }

        </td>

        <td>
          ${
            podeEditar
            ? `<input type="date"
                value="${formatarDataISO(p.previsao)}"
                onchange="salvarPrevisao(${p.linha}, this.value)">`
            : `<input type="date"
                value="${formatarDataISO(p.previsao)}"
                disabled>`
          }
        </td>

        <td>
          ${
            podeEditar
              ? (
                  status === "PENDENTE"
                    ? `<button onclick="comprar(${p.linha})">🛒 Comprar</button>`
                    : status === "COMPRADO"
                    ? `<button onclick="entregar(${p.linha})">📦 Entregar</button>`
                    : `<span style="color:green;">✔ Finalizado</span>`
                )
              : `<span style="color:#999;">🔒</span>`
          }
        </td>
      </tr>
    `;
  });
};
function atualizarContadores(){

  const totalP = dadosGlobal.filter(
    p => (p.status || "").toUpperCase().trim() === "PENDENTE"
  ).length;

  const totalC = dadosGlobal.filter(
    p => (p.status || "").toUpperCase().trim() === "COMPRADO"
  ).length;

  const totalE = dadosGlobal.filter(
    p => (p.status || "").toUpperCase().trim() === "ENTREGUE"
  ).length;

  document.getElementById("btnPendente").innerText =
    `🟡 Pendente (${totalP})`;

  document.getElementById("btnComprado").innerText =
    `🔵 Comprado (${totalC})`;

  document.getElementById("btnEntregue").innerText =
    `🟢 Entregue (${totalE})`;
}
document.getElementById("formPedidos").addEventListener("submit", async (e) => {

  e.preventDefault();

  try {

    const form = e.target;

    const dados = {
      action: "salvarpedido",
      funcionario: usuarioLogado?.nome || "Sem nome",
      departamento: form.departamento.value,
      pedido: form.pedido.value,
      observacao: form.observacao.value,
      emergencial: form.emergencial.value
    };

    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams(dados)
    });

    const json = await res.json();

    console.log(json);

    if (json.success) {

      alert("Pedido salvo com sucesso!");

      form.reset();

      carregarPedidos();

    } else {

      alert("Erro: " + (json.erro || "Falha ao salvar"));

    }

  } catch (erro) {

    console.error(erro);
    alert("Erro ao enviar pedido.");

  }

});
// ===== INICIAR =====
carregarPedidos();
atualizarBotoes();
</script>
