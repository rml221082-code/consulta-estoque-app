<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos de Compras</title>

<style>
  
body {
  font-family: Arial;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
}

h1, h2 { text-align:center; }

.form-container {
  background:#fff;
  max-width:900px;
  margin:auto;
  padding:20px;
  border-radius:6px;
}

.grupo {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:15px;
}

input, select, textarea {
  width:100%;
  padding:8px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:4px;
}

.botoes {
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

button {
  padding:10px 18px;
  border:none;
  border-radius:4px;
  cursor:pointer;
  font-weight:bold;
}

.btn-salvar { background:#2f80ed;color:#fff; }
.btn-limpar { background:#ccc; }

table {
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th {
  background:#1f6feb;
  color:#fff;
  padding:10px;
}

td {
  padding:8px;
  border:1px solid #ddd;
  text-align:center;
}
.status-pendente {
  background: #fff3cd;
  color: #856404;
  font-weight: bold;
  border-radius: 6px;
  padding: 4px;
}

.status-comprado {
  background: #cce5ff;
  color: #004085;
  font-weight: bold;
  border-radius: 6px;
  padding: 4px;
}

.status-entregue {
  background: #d4edda;
  color: #155724;
  font-weight: bold;
  border-radius: 6px;
  padding: 4px;
}

.linha-emergencial {
  background: #ffe6e6 !important;
}
</style>
</head>

<body>

<h1>Solicitação de Compras</h1>

<div class="form-container">
<form id="formPedidos">

<div class="grupo">
  <div>
    <label>Funcionário</label>
    <select name="funcionario" required>
      <option value="">Selecione</option>
      <option>Altair</option>
      <option>Daniel</option>
      <option>Duarte</option>
      <option>Guilherme</option>
      <option>Josué</option>
      <option>Juliana</option>
      <option>Júlio</option>
      <option>Mayara</option>
      <option>Robson</option>
      <option>Samuel</option>
    </select>
  </div>

  <div>
    <label>Departamento</label>
    <select name="departamento" required>
      <option value="">Selecione</option>
      <option>Oficina</option>
      <option>Pintura</option>
      <option>Escritório</option>
      <option>Limpeza</option>
      <option>Outros</option>
    </select>
  </div>
</div>

<div>
  <label>Observação</label>
  <textarea name="observacao"></textarea>
</div>

<div>
  <label>Emergencial</label>
  <select name="emergencial">
    <option value="NAO">Não</option>
    <option value="SIM">Sim</option>
  </select>
</div>

<div class="botoes">
  <button type="reset" class="btn-limpar">Limpar</button>
  <button type="submit" class="btn-salvar">Salvar</button>
</div>

</form>
</div>

<h2>Pedidos</h2>

<table>
<thead>
<tr>
  <th>Data</th>
  <th>Funcionário</th>
  <th>Departamento</th>
  <th>Obs</th>
  <th>🚨Emergencial</th>
  <th>Status</th>
  <th>Previsão</th>
  <th>Ação</th>
</tr>
</thead>
<tbody id="tbodyPedidos"></tbody>
</table>
<script src="config.js"></script>
<script>
const API_URL = window.CONFIG.API_URL;
</script>
<script>

// ===== FORMATAR DATA =====
function formatarDataBR(data){
  if(!data) return "";

  const d = new Date(data);
  if(isNaN(d)) return "";

  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR");
}
function formatarDataISO(data){
  if(!data) return "";
  const d = new Date(data);
  if(isNaN(d)) return "";
  return d.toISOString().split("T")[0];
}




// ===== AÇÕES =====
function comprar(linha){
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
      action:"marcarcomprado",
      linha:linha
    })
  }).then(()=>carregarPedidos());
}

function entregar(linha){
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
      action:"marcarentregue",
      linha:linha
    })
  }).then(()=>carregarPedidos());
}

function salvarPrevisao(linha,data){

  if(!data) return;

  // 1. Salva a data
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
      action:"salvarprevisao",
      linha:linha,
      previsao:data
    })
  })
  .then(() => {

    // 2. MUDA STATUS PARA COMPRADO AUTOMATICAMENTE
    return fetch(API_URL,{
      method:"POST",
      body:new URLSearchParams({
        action:"marcarcomprado",
        linha:linha
      })
    });

  })
  .then(() => {

    // 3. Atualiza a tela
    carregarPedidos();

  });
}

// ===== SALVAR FORM =====
async function carregarPedidos(){

  const tbody = document.getElementById("tbodyPedidos");

  tbody.innerHTML = `
    <tr>
      <td colspan="8">Carregando...</td>
    </tr>
  `;

  try{

    const res = await fetch(API_URL + "?action=listarpedidos");
    const resJson = await res.json();

    console.log("PEDIDOS:", resJson);

    const dados = Array.isArray(resJson)
      ? resJson
      : (resJson.rows || resJson.dados || []);

    tbody.innerHTML = "";

    if(dados.length === 0){
      tbody.innerHTML = `
        <tr>
          <td colspan="8">Nenhum pedido encontrado</td>
        </tr>
      `;
      return;
    }

    dados.forEach(p => {

      tbody.innerHTML += `
        <tr>
          <td>${formatarDataBR(p.dataHora)}</td>
          <td>${p.funcionario || ""}</td>
          <td>${p.departamento || ""}</td>
          <td>${p.observacao || ""}</td>
          <td>${p.emergencial === "SIM" ? "🚨SIM🚨" : "NÃO"}</td>
          <td class="${
  p.status === "PENDENTE" ? "status-pendente" :
  p.status === "COMPRADO" ? "status-comprado" :
  "status-entregue"
}">
  ${
    p.status === "PENDENTE" ? "🟡 PENDENTE" :
    p.status === "COMPRADO" ? "🔵 COMPRADO" :
    "🟢 ENTREGUE"
  }
</td>
          <td>
            <input type="date"
              value="${formatarDataISO(p.previsao)}"
              onchange="salvarPrevisao(${p.linha}, this.value)">
          </td>
          <td>
            ${
              p.status === "PENDENTE"
              ? `<button onclick="comprar(${p.linha})">Comprar</button>`
              : `<button onclick="entregar(${p.linha})">Entregue</button>`
            }
          </td>
        </tr>
      `;
    });

  }catch(err){
    console.error(err);
    tbody.innerHTML = `
      <tr>
        <td colspan="8">Erro ao carregar pedidos</td>
      </tr>
    `;
  }
}
// ===== ENVIAR PEDIDO (FORMULÁRIO) =====
document.getElementById("formPedidos").addEventListener("submit", async function(e){
  e.preventDefault();

  const form = e.target;

  const dados = {
    action: "salvarpedido",
    funcionario: form.funcionario.value,
    departamento: form.departamento.value,
    observacao: form.observacao.value,
    emergencial: form.emergencial.value
  };

  try{

    const res = await fetch(API_URL, {
      method: "POST",
      body: new URLSearchParams(dados)
    });

    const json = await res.json();

    if(json.success){

      alert("✅ Pedido enviado com sucesso!");

      form.reset();

      carregarPedidos(); // atualiza tabela

    }else{
      alert("Erro: " + (json.erro || "Falha ao salvar"));
    }

  }catch(err){
    console.error(err);
    alert("Erro de conexão");
  }

});
// ===== INICIAR =====
carregarPedidos();
</script>

</body>
</html>
