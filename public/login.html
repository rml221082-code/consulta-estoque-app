<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="icon" type="image/png" href="https://i.imgur.com/PQgJbGG.png">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Segoe UI", Arial, sans-serif;
  min-height:100vh;
  background:linear-gradient(180deg,#121111,#1f1f1f);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* CARD LOGIN */
.box{
  width:100%;
  max-width:380px;
  background:#fff;
  border-radius:24px;
  padding:35px 25px;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  text-align:center;
  animation:fade .4s ease;
}

/* LOGO */
.logo{
  width:85px;
  height:85px;
  object-fit:contain;
  margin-bottom:15px;
}

h2{
  font-size:24px;
  color:#121111;
  margin-bottom:25px;
}

/* INPUTS */
.input-group{
  position:relative;
  margin-bottom:15px;
}

.input-group input{
  width:100%;
  height:52px;
  border-radius:14px;
  border:1px solid #dcdcdc;
  padding:0 15px;
  font-size:15px;
  outline:none;
  transition:.2s;
  background:#f8f8f8;
}

.input-group input:focus{
  border-color:#121111;
  background:#fff;
  box-shadow:0 0 0 4px rgba(0,0,0,.06);
}

/* BOTÕES */
button{
  width:100%;
  height:50px;
  border:none;
  border-radius:14px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

.login{
  background:#121111;
  color:#fff;
  margin-top:10px;
}

.login:hover{
  transform:translateY(-1px);
}

.google{
  background:#db4437;
  color:#fff;
  margin-top:12px;
}

.google:hover{
  transform:translateY(-1px);
}

.reset{
  background:#f2f2f2;
  color:#121111;
  margin-top:12px;
}

/* ALERTA */
#erro{
  margin-top:15px;
  font-size:14px;
  color:red;
  word-break:break-word;
}

/* INFO */
.info{
  margin-top:18px;
  font-size:12px;
  color:#d9534f;
  line-height:1.5;
}

/* MOBILE */
@media screen and (max-width:480px){

  body{
    padding:15px;
    align-items:flex-start;
  }

  .box{
    margin-top:30px;
    padding:30px 20px;
    border-radius:22px;
  }

  h2{
    font-size:22px;
  }

  button{
    height:52px;
    font-size:16px;
  }

  .input-group input{
    height:54px;
    font-size:16px;
  }

}

/* ANIMAÇÃO */
@keyframes fade{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>
</head>

<body>

<div class="box">

  
  <h2>🔐 Sistema da Hidrauman</h2>

  <div class="input-group">
    <input id="email" type="email" placeholder="Digite seu email">
  </div>

  <div class="input-group">
    <input id="senha" type="password" placeholder="Digite sua senha">
  </div>

  <button class="login" onclick="login()">
    Entrar
  </button>

  <button class="google" onclick="loginGoogle()">
    Entrar com Google
  </button>

  <button class="reset" onclick="resetSenha()">
    Esqueci minha senha
  </button>

  <p class="info">
    ⚠️ Não recebeu o email?<br>
    Confira também o <b>Spam</b> ou <b>Lixeira</b>.
  </p>

  <p id="erro"></p>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCxrHKJhD7sY3msvUrDBbeNNvFeuYsAQuA",
  authDomain: "consulta-estoque-app.firebaseapp.com",
  projectId: "consulta-estoque-app",
  storageBucket: "consulta-estoque-app.appspot.com",
  messagingSenderId: "1065893590092",
  appId: "1:1065893590092:web:479ebc4a07cf66457430e9"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

/* AUTO LOGIN */
auth.onAuthStateChanged(user => {

  if(user){
    localStorage.setItem("usuarioLogado", user.email);
    window.location.href = "index.html";
  }

});

/* LOGIN EMAIL */
function login(){

  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  auth.signInWithEmailAndPassword(email, senha)

    .then((userCredential) => {

      const user = userCredential.user;

      localStorage.setItem("usuarioLogado", user.email);
      localStorage.setItem("loginTime", Date.now());

      window.location.href = "index.html";

    })

    .catch(err => {

      document.getElementById("erro").style.color = "red";
      document.getElementById("erro").innerText = err.message;

    });

}

/* LOGIN GOOGLE */
function loginGoogle(){

  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)

    .then((result) => {

      const user = result.user;

      localStorage.setItem("usuarioLogado", user.email);
      localStorage.setItem("loginTime", Date.now());

      window.location.href = "index.html";

    })

    .catch(err => {

      document.getElementById("erro").style.color = "red";
      document.getElementById("erro").innerText = err.message;

    });

}

/* RESET SENHA */
function resetSenha(){

  const email = document.getElementById("email").value;

  if(!email){

    document.getElementById("erro").style.color = "red";
    document.getElementById("erro").innerText =
      "Digite seu email primeiro";

    return;
  }

  auth.sendPasswordResetEmail(email)

    .then(() => {

      document.getElementById("erro").style.color = "green";

      document.getElementById("erro").innerText =
        "📩 Email de redefinição enviado!";

    })

    .catch(err => {

      document.getElementById("erro").style.color = "red";
      document.getElementById("erro").innerText = err.message;

    });

}

</script>

</body>
</html>
