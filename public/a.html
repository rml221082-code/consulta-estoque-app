<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin-bottom: 30px;
      color: #333;
      text-align: center;
    }

    .botoes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 500px;
      padding: 0 20px;
      margin-bottom: 30px;
    }

    .botoes a {
      text-decoration: none;
    }

    /* BOTÃO BASE */
    .btn {
      width: 100%;
      padding: 18px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* AZUL */
    .btn-azul {
      background: #2f80ed;
    }

    /* VERMELHO */
    .btn-vermelho {
      background: #ed3c2f;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 22px;
      }

      .btn {
        font-size: 15px;
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <h1>Links</h1>

  <!-- BOTÕES AZUIS -->
  <div class="botoes">
    <a href="https://consulta-estoque-app.web.app/servico.html">
      <button class="btn btn-azul">Entrada de Serviço</button>
    </a>

    <a href="https://consulta-estoque-app.web.app/controledeveiculo.html">
      <button class="btn btn-azul">Controle de Veículo</button>
    </a>

    <a href="https://consulta-estoque-app.web.app/manutencaodeveiculo.html">
      <button class="btn btn-azul">Manutenção de Veículo</button>
    </a>

    <a href="https://consulta-estoque-app.web.app/pedidosdecompras.html">
      <button class="btn btn-azul">Pedidos de Compras</button>
    </a>

    <a href="https://consulta-estoque-app.web.app/aguardando.html">
      <button class="btn btn-azul">Aguardando</button>
    </a>

    <a href="https://consulta-estoque-app.web.app/entrada.html">
      <button class="btn btn-azul">Entrada Mercadoria</button>
    </a>

    <a href="https://consulta-estoque-app.web.app/venda.html">
      <button class="btn btn-azul">Venda</button>
    </a>
  </div>
  
<h1>EM TESTE</h1>
  <!-- BOTÕES VERMELHOS -->
  <div class="botoes">
    <a href="https://consulta-estoque-app.web.app/orcamento.html">
      <button class="btn btn-vermelho">Orçamento</button>
    </a>

    <a href="https://consulta-estoque-app.web.app/aguardando.html">
      <button class="btn btn-vermelho">Aguardando</button>
    </a>
    <a href="https://consulta-estoque-app.web.app/entradanotas.html">
      <button class="btn btn-vermelho">Entrada de Notas</button>
    </a>
     <a href="https://consulta-estoque-app.web.app/controlefiscal.html">
      <button class="btn btn-vermelho">Controle Fiscal</button>
    </a>
    <a href="https://consulta-estoque-app.web.app/relatoriofiscal.html">
      <button class="btn btn-vermelho">Relatório Fiscal</button>
    </a>
     <a href="https://consulta-estoque-app.web.app/imagens.html">
      <button class="btn btn-vermelho">Inserir Imagens</button>
    </a>
  </div>

</body>
</html>
