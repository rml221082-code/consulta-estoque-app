<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veículos</title>
<style>
  /* --- CSS EXISTENTE --- */
 /* ===== ESTILO GERAL ===== */
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
}

h1, h2 {
  text-align: center;
}

/* ===== FORMULÁRIO (PARTE DE CIMA) ===== */
.form-container {
  background: #fff;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  border-radius: 6px;
}

.form-containerbotao {
  background: #fff;
  max-width: 250px;
  margin: auto;
  padding: 15px;
  border-radius: 6px;
  margin-bottom: 20px;
}

.grupo {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin-bottom: 15px;
}

label {
  font-size: 13px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

textarea {
  resize: vertical;
}

.botoes {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

button {
  padding: 10px 18px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}

.btn-salvar {
  background: #2f80ed;
  color: #fff;
}

.btn-limpar {
  background: #ccc;
}

button:hover {
  opacity: 0.9;
}

/* ===== TABELA NOVA (SOMENTE PARTE DE BAIXO) ===== */
.tabela-nova table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  font-size: 14px;
  border-radius: 6px;
  overflow: hidden;
}

.tabela-nova th {
  background: #1f6feb;
  color: #fff;
  padding: 12px;
  border: 1px solid #d0d7de;
  font-weight: bold;
  text-align: center;
}

.tabela-nova td {
  padding: 10px;
  border: 1px solid #e0e0e0;
  text-align: center;
}

.tabela-nova tbody tr:nth-child(even) {
  background: #f9fafb;
}

.tabela-nova tbody tr:hover {
  background: #e6f0ff;
}

</style>


</head>
<body>

  <h1>Cadastro de Manutenção Preventiva</h1>

<div class="form-containerbotao">
  <div class="botoes" style="justify-content:center">
    <a href="https://consulta-estoque-app.web.app/veiculo.html">
      <button class="btn-salvar">Voltar para Veículos</button>
    </a>
  </div>
</div>


</div>
  <div class="form-container">
    <form id="formPreventiva">


  <!-- Dados do Veículo -->
  <div class="grupo">
   <div>
      <label>Motorista</label>
      <select name="motorista" required>

        <option value="">Selecione</option>
          <option>Altair</option>
        <option>Daniel</option>
        <option>Duarte</option>
        <option>Guilherme</option>
        <option>Josué</option>
        <option>Juliana</option>
        <option>Júlio</option>
        <option>Mayara</option>
        <option>Robson</option>
        <option>Samuel</option>
    </select>
    </div> 
    <div>
      <label>Veículo</label>
     <select name="veiculo" required>

        <option value="">Selecione</option>
        <option>Saveiro</option>
        <option>Ford ka</option>
        <option>Fiorino</option>
        <option>Fox</option>
    </select>
    </div>
    <div>
      <label>Tipo de Preventiva</label>
      <select name="tipoPreventiva" required>

        <option value="">Selecione</option>
        <option>Troca de Óleo</option>
        <option>Troca Filtro de Óleo</option>
        <option>Troca Filtro de AR</option>
        <option>Troca Filtro de AR Condicionado</option>
        <option>Suspensão</option>
        <option>Freios</option>
        <option>Pneus Dianteiro</option>
        <option>Pneus Traseiro</option>
        <option>Elétrica</option>
        <option>Outros</option>
      </select>
    </div>
  </div>

  <!-- Datas e KM -->
  <div class="grupo">

    <div>
      <label>KM</label>
      <input type="number" name="km" required>

    </div>

  </div>

  <!-- Responsável -->
  <div class="grupo">
    <div>
      <label>Responsável / Oficina</label>
      <input type="text" name="oficina" required>

    </div>
    <div>
      <label>Status</label>
      <select name="status" required>

    
        <option>Próximo do Vencimento</option>
        <option>Vencido</option>
      </select>
    </div>
  </div>

  <!-- Observações -->
  <div>
    <label>Observações</label>
    <textarea name="observacao"></textarea>
  </div>

  <!-- Botões -->
  <div class="botoes">
    <button type="reset" class="btn-limpar">Limpar</button>
    <button type="submit" class="btn-salvar">Salvar</button>
  </div>

</form>


  </div>

<script>
const URL_WEBAPP = "https://script.google.com/macros/s/AKfycbwMMKgxZ_wmnUAx_BfIaYt9qkUERfQugpbDSFv9AbLaCHibcGg88XA7JTNkrFqRIFDS/exec";

// ===== SALVAR FORMULÁRIO =====
document.getElementById("formPreventiva").addEventListener("submit", function(e) {
  e.preventDefault();

  const formData = new FormData(this);
  formData.append("action", "manutencao");
  fetch(URL_WEBAPP, {
    method: "POST",
    body: formData
  })
  .then(r => r.text())
  .then(() => {
    alert("Dados salvos com sucesso!");
    this.reset();
    carregarUltimas();
  })
  .catch(err => {
    alert("Erro ao salvar");
    console.error(err);
  });
});

// ===== CARREGAR ÚLTIMAS 10 MANUTENÇÕES =====
function carregarUltimas() {
  fetch(URL_WEBAPP + "?action=listarManutencao")
    .then(r => r.json())
    .then(dados => {
      const tbody = document.querySelector("#tabelaManutencao tbody");
      tbody.innerHTML = "";

      if (!dados.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align:center">
              Nenhum registro encontrado
            </td>
          </tr>`;
        return;
      }

      dados.forEach(l => {
        tbody.innerHTML += `
          <tr>
            <td>${l.dataHora}</td>
            <td>${l.motorista}</td>
            <td>${l.veiculo}</td>
            <td>${l.tipoPreventiva}</td>
            <td>${l.km}</td>
            <td>${l.status}</td>
            <td>${l.observacao || ""}</td>
          </tr>
        `;
      });
    })
    .catch(err => {
      console.error(err);
      document.querySelector("#tabelaManutencao tbody").innerHTML = `
        <tr>
          <td colspan="7" style="text-align:center">
            Erro ao carregar dados
          </td>
        </tr>`;
    });
}

document.addEventListener("DOMContentLoaded", carregarUltimas);
</script>





<div style="margin-top:30px;">

  <h2>Últimas Manutenções</h2>

  <div class="tabela-container tabela-nova">
    <table id="tabelaManutencao">
      <thead>
        <tr>
          <th>Data/Hora</th>
          <th>Motorista</th>
          <th>Veículo</th>
          <th>Preventiva</th>
          <th>KM</th>
          <th>Status</th>
          <th>Observação</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="7" style="text-align:center">Carregando...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>


</body>
</html>
