<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle Fiscal PRO V3</title>

<style>

*{box-sizing:border-box}

body{
font-family:Arial;
background:#f4f6f8;
padding:20px
}

.container{
max-width:1750px;
margin:auto;
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,.08)
}

h1{margin-bottom:20px}

/* DASHBOARD */

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px
}

.card{
background:#f7f9fb;
padding:15px;
border-radius:8px;
text-align:center
}

.card h2{
margin:0;
font-size:22px
}

.card span{
font-size:13px;
color:#666
}

.atrasadoCard{background:#ffe5e5}
.pagoCard{background:#e6f7ea}
.hojeCard{background:#fff7cc}

/* FILTROS */

.row{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
margin-bottom:15px
}

input,select{
padding:8px;
border:1px solid #ccc;
border-radius:6px
}

/* TABELA */

table{
width:100%;
border-collapse:collapse;
font-size:13px
}

th,td{
padding:7px;
border-bottom:1px solid #ddd;
text-align:center
}

th{
background:#f0f2f5
}

tr:hover{
background:#fafafa
}

/* BADGE */

.badge{
padding:3px 7px;
border-radius:10px;
font-size:11px
}

.sim{background:#ffdede;color:#b30000}
.nao{background:#e3f3ff;color:#005a9e}

/* BOTÕES */

.btn{
border:none;
padding:4px 8px;
border-radius:5px;
font-size:11px;
cursor:pointer;
color:#fff;
margin:2px
}

.pagar{background:#0078d4}
.pago{background:#16a34a}
.atrasado{background:#dc2626}
.hoje{background:#eab308}

.cancelar{background:#444}

.parcelaBox{
border:1px solid #eee;
border-radius:6px;
padding:4px;
margin-bottom:4px
}

.parcelaValor{
font-size:11px;
color:#444
}

.parcelaData{
font-size:10px;
color:#888
}

</style>
</head>

<body>

<div class="container">

<h1>Controle Fiscal PRO V3</h1>

<div class="dashboard">

<div class="card">
<span>Total Notas</span>
<h2 id="dNotas">0</h2>
</div>

<div class="card pagoCard">
<span>Total Pago</span>
<h2 id="dPago">0</h2>
</div>

<div class="card">
<span>Em Aberto</span>
<h2 id="dAberto">0</h2>
</div>

<div class="card atrasadoCard">
<span>Parcelas Atrasadas</span>
<h2 id="dAtrasado">0</h2>
</div>

<div class="card hojeCard">
<span>Vencendo Hoje</span>
<h2 id="dHoje">0</h2>
</div>

</div>

<div class="row">

<select id="fEmpresa">
<option value="">Empresa</option>
</select>
<input type="date" id="fDataInicio">
<input type="date" id="fDataFim">
<input id="fFornecedor" placeholder="Fornecedor">

<input id="fNota" placeholder="Nota">

<select id="fStatus">
<option value="">Todos</option>
<option value="ATIVO"selected>ATIVO</option>
<option value="CANCELADO">CANCELADO</option>
</select>

</div>
<div style="margin-bottom:15px;display:flex;gap:10px;flex-wrap:wrap;">

<button onclick="filtroHoje()" class="btn hoje">Hoje</button>

<button onclick="filtroAtrasadas()" class="btn atrasado">Atrasadas</button>

<button onclick="filtro7Dias()" class="btn pagar">Próximos 7 dias</button>

<button onclick="limparFiltroData()" class="btn cancelar">Limpar Datas</button>

</div>
<table>

<thead>

<tr>
<th>Empresa</th>
<th>Nota</th>
<th>Fornecedor</th>
<th>Total</th>
<th>Pago</th>
<th>Saldo</th>
<th>Parcelas</th>
<th>Emergencial</th>
<th>PDF</th>
<th>Ação</th>
</tr>

</thead>

<tbody id="lista"></tbody>

</table>

</div>

<script>

const GAS_URL="https://script.google.com/macros/s/AKfycbzxdnIzDmsjy06njan7yro4BO78sZ-n9tpp1yTjshrQmdhHu03L7rYnP5ppQtg90wwbng/exec"

let dados=[]

function hoje(){
const h = new Date()
return new Date(h.getFullYear(), h.getMonth(), h.getDate(), 0,0,0,0)
}

function carregar(){

fetch(GAS_URL+"?action=listarnotasfiscais")
.then(r=>r.json())
.then(json=>{

dados=json.rows || []

popularFiltros()

render()

})

}

function popularFiltros(){

const select=document.getElementById("fEmpresa")

select.innerHTML='<option value="">Empresa</option>'

const empresas=[...new Set(dados.map(d=>d.empresa))]

empresas.sort()

empresas.forEach(e=>{
if(e) select.innerHTML+=`<option>${e}</option>`
})

}
function calcularFinanceiro(n){

let pago = 0
let total = Number(n.valorTotal)

for(let i=1;i<=10;i++){

let valorParcela = Number(n["valorParcela"+i] || 0)
let pagoValor = Number(n["pagamentoValor"+i] || 0)
let statusPago = String(n["pagamento"+i] || "").toUpperCase().trim()

if(statusPago === "PAGO"){
  pago += valorParcela
}

}

return{
pago,
saldo: total - pago
}
}

function pagarParcela(id,parcela){

fetch(GAS_URL+`?action=pagarparcela&id=${id}&parcela=${parcela}&t=`+Date.now())
.then(()=>carregar())

}

function cancelarNota(id){

if(!confirm("Cancelar esta nota?")) return

fetch(GAS_URL+`?action=cancelarnota&id=${id}`)
.then(r=>r.json())
.then(r=>{
if(r.success){
carregar()
}else{
alert("Erro ao cancelar")
}
})

}
function pegarVencimento(n, i){
  return n["vencimento"+i] || n["VENCIMENTO "+i] || null
}
function filtrar(){

return dados.filter(n=>{

if(fEmpresa.value && n.empresa!=fEmpresa.value) return false

if(fFornecedor.value && !(n.fornecedor || "").toLowerCase().includes(fFornecedor.value.toLowerCase())) return false

if(fNota.value){

const notaFiltro = fNota.value.trim().toLowerCase()

const notaSistema = String(n.numeroNota || "").trim().toLowerCase()

if(!notaSistema.includes(notaFiltro)) return false

}

if(fStatus.value && n.status!=fStatus.value) return false

// 🔎 FILTRO POR DATA DE VENCIMENTO
if(fDataInicio.value || fDataFim.value){

let inicio = fDataInicio.value ? converterDataBR(fDataInicio.value) : null
let fim    = fDataFim.value ? converterDataBR(fDataFim.value) : null

if(inicio) inicio.setHours(0,0,0,0)
if(fim)    fim.setHours(23,59,59,999)

let temNoPeriodo = false

for(let i=1;i<=n.qtdParcelas;i++){

let venc = pegarVencimento(n, i)

if(!venc) continue

let dataVenc = converterDataBR(venc)

if(!dataVenc) continue

if(inicio && dataVenc < inicio) continue
if(fim && dataVenc > fim) continue
temNoPeriodo = true
break

}

if(!temNoPeriodo) return false

}

return true

})
}
function formatarDataInput(data){
return data.toISOString().split("T")[0]
}

// 📅 HOJE
function filtroHoje(){

const h = hoje()

fDataInicio.value = formatarDataInput(h)
fDataFim.value    = formatarDataInput(h)

render()
}

// 🔴 ATRASADAS
function filtroAtrasadas(){

const h = hoje()

fDataInicio.value = "" // tudo antes de hoje
fDataFim.value    = formatarDataInput(h)

render()
}

// 🔵 PRÓXIMOS 7 DIAS
function filtro7Dias(){

const h = hoje()

const futuro = new Date()
futuro.setDate(h.getDate() + 7)

fDataInicio.value = formatarDataInput(h)
fDataFim.value    = formatarDataInput(futuro)

render()
}

// 🔄 LIMPAR
function limparFiltroData(){

fDataInicio.value = ""
fDataFim.value    = ""

render()
}
function render(){

const tbody=document.getElementById("lista")

tbody.innerHTML=""

let totalNotas=0
let totalPago=0
let totalAtrasado=0
let vencHoje=0

const lista=filtrar()

lista.forEach(n=>{

const fin=calcularFinanceiro(n)

totalNotas+=Number(n.valorTotal)
totalPago+=fin.pago

let parcelasHTML=""

for(let i=1;i<=n.qtdParcelas;i++){

  let valor = n["valorParcela"+i]
  let venc = pegarVencimento(n, i)

  let classe = "pagar"
  let textoBotao = `P${i}`

  let vencDate = converterDataBR(venc)

  let status = String(n["pagamento"+i] || "").toUpperCase()
  let pagoValor = Number(n["pagamentoValor"+i] || 0)

  function mesmaData(d1, d2){
    if(!d1 || !d2) return false
    return (
      d1.getFullYear() === d2.getFullYear() &&
      d1.getMonth() === d2.getMonth() &&
      d1.getDate() === d2.getDate()
    )
  }

  // ✅ STATUS
  if(status === "PAGO" || pagoValor > 0){
    classe = "pago"
    textoBotao = "✔ Pago"

  }else if(vencDate && mesmaData(vencDate, hoje())){
    classe="hoje"
    vencHoje++

  }else if(vencDate && vencDate.getTime() < hoje().getTime()){
    classe="atrasado"
    totalAtrasado+=Number(valor||0)
  }

  // 📅 FORMATAR DATA
  let dataFormat = "-"

  if(vencDate && !isNaN(vencDate)){
    dataFormat =
      vencDate.getDate().toString().padStart(2,'0')+"/"+
      (vencDate.getMonth()+1).toString().padStart(2,'0')+"/"+
      vencDate.getFullYear()
  }

  parcelasHTML+=`
  <div class="parcelaBox">

    <button class="btn ${classe}" onclick="pagarParcela('${n.id}',${i})">
      ${textoBotao}
    </button>

    <div class="parcelaValor">
      R$ ${Number(valor||0).toFixed(2)}
    </div>

    <div class="parcelaData">
      ${dataFormat}
    </div>

  </div>
  `
}
tbody.innerHTML+=`

<tr>

<td>${n.empresa}</td>
<td>${n.numeroNota}</td>
<td>${n.fornecedor}</td>

<td>R$ ${Number(n.valorTotal).toFixed(2)}</td>
<td>R$ ${fin.pago.toFixed(2)}</td>
<td>R$ ${fin.saldo.toFixed(2)}</td>

<td>${parcelasHTML}</td>

<td>
<span class="badge ${n.emergencial=="SIM"?"sim":"nao"}">
${n.emergencial}
</span>
</td>

<td>
<a href="${n.pdf}" target="_blank">PDF</a>
</td>

<td>
<button class="btn pagar" onclick="abrirEdicao('${n.id}')">
Editar
</button>

<button class="btn cancelar" onclick="cancelarNota('${n.id}')">
Cancelar
</button>
</td>

</tr>

`

})

dNotas.innerText="R$ "+totalNotas.toFixed(2)
dPago.innerText="R$ "+totalPago.toFixed(2)
dAberto.innerText="R$ "+(totalNotas-totalPago).toFixed(2)
dAtrasado.innerText="R$ "+totalAtrasado.toFixed(2)
dHoje.innerText=vencHoje

}

document.querySelectorAll("#fEmpresa,#fFornecedor,#fNota,#fStatus,#fDataInicio,#fDataFim")
.forEach(el=>el.addEventListener("input",render))

carregar()

setTimeout(()=>{
filtroHoje()
},500)
let notaEditando = null

function abrirEdicao(id){

const nota = dados.find(n => String(n.id) === String(id))

if(!nota){
alert("Nota não encontrada")
return
}

notaEditando = nota

document.getElementById("eEmpresa").value = nota.empresa || ""
document.getElementById("eNota").value = nota.numeroNota || ""
document.getElementById("eFornecedor").value = nota.fornecedor || ""
document.getElementById("eTotal").value = nota.valorTotal || ""
document.getElementById("eEmergencial").value = nota.emergencial || "NAO"

// 🔥 parcelas
let html = ""

for(let i=1;i<=nota.qtdParcelas;i++){

let valor = nota["valorParcela"+i] || ""
let venc = nota["vencimento"+i] || ""

// converter data BR -> input
if(venc && venc.includes("/")){
let p = venc.split("/")
venc = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`
}

html += `
<div style="border:1px solid #ddd;padding:8px;margin-bottom:5px;border-radius:6px">
<strong>Parcela ${i}</strong><br>

<label>Valor</label>
<input id="eValor${i}" type="number" value="${valor}">

<label>Vencimento</label>
<input id="eVenc${i}" type="date" value="${venc}">
</div>
`
}

document.getElementById("parcelasEdit").innerHTML = html

document.getElementById("modalEditar").style.display = "flex"
}
function fecharModal(){
modalEditar.style.display = "none"
}
function salvarEdicao(){

if(!notaEditando) return

let dadosEnvio = {

action:"salvarnotafiscal",

empresa: eEmpresa.value,
numeroNota: eNota.value,
fornecedor: eFornecedor.value,
valorTotal: eTotal.value,
emergencial: eEmergencial.value,
qtdParcelas: notaEditando.qtdParcelas

}

// 🔥 pegar parcelas editadas
for(let i=1;i<=notaEditando.qtdParcelas;i++){

dadosEnvio["valorParcela"+i] = document.getElementById("eValor"+i).value
dadosEnvio["vencimento"+i] = document.getElementById("eVenc"+i).value

}

fetch(GAS_URL,{
method:"POST",
body:JSON.stringify(dadosEnvio)
})
.then(r=>r.json())
.then(r=>{

if(r.success){

// 🔴 cancela antiga automaticamente
fetch(GAS_URL+`?action=cancelarnota&id=${notaEditando.id}`)

fecharModal()
carregar()

}else{
alert("Erro ao salvar")
}

})

}
function converterDataBR(data){

if(!data) return null

// 🔥 se já for Date
if(data instanceof Date){
return new Date(data.getFullYear(), data.getMonth(), data.getDate())
}

// 🔥 se for número (timestamp)
if(typeof data === "number"){
let d = new Date(data)
return new Date(d.getFullYear(), d.getMonth(), d.getDate())
}

// 🔥 se for string
if(typeof data === "string"){

data = data.trim()

// formato BR 17/04/2026
if(data.includes("/")){
const [dia, mes, ano] = data.split("/")
return new Date(Number(ano), Number(mes)-1, Number(dia))
}

// formato ISO completo 2026-04-17T00:00:00.000Z
if(data.includes("T")){
let d = new Date(data)
return new Date(d.getFullYear(), d.getMonth(), d.getDate())
}

// formato YYYY-MM-DD
if(data.includes("-")){
const [ano, mes, dia] = data.split("-")
return new Date(Number(ano), Number(mes)-1, Number(dia))
}

}

return null
}
</script>
<div id="modalEditar" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
z-index:999;
">

<div style="
background:#fff;
padding:20px;
border-radius:10px;
width:500px;
max-height:90vh;
overflow:auto;
">

<h3>Editar Nota Fiscal</h3>

<label>Empresa</label>
<input id="eEmpresa"><br><br>

<label>Número da Nota</label>
<input id="eNota"><br><br>

<label>Fornecedor</label>
<input id="eFornecedor"><br><br>

<label>Valor Total</label>
<input id="eTotal" type="number"><br><br>

<label>Emergencial</label>
<select id="eEmergencial">
<option value="NAO">NÃO</option>
<option value="SIM">SIM</option>
</select>

<br><br>

<h4>Parcelas</h4>

<div id="parcelasEdit"></div>

<br>

<button class="btn pago" onclick="salvarEdicao()">Salvar</button>
<button class="btn cancelar" onclick="fecharModal()">Fechar</button>

</div>
</div>
</body>
</html>
