<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>

<style>
body {
  font-family: "Segoe UI", Arial;
  background: #f4f6f9;
  padding: 20px;
  margin: 0;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

/* CARD */
.card {
  background: white;
  padding: 15px 20px;
  margin: 12px auto;
  max-width: 700px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-3px);
}

/* INFO */
.info b {
  font-size: 16px;
}

.status {
  font-weight: bold;
  margin-top: 5px;
}

.ativo {
  color: green;
}

.bloqueado {
  color: red;
}

/* BOTÕES */
.acoes {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

button {
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: white;
}

/* CORES */
.btn-admin { background: #007bff; }
.btn-adm { background: #8e44ad; }
.btn-func { background: #6c757d; }
.btn-bloquear { background: #dc3545; }
.btn-desbloquear { background: #28a745; }
.btn-whats { background: #25d366; }
.btn-salvar { background: #002352; }

button:hover {
  opacity: 0.85;
}
/* TIPO DESTACADO */
.tipo-usuario{
  display:inline-block;
  margin-top:10px;
  padding:8px 14px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
  color:#fff;
  text-transform:uppercase;
  letter-spacing:.5px;
}

/* CORES POR TIPO */
.tipo-admin{
  background:#dc3545;
}

.tipo-administrativo{
  background:#8e44ad;
}

.tipo-funcionario{
  background:#6c757d;
}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:"Segoe UI", Arial;
  background:#f4f6f9;
  padding:20px;
  margin:0;
}

/* TÍTULO */
h1{
  text-align:center;
  margin-bottom:25px;
  font-size:32px;
  color:#121111;
}

/* CARD */
.card{
  background:white;
  padding:18px;
  margin:12px auto;
  max-width:700px;
  border-radius:16px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  box-shadow:0 3px 12px rgba(0,0,0,0.08);
  transition:.3s;
}

.card:hover{
  transform:translateY(-3px);
}

/* INFO */
.info{
  flex:1;
  min-width:0;
}

.info b{
  font-size:17px;
  color:#121111;
}

.info input{
  width:100%;
  margin-top:8px;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
}

/* STATUS */
.status{
  font-weight:bold;
  margin-top:8px;
  font-size:14px;
}

.ativo{
  color:green;
}

.bloqueado{
  color:red;
}

/* BOTÕES */
.acoes{
  display:flex;
  flex-direction:column;
  gap:8px;
  width:170px;
}

button{
  border:none;
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  color:white;
  font-weight:bold;
  transition:.2s;
}

button:hover{
  opacity:.88;
}

/* CORES */
.btn-admin{ background:#007bff; }
.btn-adm{ background:#8e44ad; }
.btn-func{ background:#6c757d; }
.btn-bloquear{ background:#dc3545; }
.btn-desbloquear{ background:#28a745; }
.btn-whats{ background:#25d366; }
.btn-salvar{ background:#002352; }

/* ALERTA */
#alerta{
  display:none;
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#16a34a;
  color:#fff;
  padding:15px 20px;
  border-radius:10px;
  z-index:9999;
  font-family:Arial;
}

/* =========================
   MOBILE
========================= */
@media screen and (max-width:768px){

  body{
    padding:12px;
  }

  h1{
    font-size:24px;
    margin-bottom:20px;
  }

  .card{
    flex-direction:column;
    align-items:stretch;
    padding:15px;
    border-radius:14px;
  }

  .info{
    width:100%;
  }

  .info b{
    font-size:16px;
    word-break:break-word;
  }

  .info{
    font-size:14px;
  }

  .info input{
    font-size:15px;
    height:45px;
  }

  .acoes{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
  }

  button{
    width:100%;
    min-height:44px;
    font-size:13px;
    padding:10px;
  }

  .btn-whats{
    grid-column:span 2;
  }

  .btn-salvar{
    width:100%;
    margin-top:8px;
  }

  #alerta{
    width:90%;
    text-align:center;
    font-size:14px;
  }

}
</style>
</head>
<body>

<h1>Painel de Usuários</h1>
<div id="alerta" style="
  display:none;
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#16a34a;
  color:#fff;
  padding:15px 20px;
  border-radius:10px;
  z-index:9999;
  font-family:Arial;
">
</div>

<div id="usuarios"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
// ⏱ tempo máximo = 12 horas
const TEMPO_MAX = 12 * 60 * 60 * 1000;
const loginTime = localStorage.getItem("loginTime");

if (loginTime) {
  const agora = Date.now();

  if (agora - loginTime > TEMPO_MAX) {
    localStorage.removeItem("loginTime");

    if (window.firebase) {
      firebase.auth().signOut();
    }

    window.location.href = "login.html";
  }
}
</script>

<script>
function mostrarAlerta(msg){

  const alerta = document.getElementById("alerta");

  alerta.innerText = msg;

  alerta.style.display = "block";

  setTimeout(() => {
    alerta.style.display = "none";
  }, 2000);

}
const firebaseConfig = {
  apiKey: "AIzaSyCxrHKJhD7sY3msvUrDBbeNNvFeuYsAQuA",
  authDomain: "consulta-estoque-app.firebaseapp.com",
  projectId: "consulta-estoque-app",
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(async user => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const doc = await db.collection("usuarios").doc(user.uid).get();

  if (!doc.exists) {
    mostrarAlerta("Usuário não encontrado!");
    auth.signOut();
    return;
  }

  const usuario = doc.data();

  if (!usuario.ativo) {
    mostrarAlerta("Usuário bloqueado!");
    await auth.signOut();
    window.location.href = "login.html";
    return;
  }

  if (usuario.tipo !== "admin") {
    mostrarAlerta("Acesso negado!");
    window.location.href = "index.html";
    return;
  }

  carregarUsuarios();
});

async function carregarUsuarios() {
  const lista = document.getElementById("usuarios");
  lista.innerHTML = "";

  const snapshot = await db.collection("usuarios").get();

  snapshot.forEach(doc => {
    const u = doc.data();

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="info">
  <b>${u.nome}</b><br>
  ${u.email}<br>

  📱 WhatsApp:<br>
  <input id="wpp_${doc.id}" 
    value="${u.whatsapp || ""}" 
    placeholder="Ex: 11999999999">

  <button class="btn-salvar" onclick="salvarWhats('${doc.id}')">
    Salvar
  </button>

  <br><br>
  <div class="tipo-usuario tipo-${u.tipo}">
  ${u.tipo}
</div>

  <div class="status ${u.ativo === false ? "bloqueado" : "ativo"}">
    ${u.ativo === false ? "🔴 Bloqueado" : "🟢 Ativo"}
  </div>
</div>

      <div class="acoes">
        <button class="btn-admin" onclick="tornarAdmin('${doc.id}')">Admin</button>
        <button class="btn-adm" onclick="tornarAdministrativo('${doc.id}')">Administrativo</button>
        <button class="btn-func" onclick="tornarFunc('${doc.id}')">Funcionário</button>
        <button class="btn-bloquear" onclick="bloquear('${doc.id}')">Bloquear</button>
        <button class="btn-desbloquear" onclick="desbloquear('${doc.id}')">Desbloquear</button>

        ${u.whatsapp ? `
          <button class="btn-whats" onclick="abrirWhats('${u.whatsapp}')">
            WhatsApp
          </button>
        ` : ""}
      </div>
    `;

    lista.appendChild(div);
  });
}

/* AÇÕES */

function tornarAdmin(id) {
  db.collection("usuarios").doc(id).update({ tipo: "admin" });
  mostrarAlerta("Agora é ADMIN");
  carregarUsuarios();
}

function tornarAdministrativo(id) {
  db.collection("usuarios").doc(id).update({ tipo: "administrativo" });
 mostrarAlerta("Agora é ADMINISTRATIVO");
  carregarUsuarios();
}

function tornarFunc(id) {
  db.collection("usuarios").doc(id).update({ tipo: "funcionario" });
  mostrarAlerta("Agora é FUNCIONÁRIO");
  carregarUsuarios();
}

function bloquear(id) {
  db.collection("usuarios").doc(id).update({ ativo: false });
  mostrarAlerta("Usuário bloqueado");
  carregarUsuarios();
}

function desbloquear(id) {
  db.collection("usuarios").doc(id).update({ ativo: true });
  mostrarAlerta("Usuário Desbloqueado");
  carregarUsuarios();
}

/* 🔥 ABRIR WHATSAPP */
function abrirWhats(numero){
  const num = numero.replace(/\D/g, "");
  window.open(`https://wa.me/55${num}`, "_blank");
}
</script>
<script>
function salvarWhats(id){

  const input = document.getElementById("wpp_" + id);

  let numero = input.value.replace(/\D/g, "");

  if(numero.length < 10){
    mostrarAlerta("Número inválido!");
    return;
  }

  db.collection("usuarios").doc(id).update({
    whatsapp: numero
  })
  .then(()=>{
    mostrarAlerta("WhatsApp salvo!");
  })
  .catch(err=>{
    console.error(err);
    mostrarAlerta("Erro ao salvar");
  });
}
</script>
</body>
</html>
