<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>

<style>
body {
  font-family: "Segoe UI", Arial;
  background: #f4f6f9;
  padding: 20px;
  margin: 0;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

/* CARD */
.card {
  background: white;
  padding: 15px 20px;
  margin: 12px auto;
  max-width: 700px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-3px);
}

/* INFO */
.info b {
  font-size: 16px;
}

.status {
  font-weight: bold;
  margin-top: 5px;
}

.ativo {
  color: green;
}

.bloqueado {
  color: red;
}

/* BOTÕES */
.acoes {
  display: flex;
  gap: 6px;
}

button {
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: white;
}

/* CORES */
.btn-admin { background: #007bff; }
.btn-adm { background: #8e44ad; /* roxo */}
.btn-func { background: #6c757d; }
.btn-bloquear { background: #dc3545; }
.btn-desbloquear { background: #28a745; }

button:hover {
  opacity: 0.85;
}
</style>
</head>
<body>

<h1>Painel de Usuários</h1>
<div id="usuarios"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
// ⏱ tempo máximo = 12 horas
const TEMPO_MAX = 12 * 60 * 60 * 1000;

const loginTime = localStorage.getItem("loginTime");

if (loginTime) {
  const agora = Date.now();

  if (agora - loginTime > TEMPO_MAX) {
    // ⛔ sessão expirada
    localStorage.removeItem("loginTime");

    if (window.firebase) {
      firebase.auth().signOut();
    }

    window.location.href = "login.html";
  }
}
</script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCxrHKJhD7sY3msvUrDBbeNNvFeuYsAQuA",
  authDomain: "consulta-estoque-app.firebaseapp.com",
  projectId: "consulta-estoque-app",
  storageBucket: "consulta-estoque-app.firebasestorage.app",
  messagingSenderId: "1065893590092",
  appId: "1:1065893590092:web:479ebc4a07cf66457430e9"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

auth.onAuthStateChanged(async user => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const doc = await db.collection("usuarios").doc(user.uid).get();

  if (!doc.exists) {
    alert("Usuário não encontrado!");
    auth.signOut();
    return;
  }

  const usuario = doc.data();

  if (!usuario.ativo) {
    alert("Usuário bloqueado!");
    await auth.signOut();
    window.location.href = "login.html";
    return;
  }

  if (usuario.tipo !== "admin") {
    alert("Acesso negado!");
    window.location.href = "index.html";
    return;
  }

  carregarUsuarios();
});

async function carregarUsuarios() {
  const lista = document.getElementById("usuarios");
  lista.innerHTML = "";

  const snapshot = await db.collection("usuarios").get();

  snapshot.forEach(doc => {
    const u = doc.data();

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="info">
        <b>${u.nome}</b><br>
        ${u.email}<br>
        Tipo: ${u.tipo}<br>
        <div class="status ${u.ativo === false ? "bloqueado" : "ativo"}">
          ${u.ativo === false ? "🔴 Bloqueado" : "🟢 Ativo"}
        </div>
      </div>

      <div class="acoes">
        <button class="btn-admin" onclick="tornarAdmin('${doc.id}')">Admin</button>
        <button class="btn-adm" onclick="tornarAdministrativo('${doc.id}')">Administrativo</button>
        <button class="btn-func" onclick="tornarFunc('${doc.id}')">Funcionário</button>
        <button class="btn-bloquear" onclick="bloquear('${doc.id}')">Bloquear</button>
        <button class="btn-desbloquear" onclick="desbloquear('${doc.id}')">Desbloquear</button>
      </div>
    `;

    lista.appendChild(div);
  });
}

/* AÇÕES */

function tornarAdmin(id) {
  db.collection("usuarios").doc(id).update({ tipo: "admin" });
  alert("Agora é ADMIN");
  carregarUsuarios();
}
function tornarAdministrativo(id) {
  db.collection("usuarios").doc(id).update({ tipo: "administrativo" });
  alert("Agora é ADMINISTRATIVO");
  carregarUsuarios();
}
function tornarFunc(id) {
  db.collection("usuarios").doc(id).update({ tipo: "funcionario" });
  alert("Agora é FUNCIONÁRIO");
  carregarUsuarios();
}

function bloquear(id) {
  db.collection("usuarios").doc(id).update({ ativo: false });
  alert("Usuário bloqueado");
  carregarUsuarios();
}

function desbloquear(id) {
  db.collection("usuarios").doc(id).update({ ativo: true });
  alert("Usuário desbloqueado");
  carregarUsuarios();
}
</script>

</body>
</html>
