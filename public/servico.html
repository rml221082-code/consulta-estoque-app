<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serviço</title>
<style>
  /* RESET básico */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
.checklist label {
  font-size: 15px;
  padding: 8px;
  background: #f9fafc;
  border-radius: 6px;
}
.checklist input[type="checkbox"] {
  margin-right: 10px;
  width: 18px;
  height: 18px;
  accent-color: #0078d4; /* cor azul */
}

  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f4f6f8;
    color: #333;
    line-height: 1.6;
    padding: 20px;
  }

  .container {
    max-width: 1200px;
    margin: auto;
    background: #fff;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  h1, h2, h3 {
    color: #222;
    margin-bottom: 15px;
    font-weight: 600;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: #fafafa;
    border-radius: 8px;
    overflow: hidden;
  }

  th, td {
    padding: 12px 15px;
    text-align: left;
  }

  th {
    background-color: #0078d4;
    color: #fff;
    font-weight: 600;
  }

  tr:nth-child(even) {
    background-color: #f0f4f8;
  }

  tr:hover {
    background-color: #e0eaf7;
  }

  input[type="number"],
  input[type="text"],
  select {
    padding: 8px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    font-size: 14px;
    width: 100%;
    transition: 0.2s;
  }

  input[type="number"]:focus,
  input[type="text"]:focus,
  select:focus {
    border-color: #0078d4;
    box-shadow: 0 0 4px rgba(0, 120, 212, 0.3);
  }

  button {
    background-color: #0078d4;
    color: #fff;
    border: none;
    padding: 10px 18px;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background-color: #005a9e;
  }
.form-containerbotao button {
  width: 100%;
  max-width: 300px;
}
  /* Responsivo */
 @media(max-width: 768px) {

  body {
    padding: 10px;
  }

  .container {
    padding: 15px;
    border-radius: 8px;
  }

  h1 {
    font-size: 20px;
    text-align: center;
  }

  label {
    font-size: 14px;
  }

  input, select {
    font-size: 16px; /* evita zoom no iPhone */
  }

  button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
  }

  /* TABELA RESPONSIVA (caso use depois) */
  table, thead, tbody, th, td, tr {
    display: block;
  }

  th {
    display: none;
  }

  tr {
    margin-bottom: 10px;
    background: #fff;
    border-radius: 8px;
    padding: 10px;
  }

  td {
    padding: 8px 5px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
  }
}

</style>

</head>
<body>

<div class="container">
  <div class="form-containerbotao" style="margin-bottom: 15px;">
    <button type="button" onclick="location.href='https://consulta-estoque-app.web.app/veiculo.html'">
      Voltar para Veículos
    </button>
  </div>

  <h1>Entrada de Serviço</h1>

  <form id="formServico">
    <label for="responsavelEntrada">Quem Retirou</label>
    <select id="responsavelEntrada" name="responsavelEntrada" required>
      <option value="">Selecione</option>
      <option>Altair</option>
      <option>Daniel</option>
      <option>Duarte</option>
      <option>Guilherme</option>
      <option>Josué</option>
      <option>Juliana</option>
      <option>Júlio</option>
      <option>Mayara</option>
      <option>Robson</option>
      <option>Samuel</option>
    </select>

    <label for="status">Status</label>
    <select id="status" name="status">
      <option>ENTRADA</option>
      <option>ORÇAMENTO</option>
      <option>AGUARDANDO</option>
      <option>APROVADO</option>
    </select>

    <label for="nota">Nº Nota Fiscal</label>
    <input type="text" id="nota" name="nota">

    <label for="cliente">Responsável</label>
    <input type="text" id="cliente" name="cliente">

    <label for="empresa">Empresa</label>
    <input type="text" id="empresa" name="empresa">

    <label for="descricao">Descrição</label>
    <input type="text" id="descricao" name="descricao">

    <label>Checklist</label>
    <div class="checklist">
      <label><input type="checkbox" value="Urgente"> Urgente</label>
      <label><input type="checkbox" value="Altair"> Altair</label>
      <label><input type="checkbox" value="Aguardando"> Aguardando</label>
      <label><input type="checkbox" value="Orçamento"> Orçamento</label>
      <label><input type="checkbox" value="Completo"> Completo</label>
      <label><input type="checkbox" value="Pintura"> Pintura</label>
      <label><input type="checkbox" value="PinturaIdentificacao"> Pintura Identificação</label>
    </div>

    <label for="fotos">Fotos (até 20)</label>
    <input type="file" id="fotos" name="fotos" multiple accept="image/*">

    <div style="margin-top: 15px;">
      <button type="submit">Salvar Serviço</button>
    </div>
  </form>
</div>

<script src="config.js"></script>


<script>
// converte arquivo para Base64

const API_URL = window.CONFIG.API_URL;
document.getElementById("formServico").addEventListener("submit", salvarServico);

async function salvarServico(e) {
  e.preventDefault();

  const botao = e.target.querySelector("button[type='submit']");
  botao.disabled = true; // trava o botão
  const textoOriginal = botao.textContent;
  botao.textContent = "Processando..."; // mensagem de processamento

  const statusEl    = document.getElementById("status");
  const notaEl      = document.getElementById("nota");
  const clienteEl   = document.getElementById("cliente");
  const empresaEl   = document.getElementById("empresa");
  const descricaoEl = document.getElementById("descricao");
  const fotosInput  = document.getElementById("fotos");

if (fotosInput.files.length > 20) {
  alert("Máximo de 20 fotos permitido.");
  botao.disabled = false;
  botao.textContent = textoOriginal;
  return;
}

const fotosBase64 = [];

for (const file of fotosInput.files) {
  if (file.size > 5 * 1024 * 1024) {
    alert(`Arquivo muito grande: ${file.name}`);
    continue;
  }

  const base64 = await toBase64Compact(file);

  fotosBase64.push({
    nome: file.name,
    tipo: file.type,
    dados: base64
  });
}


const checklist = [...document.querySelectorAll('.checklist input:checked')]
  .map(c => c.value)
  .join(", ");

const formData = new FormData();
formData.append('action', 'salvarservico');
formData.append('status', statusEl.value);
formData.append('nota', notaEl.value);
formData.append('cliente', clienteEl.value);
formData.append('empresa', empresaEl.value);
formData.append('descricao', descricaoEl.value);
formData.append('checklist', checklist);
formData.append('fotos', JSON.stringify(fotosBase64));


  

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: formData
    });

    const r = await res.json();

    if (r.success) {
      alert(`Serviço salvo! ID: ${r.idServico}\nPDF: ${r.pdf}\nPasta: ${r.pasta}`);
      document.getElementById("formServico").reset();
    } else {
      alert("Erro: " + r.erro);
    }
  } catch (err) {
    console.error(err);
    alert("Erro ao salvar serviço");
  } finally {
    // reabilita o botão
    botao.disabled = false;
    botao.textContent = textoOriginal;
  }
}
</script>
<script>
async function toBase64Compact(file, maxSize = 800, quality = 0.6) {
  return new Promise(resolve => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = e => {
      img.onload = () => {
        let { width, height } = img;

        if (width > height && width > maxSize) {
          height *= maxSize / width;
          width = maxSize;
        } else if (height > maxSize) {
          width *= maxSize / height;
          height = maxSize;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}
</script>


</body>
</html>
