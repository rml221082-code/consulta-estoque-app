  <!DOCTYPE html>

  <body>

  <script src="config.js"></script>
  <script>
  const API_URL = window.CONFIG.API_URL;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script>
    function mostrarAlerta(msg){

  const alerta = document.getElementById("alerta");

  alerta.innerText = msg;

  alerta.style.display = "block";

  setTimeout(() => {
    alerta.style.display = "none";
  }, 2000);

}
  let dados=[]
window.modoPagos = false
window.modoTodos = false    
  function hoje(){
  const h = new Date()
  return new Date(h.getFullYear(), h.getMonth(), h.getDate(), 0,0,0,0)
  }
function parcelaTemComprovante(n, parcela){

  if(!n.pdf) return false;

  const texto = String(n.pdf);

  return texto.includes(`Parcela ${parcela}`);
}
  function carregar(){

  fetch(API_URL+"?action=listarnotasfiscais")
  .then(r=>r.json())
  .then(json=>{

  dados=json.rows || []

  popularFiltros()

  render()

  })

  }

  function popularFiltros(){

  const select=document.getElementById("fEmpresa")

  select.innerHTML='<option value="">Empresa</option>'

  const empresas=[...new Set(dados.map(d=>d.empresa))]

  empresas.sort()

  empresas.forEach(e=>{
  if(e) select.innerHTML+=`<option>${e}</option>`
  })

  }
  function calcularFinanceiro(n){

  let pago = 0
  let total = Number(n.valorTotal)

  for(let i=1;i<=10;i++){

  let valorParcela = Number(n["valorParcela"+i] || 0)
  let pagoValor = Number(n["pagamentoValor"+i] || 0)
  let statusPago = String(n["pagamento"+i] || "").toUpperCase().trim()

  if(statusPago === "PAGO"){
    pago += valorParcela
  }

  }

  return{
  pago,
  saldo: total - pago
  }
  }

  function pagarParcela(id,parcela){

  fetch(API_URL+`?action=pagarparcela&id=${id}&parcela=${parcela}&t=`+Date.now())
  .then(()=>carregar())

  }

  function cancelarNota(id){

  if(!confirm("Cancelar esta nota?")) return

  fetch(API_URL+`?action=cancelarnota&id=${id}`)
  .then(r=>r.json())
  .then(r=>{
  if(r.success){
  carregar()
  }else{
  mostrarAlerta("Erro ao cancelar")
  }
  
  })

  }
  function ativarNota(id){

  if(!confirm("Deseja reativar esta nota?")) return;

  fetch(API_URL + `?action=ativarnota&id=${id}`)
  .then(r => r.json())
  .then(r => {

    if(r.success){

      mostrarAlerta("✅ Nota reativada");
      carregar();

    }else{

      mostrarAlerta("Erro: " + (r.erro || ""));

    }

  })
  .catch(err => {
    console.error(err);
    mostrarAlerta("Erro ao reativar nota");
  });

}
  function pegarVencimento(n, i){
    return n["vencimento"+i] || n["VENCIMENTO "+i] || null
  }
  function filtroTodos(){

  fDataInicio.value = ""
  fDataFim.value = ""

  window.modoPagos = false
  window.modoTodos = true

  render()
}
  function filtrar(){

  return dados.filter(n=>{

  if(fEmpresa.value && n.empresa!=fEmpresa.value) return false

  if(fFornecedor.value && !(n.fornecedor || "").toLowerCase().includes(fFornecedor.value.toLowerCase())) return false

  if(fNota.value){

  const notaFiltro = fNota.value.trim().toLowerCase()

  const notaSistema = String(n.numeroNota || "").trim().toLowerCase()

  if(!notaSistema.includes(notaFiltro)) return false

  }

  if(fStatus.value && n.status!=fStatus.value) return false

  // 🔎 FILTRO POR DATA DE VENCIMENTO
  if(fDataInicio.value || fDataFim.value){

  let inicio = fDataInicio.value ? converterDataBR(fDataInicio.value) : null
  let fim    = fDataFim.value ? converterDataBR(fDataFim.value) : null

  if(inicio) inicio.setHours(0,0,0,0)
  if(fim)    fim.setHours(23,59,59,999)

  let temNoPeriodo = false

  for(let i=1;i<=n.qtdParcelas;i++){

  let venc = pegarVencimento(n, i)

  if(!venc) continue

  let dataVenc = converterDataBR(venc)

  if(!dataVenc) continue

  if(inicio && dataVenc < inicio) continue
  if(fim && dataVenc > fim) continue
  temNoPeriodo = true
  break

  }

  if(!temNoPeriodo) return false

  }

  return true

  })
  }
  function formatarDataInput(data){
  return data.toISOString().split("T")[0]
  }

  // 📅 HOJE
  function filtroHoje(){
  window.modoPagos = false
  window.modoTodos = false
  const h = hoje()

  fDataInicio.value = formatarDataInput(h)
  fDataFim.value    = formatarDataInput(h)

  render()
  }

  // 🔴 ATRASADAS
  function filtroAtrasadas(){
  window.modoPagos = false
  window.modoTodos = false
  const h = hoje()

  fDataInicio.value = "" // tudo antes de hoje
  fDataFim.value    = formatarDataInput(h)

  render()
  }

  // 🔵 PRÓXIMOS 7 DIAS
  function filtro7Dias(){
  window.modoPagos = false
  window.modoTodos = false
  const h = hoje()

  const futuro = new Date()
  futuro.setDate(h.getDate() + 7)

  fDataInicio.value = formatarDataInput(h)
  fDataFim.value    = formatarDataInput(futuro)

  render()
  }

  // 🔄 LIMPAR
  function filtroPagos(){

  // limpa datas (não queremos filtrar por data)
  fDataInicio.value = ""
  fDataFim.value = ""

  // ativa modo "somente pagos"
 window.modoPagos = true
  window.modoTodos = false

  render()
}
  function limparFiltroData(){

  fDataInicio.value = ""
  fDataFim.value    = ""

  render()
  }
 function parcelaDentroFiltro(n, i){

  let status = String(n["pagamento"+i] || "").toUpperCase();
  let pagoValor = Number(n["pagamentoValor"+i] || 0);
const temComprovante = parcelaTemComprovante(n, i);
  // 🔥 MOSTRAR TUDO
  if(window.modoTodos){
    return true;
  }

  // 🔥 SOMENTE PAGOS
  if(window.modoPagos){
    return (status === "PAGO" || pagoValor > 0);
  }

  // 🚫 ESCONDER PAGOS NOS OUTROS FILTROS
  if(status === "PAGO" || pagoValor > 0){

    // Se não possui comprovante, mostrar
    if(!temComprovante){
        return true;
    }

    // Se possui comprovante, esconder
    return false;
}

  if(!fDataInicio.value && !fDataFim.value) return true;

  let inicio = fDataInicio.value ? converterDataBR(fDataInicio.value) : null;
  let fim    = fDataFim.value ? converterDataBR(fDataFim.value) : null;

  if(inicio) inicio.setHours(0,0,0,0);
  if(fim)    fim.setHours(23,59,59,999);

  let venc = pegarVencimento(n, i);
  let dataVenc = converterDataBR(venc);

  if(!dataVenc) return false;

  if(inicio && dataVenc < inicio) return false;
  if(fim && dataVenc > fim) return false;

  return true;
}
  function render(){

  const tbody=document.getElementById("lista")

  tbody.innerHTML=""

  let totalNotas=0
  let totalPago=0
  let totalAtrasado=0
  let vencHoje=0

  const lista=filtrar()

  lista.forEach(n=>{

  const fin=calcularFinanceiro(n)

  totalNotas+=Number(n.valorTotal)
  totalPago+=fin.pago

  let parcelasHTML=""

  for(let i=1;i<=n.qtdParcelas;i++){

    // 🔥 FILTRO REAL POR PARCELA
    if(!parcelaDentroFiltro(n, i)) continue;

    let valor = n["valorParcela"+i]
    let venc = pegarVencimento(n, i)

    let classe = "pagar"
    let textoBotao = `Parcela ${i}`

    let vencDate = converterDataBR(venc)

    let status = String(n["pagamento"+i] || "").toUpperCase()
    let pagoValor = Number(n["pagamentoValor"+i] || 0)
    const temComprovante = parcelaTemComprovante(n, i);

    function mesmaData(d1, d2){
      if(!d1 || !d2) return false
      return (
        d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getDate() === d2.getDate()
      )
    }

    // ✅ STATUS
    if(status === "PAGO" || pagoValor > 0){
      classe = "pago"
      textoBotao = `Parcela:${i} ✔ Pago`

    }else if(vencDate && mesmaData(vencDate, hoje())){
      classe="hoje"
      vencHoje++

    }else if(vencDate && vencDate.getTime() < hoje().getTime()){
      classe="atrasado"
      totalAtrasado+=Number(valor||0)
    }

    // 📅 FORMATAR DATA
    let dataFormat = "-"

    if(vencDate && !isNaN(vencDate)){
      dataFormat =
        vencDate.getDate().toString().padStart(2,'0')+"/"+
        (vencDate.getMonth()+1).toString().padStart(2,'0')+"/"+
        vencDate.getFullYear()
    }

    parcelasHTML+=`
    <div class="parcelaBox ${((status==="PAGO" || pagoValor>0) && !temComprovante) ? 'semComprovante' : ''}">

      <button class="btn ${classe}"
onclick="acaoPagamento(
'${n.id}',
${i},
'${n.empresa}',
'${n.numeroNota}',
'${n.fornecedor}'
)">
${textoBotao}
</button>

  <input type="file" 
    id="file_${n.id}_${i}" 
    style="display:none" 
    accept="application/pdf,image/*"
    onchange="enviarComprovante(event,'${n.id}',${i},${n.valorTotal},'${n.empresa}','${n.numeroNota}','${n.fornecedor}')"
  />

      <div class="parcelaValor">
        R$ ${Number(valor||0).toFixed(2)}
      </div>

      <div class="parcelaData">
        ${dataFormat}
      </div>
${
  classe === "pago" && !temComprovante
  ?
  `
  <button
    class="btn cancelar"
    style="margin-top:5px;background:#ea580c"
    onclick="abrirUpload(
      '${n.id}',
      ${i},
      '${n.empresa}',
      '${n.numeroNota}',
      '${n.fornecedor}'
    )"
  >
    📎 Sem comprovante
  </button>
  `
  :
  ""
}
    </div>
    `
    
  }
  
  tbody.innerHTML+=`

  <tr>

  <td>${n.empresa}</td>
  <td>${n.numeroNota}</td>
  <td>${n.fornecedor}</td>

  <td>R$ ${Number(n.valorTotal).toFixed(2)}</td>
  <td>R$ ${fin.pago.toFixed(2)}</td>
  <td>R$ ${fin.saldo.toFixed(2)}</td>

  <td>${parcelasHTML}</td>

  <td>
  <span class="badge ${n.emergencial=="SIM"?"sim":"nao"}">
  ${n.emergencial}
  </span>
  </td>

  <td>
    ${gerarLinkPDF(n)}
  </td>

 <td>

<button class="btn pagar"
onclick="abrirEdicao('${n.id}')">
Editar
</button>

${
n.status === "CANCELADO"

? `<button class="btn pago"
onclick="ativarNota('${n.id}')">
Ativar
</button>`

: `<button class="btn cancelar"
onclick="cancelarNota('${n.id}')">
Cancelar
</button>`
}

</td>

  </tr>

  `

  })

  dNotas.innerText="R$ "+totalNotas.toFixed(2)
  dPago.innerText="R$ "+totalPago.toFixed(2)
  dAberto.innerText="R$ "+(totalNotas-totalPago).toFixed(2)
  dAtrasado.innerText="R$ "+totalAtrasado.toFixed(2)
  dHoje.innerText=vencHoje

  }

  document.querySelectorAll("#fEmpresa,#fFornecedor,#fNota,#fStatus,#fDataInicio,#fDataFim")
  .forEach(el=>el.addEventListener("input",render))

  carregar()

  setTimeout(()=>{
  filtroHoje()
  },500)
  let notaEditando = null

  
  function gerarLinkPDF(n){

  if(!n.pdf) return "-";

  const texto = String(n.pdf);
  const linhas = texto.split("\n");

  let html = "";

  linhas.forEach(linha => {

    const match = linha.match(/https?:\/\/\S+/);

    if(match){

      const url = match[0];

      // pega número da parcela
      const parcelaMatch = linha.match(/Parcela\s*(\d+)/i);
      const parcela = parcelaMatch ? parcelaMatch[1] : "?";

      html += `
        <div style="display:flex;align-items:center;gap:5px;justify-content:center">

          <a href="${url}" target="_blank">
            📄 Parcela ${parcela}
          </a>

          <button 
            class="btn cancelar"
            onclick="deletarComprovante('${n.id}', '${parcela}', '${url}')"
            title="Excluir comprovante"
          >
            🗑️Apagar!
          </button>

        </div>
      `;
    }

  });

  if(!html){
    return `<a href="${n.pdf}" target="_blank">PDF</a>`;
  }

  return html;
}
function deletarComprovante(id, parcela, url){

  if(!confirm("Deseja realmente excluir este comprovante?")) return;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "deletarcomprovante",
      id: id,
      parcela: parcela,
      url: url
    })
  })
  .then(r => r.json())
  .then(r => {

    if(r.success){
      mostrarAlerta("✅ Comprovante excluído!");
      carregar();
    }else{
      mostrarAlerta("Erro ao excluir: " + r.erro);
    }

  });

}
  function abrirUpload(id, parcela, empresa, nota, fornecedor){

    const input = document.getElementById(`file_${id}_${parcela}`);

    if(!input){
      mostrarAlerta("Erro ao abrir upload");
      return;
    }

    input.click();
  }
  function enviarComprovante(event, id, parcela, total, empresa, nota, fornecedor){

    const file = event.target.files[0];
    if(!file) return;

    const hoje = new Date();
    const dataFormatada =
      hoje.getFullYear() + "-" +
      String(hoje.getMonth()+1).padStart(2,'0') + "-" +
      String(hoje.getDate()).padStart(2,'0');

  function limparTexto(txt){
    return txt
      .replace(/[^\w\s-]/g, "") // remove caracteres inválidos
      .replace(/\s+/g, "_");    // troca espaço por _
  }

  const fornecedorLimpo = limparTexto(fornecedor);

  const nomeArquivo = `${nota}_${fornecedorLimpo}_PARCELA_${parcela}_${dataFormatada}.pdf`;

    const reader = new FileReader();

    reader.onload = function () {

      const base64 = reader.result.split(",")[1];

      const formData = new FormData();

      formData.append("action", "uploadcomprovante");
      formData.append("fileBase64", base64);
      formData.append("fileType", file.type);
      formData.append("fileName", nomeArquivo);

      formData.append("id", id);
      formData.append("parcela", parcela);
      formData.append("total", total);
      formData.append("empresa", empresa);
      formData.append("nota", nota);
      formData.append("fornecedor", fornecedor);

      fetch(API_URL, {
        method: "POST",
        body: formData
      })
      .then(r => r.json())
      .then(r => {
        mostrarAlerta(r.success ? "✅ Pago e comprovante salvo!" : r.erro);
        carregar();
      });

    };

    reader.readAsDataURL(file);
  }
  function acaoPagamento(id, parcela, empresa, nota, fornecedor){

  const enviar = confirm(
    "Deseja anexar comprovante?\n\n" +
    "OK = Anexar comprovante\n" +
    "Cancelar = Marcar como pago sem comprovante"
  );

  if(enviar){

    abrirUpload(
      id,
      parcela,
      empresa,
      nota,
      fornecedor
    );

  }else{

    pagarParcela(id, parcela);

  }

}
  function abrirEdicao(id){

  const nota = dados.find(n => String(n.id) === String(id));

  if(!nota){
    mostrarAlerta("Nota não encontrada");
    return;
  }

  notaEditando = nota;

  // =========================
  // FUNÇÃO DATA
  // =========================

  function formatarDataInput(data){

    if(!data) return "";

    data = String(data);

    // já está yyyy-mm-dd
    if(data.includes("-") && data.length >= 10){
      return data.substring(0,10);
    }

    // dd/mm/yyyy
    if(data.includes("/")){

      const p = data.split("/");

      return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
    }

    return "";
  }

  // =========================
  // CAMPOS PRINCIPAIS
  // =========================

  document.getElementById("eEmpresa").value =
    String(nota.empresa || "");

  document.getElementById("eNota").value =
    String(nota.numeroNota || "");

  }

  fetch(API_URL,{

  .catch(err=>{

    mostrarAlerta("Erro ao salvar edição");

  });

}
  function converterDataBR(data){

  if(!data) return null

  // 🔥 se já for Date
  if(data instanceof Date){
  return new Date(data.getFullYear(), data.getMonth(), data.getDate())
  }

  // 🔥 se for número (timestamp)
  if(typeof data === "number"){
  let d = new Date(data)
  return new Date(d.getFullYear(), d.getMonth(), d.getDate())
  }

  // 🔥 se for string
  if(typeof data === "string"){

  data = data.trim()

  // formato BR 17/04/2026
  if(data.includes("/")){
  const [dia, mes, ano] = data.split("/")
  return new Date(Number(ano), Number(mes)-1, Number(dia))
  }

  // formato ISO completo 2026-04-17T00:00:00.000Z
  if(data.includes("T")){
  let d = new Date(data)
  return new Date(d.getFullYear(), d.getMonth(), d.getDate())
  }

  // formato YYYY-MM-DD
  if(data.includes("-")){
  const [ano, mes, dia] = data.split("-")
  return new Date(Number(ano), Number(mes)-1, Number(dia))
  }

  }

  return null
  }

  function exportarExcel(){

    const lista = filtrar();

    if(lista.length === 0){
      mostrarAlerta("Nenhum dado para exportar");
      return;
    }

    let dadosExcel = [];

    lista.forEach(n => {

      const fin = calcularFinanceiro(n);

       for(let i=1;i<=n.qtdParcelas;i++){

    // 🔥 FILTRO REAL POR PARCELA
    if(!parcelaDentroFiltro(n, i)) continue;

        let valor = n["valorParcela"+i] || 0;
        let venc  = pegarVencimento(n, i);
        let status = n["pagamento"+i] || "PENDENTE";

        let dataFormat = "";

        const vencDate = converterDataBR(venc);

        if(vencDate){
          dataFormat =
            String(vencDate.getDate()).padStart(2,'0')+"/"+
            String(vencDate.getMonth()+1).padStart(2,'0')+"/"+
            vencDate.getFullYear();
        }

        dadosExcel.push({
          Empresa: n.empresa,
          Nota: n.numeroNota,
          Fornecedor: n.fornecedor,
          Total: Number(n.valorTotal),
          Pago: Number(fin.pago),
          Saldo: Number(fin.saldo),
          Parcela: i,
          "Valor Parcela": Number(valor),
          Vencimento: dataFormat,
          Status: status
        });

      }

    });

    // 🔥 cria planilha
    const ws = XLSX.utils.json_to_sheet(dadosExcel);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Relatorio");

    // 🔥 nome arquivo
    const hoje = new Date();
    const nome =
      "relatorio_" +
      hoje.getFullYear() +
      String(hoje.getMonth()+1).padStart(2,'0') +
      String(hoje.getDate()).padStart(2,'0') +
      ".xlsx";

    // 🔥 download
    XLSX.writeFile(wb, nome);
  }
  function fecharModalSucesso(){
    document.getElementById("modalSucesso").style.display = "none";
  }
