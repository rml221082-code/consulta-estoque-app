body{font-family:Segoe UI,Arial;background:#f4f4f4;margin:0;display:flex;justify-content:center}
.box{max-width:900px;width:100%;background:#fff;margin:30px;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0002}
.drop{border:2px dashed #4285f4;padding:40px;text-align:center;border-radius:12px}
img{max-width:100%;max-height:400px;display:none;margin:20px auto;border-radius:10px}
button{padding:12px 18px;border:none;border-radius:8px;background:#4285f4;color:#fff;cursor:pointer}
#out{white-space:pre-wrap;background:#f7f7f7;padding:12px;border-radius:8px;margin-top:20px}
</style></head><body><div class="box">
<h2>📷 Lens IA - Parte 1</h2>
<div class="drop">
<input id="file" type="file" accept="image/*" capture="environment"><br><br>
<button onclick="analisar()">🤖 Analisar Produto</button>
</div>
<img id="preview">
<div id="out">Selecione uma imagem.</div>
<script>
const f=document.getElementById('file'),img=document.getElementById('preview');
f.onchange=e=>{
 const file=e.target.files[0];
 if(!file)return;
 img.src=URL.createObjectURL(file);
 img.style.display='block';
}
async function analisar(){
 const file=f.files[0];
 if(!file){alert('Selecione uma imagem');return;}
 out.textContent='Analisando...';
 // TODO: enviar imagem ao seu backend que chama a OpenAI Vision.
 out.textContent=`Parte 1 pronta!\n\nPróximo passo:\n1. Criar backend seguro com sua chave OpenAI.\n2. Enviar a imagem.\n3. Receber descrição do produto.\n4. Buscar no estoque automaticamente.`;
}
</script></div></body></html>
