<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lens Estoque</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.topo{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:20px;
}

input[type=text]{
    padding:10px;
    width:300px;
}

button{
    padding:10px 15px;
    cursor:pointer;
}

#preview{
    text-align:center;
    margin:20px 0;
}

#preview img{
    max-width:250px;
    border-radius:10px;
}

#produtos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.info{
    padding:10px;
}

.info h3{
    margin:0 0 10px;
    font-size:15px;
}

.info p{
    margin:4px 0;
    font-size:13px;
}

</style>
</head>
<body>

<h1>📷 Lens Estoque</h1>

<div class="topo">

<input
    type="file"
    id="foto"
    accept="image/*"
    capture="environment"
>



</div>

<div id="preview"></div>

<div id="status"></div>

<div id="produtos"></div>

<script>

const API_IMAGENS =
"https://script.google.com/macros/s/AKfycbwztuqu_lppYG24gs16zonM1Pe5gweeL_Pt9VX-Tm-xCBNl5hJYKuAItcMIIeuN8VNBqQ/exec?action=listarimagenslens";

let produtos = [];
let bancoCores = [];
let bancoImagens = [];

async function carregarBanco(){

    document.getElementById("status").innerHTML =
    "📷 Carregando imagens...";

    const res = await fetch(API_IMAGENS);

    bancoImagens = await res.json();

    document.getElementById("status").innerHTML =
    `✅ ${bancoImagens.length} imagens carregadas`;
}
document
.getElementById("foto")
.addEventListener("change", async (e)=>{

    mostrarFoto(e);

    await procurarPorFoto(e);

});

function mostrarFoto(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(evt){

        document.getElementById("preview").innerHTML = `
            <h3>Foto enviada</h3>
            <img src="${evt.target.result}">
        `;
    };

    reader.readAsDataURL(file);
}

function tratarImagem(url){

    if(!url)
        return "https://via.placeholder.com/300?text=Sem+Imagem";

    let match = url.match(/\/d\/([^\/]+)/);

    if(match){
        return `https://lh3.googleusercontent.com/d/${match[1]}=w800`;
    }

    match = url.match(/id=([^&]+)/);

    if(match){
        return `https://lh3.googleusercontent.com/d/${match[1]}=w800`;
    }

    return url;
}

function obterImagemProduto(produto){

    if(produto.novolink){

        let match = produto.novolink.match(/id=([^&]+)/);

        if(match){
            return `https://lh3.googleusercontent.com/d/${match[1]}=w800`;
        }
    }

    if(produto["IMAGEM APP"]){
        return tratarImagem(produto["IMAGEM APP"]);
    }

    return "https://via.placeholder.com/300?text=Sem+Imagem";
}

async function procurarPorFoto(e){

    const file = e.target.files[0];

    if(!file) return;

    document.getElementById("status").innerHTML =
    "🔍 Procurando produto...";

    const corFoto =
    await extrairCorArquivo(file);

    const resultado = [];

    for(const item of bancoImagens){

    try{

        console.log("Analisando:", item.id);

        const corProduto =
        await extrairCorImagem(item.imagem);

        resultado.push({

            id:item.id,
            produto:item.produto,
            caixa:item.caixa,
            quantidade:item.quantidade,
            imagem:item.imagem,

            score:calcularSimilaridade(
                corFoto,
                corProduto
            )

        });

    }catch(err){

        console.error(
            "Erro na imagem:",
            item.imagem,
            err
        );

    }
}

    resultado.sort((a,b)=>b.score-a.score);

     mostrarResultado(resultado.slice(0,10));
}
function mostrarResultado(lista){

    const div =
    document.getElementById("produtos");

    let html = "";

    lista.forEach(item=>{

        html += `

        <div class="card">

            <img src="${item.imagem}">

            <div class="info">

                <h3>
                    ${item.produto || 'Sem nome'}
                </h3>

                <p>
                    <b>Caixa:</b>
                    ${item.caixa || '-'}
                </p>

                <p>
                    <b>Estoque:</b>
                    ${item.quantidade || 0}
                </p>

                <p>
                    <b>Similaridade:</b>
                    ${item.score.toFixed(1)}%
                </p>

            </div>

        </div>

        `;
    });

    div.innerHTML = html;
}
function calcularSimilaridade(c1,c2){

    const distancia = Math.sqrt(

        Math.pow(c1[0]-c2[0],2)+
        Math.pow(c1[1]-c2[1],2)+
        Math.pow(c1[2]-c2[2],2)

    );

    const maxDistancia = 441.67;

    let similaridade =
    100 - ((distancia / maxDistancia) * 100);

    similaridade = Math.max(0, similaridade);

    return similaridade;
} 
function extrairCorArquivo(file){

    return new Promise(resolve=>{

        const img = new Image();

        const reader = new FileReader();

        reader.onload = e=>{

            img.onload = ()=>{

                const canvas =
                document.createElement("canvas");

                canvas.width = 64;
                canvas.height = 64;

                const ctx =
                canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    64,
                    64
                );

                const data =
                ctx.getImageData(
                    0,
                    0,
                    64,
                    64
                ).data;

                let r=0,g=0,b=0;

                for(let i=0;i<data.length;i+=4){

                    r+=data[i];
                    g+=data[i+1];
                    b+=data[i+2];
                }

                const total =
                data.length/4;

                resolve([
                    r/total,
                    g/total,
                    b/total
                ]);
            };

            img.src = e.target.result;
        };

        reader.readAsDataURL(file);
    });
}
function extrairCorImagem(url){

    return new Promise((resolve,reject)=>{

        const img = new Image();

        img.crossOrigin="anonymous";

        img.onload=()=>{

            const canvas =
            document.createElement("canvas");

            canvas.width=64;
            canvas.height=64;

            const ctx =
            canvas.getContext("2d");

            ctx.drawImage(
                img,
                0,
                0,
                64,
                64
            );

            const data =
            ctx.getImageData(
                0,
                0,
                64,
                64
            ).data;

            let r=0,g=0,b=0;

            for(let i=0;i<data.length;i+=4){

                r+=data[i];
                g+=data[i+1];
                b+=data[i+2];
            }

            const total =
            data.length/4;

            resolve([
                r/total,
                g/total,
                b/total
            ]);
        };

        img.onerror=reject;

        img.src=url;
    });
}
function calcularDistancia(c1,c2){

    return Math.sqrt(

        Math.pow(c1[0]-c2[0],2)+
        Math.pow(c1[1]-c2[1],2)+
        Math.pow(c1[2]-c2[2],2)

    );
}



carregarBanco();


</script>

</body>
</html>
