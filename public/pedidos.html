<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bloco de Pedidos</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.page {
    width: 210mm;
    height: 297mm;
    padding: 8mm;
    box-sizing: border-box;
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8mm;
    height: 100%;
}

.bloco {
    border: 2px solid #000;
    padding: 5mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.titulo {
    text-align: center;
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 4px;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

th, td {
    border: 1px solid #000;
    padding: 16px;
    text-align: center;
}

/* TAMANHO DAS COLUNAS */
th:nth-child(1), td:nth-child(1) {
    width: 25%;
}

th:nth-child(2), td:nth-child(2) {
    width: 75%;
    text-align: left;
    padding-left: 5px;
}

th {
    background: #eee;
}

/* TOTAL */
.total {
    margin-top: 5px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    font-size: 14px;
}

.linha-total {
    border-bottom: 1px solid #000;
    width: 80px;
    margin-left: 5px;
}

/* NOME */
.nome {
    margin-top: 6px;
    font-size: 14px;
}

.linha-nome {
    border-bottom: 1px solid #000;
    height: 18px;
}

@media print {
    body {
        margin: 0;
    }
}
</style>
</head>

<body>

<div class="page">
<div class="container">

<!-- FUNÇÃO PARA REUTILIZAR BLOCO -->
<script>
function criarBloco() {
    return `
    <div class="bloco">
        <div>
            <div class="titulo">PEDIDO</div>
            <table>
                <tr>
                    <th>Qtd.</th>
                    <th>Peça</th>
                </tr>

                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                <tr><td></td><td></td></tr>
                
            </table>

            
        </div>

        <div class="nome">
            Nome: <div class="linha-nome"></div>
        </div>
    </div>
    `;
}

document.write(criarBloco());
document.write(criarBloco());
document.write(criarBloco());
document.write(criarBloco());
</script>

</div>
</div>

</body>
</html>
