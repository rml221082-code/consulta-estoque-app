    /* ======= RENDERIZA PRODUTOS ======= */
  function tratarImagem(url) {
  if (!url) return "https://i.imgur.com/6VBx3io.png";

  // padrão /d/ID/
  let match = url.match(/\/d\/(.*?)\//);
  if (match && match[1]) {
    return `https://lh3.googleusercontent.com/d/${match[1]}=w500`;
  }

  // padrão id=ID
  match = url.match(/id=(.*?)(?:&|$)/);
  if (match && match[1]) {
    return `https://lh3.googleusercontent.com/d/${match[1]}=w500`;
  }

  return url;
}
  
  function fecharModal() {
    document.getElementById("modal").style.display = "none";

    /* ======= CARRINHO ======= */

function addInventario(p){

  const existente = inventario.find(
    x => String(x.ID_PRODUTO) === String(p.ID_PRODUTO)
  );

  if(existente){
    alert("Produto já adicionado ao inventário");
    return;
  }

  inventario.push({

    ID_PRODUTO: p.ID_PRODUTO,

    PRODUTO: p.PRODUTO,

    CATEGORIA: p.CATEGORIA,

    caixa: p.CAIXA || "",

    estoqueAtual: Number(p.QUANTIDADE || 0),

    contagem: Number(p.QUANTIDADE || 0),

    valorCompra: Number(p.VALOR_COMPRA || 0),

    valorVenda: Number(p.VALOR_VENDA || 0),

    ipi: Number(p.IPI || 0),

    icms: Number(p.ICMS || 0),

    venda: Number(
      p["PORCENTAGEM DE VENDA"] ||
      p.VENDA ||
      0
    )

  });

  atualizarInventario();

  document.getElementById("qtdCarrinho").innerText =
    inventario.length;
}

    function atualizarIcone() {

  let totalItens = 0;

  carrinho.forEach(item => {
    totalItens += item.qtd;
  });

  document.getElementById("qtdCarrinho").innerText = totalItens;
}

    function abrirCarrinho() {

const valorVendaCalculado =

    function dinheiro(valor) {
      return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }
  function buscar() {

  const termo = document
    .getElementById("busca")
    .value
    .toLowerCase()
    .trim();

  const filtrados = produtosBase.filter(p => {

    const produto = String(p.PRODUTO || "")
      .toLowerCase();

    const caixa = String(p.CAIXA || "")
      .toLowerCase();

    const categoria = String(p.CATEGORIA || "")
      .toLowerCase();

    const atendeCategoria =
      !categoriaAtual ||
      String(p.CATEGORIA || "") === categoriaAtual;

    const atendeBusca =
      !termo ||
      produto.includes(termo) ||
      caixa.includes(termo) ||
      categoria.includes(termo);

    return atendeCategoria && atendeBusca;
  });

  renderizarProdutos(filtrados);
}

const valorVendaCalculado =

i.valorVenda = valorVendaCalculado;

  <script>
  function renderizarProdutos(lista) {
  const div = document.getElementById("produtos");
  div.innerHTML = "";

  const fragment = document.createDocumentFragment();

  lista.forEach(p => {

  if (
    !String(p.PRODUTO || "").trim() ||
    !String(p.CATEGORIA || "").trim()
  ) {
    return;
  }

  const card = document.createElement("div");
  card.className = "card";

    const imagem = tratarImagem(p['IMAGEM APP']);

    card.innerHTML = `
      <img src="${imagem}" 
 onerror="this.onerror=null; this.src='https://i.imgur.com/6VBx3io.png'"

      <div class="info">
        <b>${p.PRODUTO}</b><br>
        Categoria: ${p.CATEGORIA || "-"}<br>
        Estoque: ${p.QUANTIDADE || 0}<br>
        Caixa: ${p.CAIXA || ''}<br>
        Compra: ${Number(p.VALOR_COMPRA || 0)
          .toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
      </div>

      <button class="btn-add">➕ Adicionar</button>
    `;

    // 🔥 EVENTO NA IMAGEM (correto)
    card.querySelector("img")
      .addEventListener("click", () => abrirModal(p));

    // 🔥 BOTÃO
    card.querySelector(".btn-add")
      .addEventListener("click", () => addInventario(p));

    fragment.appendChild(card);
  });

  div.appendChild(fragment);
}
function logout() {
  auth.signOut().then(() => {
    window.location.href = "login.html";
  });
}
</script>

        .filter(Boolean)
    )].sort();

    criarLinkCategoria("Todas", "");

    categorias.forEach(cat => criarLinkCategoria(cat, cat));

    function criarLinkCategoria(nome, valor) {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = nome;

      // ✅ MARCA COMO ATIVO
      if (valor === categoriaAtual) {
        a.classList.add("ativo");
      }

      a.onclick = e => {
        e.preventDefault();

        categoriaAtual = valor;

        // 🔥 REMOVE ATIVO DE TODOS
        document.querySelectorAll("#categorias a")
          .forEach(el => el.classList.remove("ativo"));

        // 🔥 ADICIONA NO CLICADO
        a.classList.add("ativo");

        buscar();
      };

      div.appendChild(a);
    }
  }

    
    </script>

  <script>
  async function adicionarProdutoManual() {
    const categoriaEl = document.getElementById("categoriaManual");
    const produtoEl = document.getElementById("produtoManual");
    const valorEl = document.getElementById("valorManual");

    const categoria = categoriaEl.value;
    const nome = produtoEl.value.trim();
    const valor = Number(valorEl.value) || 0;

    if (!nome) {
      alert("Informe o nome do produto");
      return;
    }

    try {
      // 🔹 BUSCA O PRÓXIMO ID NO GAS
      const res = await fetch(API_URL + "?action=obterProximoIdEntrada");
      const data = await res.json();

      if (!data.success) {
        throw new Error(data.erro || "Erro ao obter próximo ID");
      }

      // 🔹 ADICIONA NO CARRINHO COM ID SEQUENCIAL
      carrinho.push({
        ID_PRODUTO: data.proximoId, // ✅ PRÓXIMO ID
        CATEGORIA: categoria,
        PRODUTO: nome,
        qtd: 1,
        valorCompra: valor,
        ipi: 0,
        icms: 0,
        venda: 100,
        total: valor
      });

      atualizarIcone();

      // ✅ LIMPA OS CAMPOS APÓS ENVIAR
      produtoEl.value = "";
      valorEl.value = "0";
      categoriaEl.selectedIndex = 0;

      // fecha o modal
