<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veículos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin-bottom: 30px;
      color: #333;
      text-align: center;
    }

    .botoes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 500px;
      padding: 0 20px;
    }

    .botoes a {
      text-decoration: none;
    }

    .botoes button {
      width: 100%;
      padding: 18px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2f80ed;
      color: #fff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .botoes button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 22px;
      }

      .botoes button {
        font-size: 15px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <h1>Veículos</h1>

  <div class="botoes">
    <a href="https://consulta-estoque-app.web.app/controledeveiculo.html">
      <button>Controle de Veículo</button>
    </a>

    <a href="https://consulta-estoque-app.web.app/manutencaodeveiculo.html">
      <button>Manutenção de Veículo</button>
    </a>

     <a href="https://consulta-estoque-app.web.app/pedidosdecompras.html">
      <button>Pedidos de Compras</button>
    </a>
  </div>

  </body>
</html>
