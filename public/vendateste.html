<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Etiquetas Estoque</title>

<link rel="icon" href="https://i.imgur.com/PQgJbGG.png">

<script src="https://unpkg.com/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f3f4f6;
    padding:20px;
    color:#111;
}

h1{
    margin-bottom:20px;
}

.topo{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

input{
    flex:1;
    min-width:250px;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#produtos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:15px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h3{
    font-size:16px;
    margin-bottom:10px;
    min-height:40px;
}

.card p{
    margin:4px 0;
    font-size:14px;
}

.card button{
    width:100%;
    margin-top:10px;
}

#areaEtiqueta{
    margin-top:30px;
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

/* ETIQUETA */

.etiqueta{
    width:380px;
    background:#fff;
    border:2px solid #000;
    padding:12px;
    border-radius:10px;
    page-break-inside:avoid;
}

.nome-produto{
    font-size:18px;
    font-weight:bold;
    line-height:1.2;
    margin-bottom:10px;

    word-break:break-word;
}

.info{
    font-size:15px;
    margin-bottom:5px;
}

.barra{
    margin-top:10px;
    text-align:center;
}

.barra svg{
    width:100%;
    height:80px;
}

.codigo{
    text-align:center;
    font-size:14px;
    margin-top:5px;
    font-weight:bold;
}

/* IMPRESSÃO */

@media print{

    body{
        background:#fff;
        padding:0;
    }

    .topo,
    #produtos,
    h1{
        display:none;
    }

    #areaEtiqueta{
        gap:8px;
    }

    .etiqueta{
        width:48%;
        border:1px solid #000;
    }

}

@media(max-width:700px){

    .etiqueta{
        width:100%;
    }

}

</style>
</head>

<body>

<h1>🏷️ Gerador de Etiquetas</h1>

<div class="topo">

    <input
        type="text"
        id="busca"
        placeholder="Buscar produto, categoria ou caixa..."
        
    >

    <button onclick="window.print()">
        🖨️ Imprimir
    </button>

</div>

<div id="produtos"></div>

<hr style="margin:30px 0;">

<h2 style="margin-bottom:15px;">
Etiquetas Selecionadas
</h2>

<div id="areaEtiqueta"></div>
<script src="config.js"></script>
<script>

const API_URL = window.CONFIG?.API_URL || "https://script.google.com/macros/s/AKfycbxs_r0iCiSzcaN98nVJ3C3HDt2FHw83G68RV5nbRV3R_jUJd6XmU8VcH-eNQRA29yW2RQ/exec";

/*
========================================
CARREGA PRODUTOS
========================================
*/

let todosProdutos = [];

async function carregarProdutos(){

    try{

        const res = await fetch(
            API_URL + "?action=listarprodutos&page=1&limit=9999"
        );

        const data = await res.json();

        todosProdutos = data.rows || [];

        mostrarProdutos(todosProdutos);

    }catch(err){

        console.error(err);

        document.getElementById("produtos").innerHTML =
            "<p>Erro ao carregar produtos</p>";

    }

}

/*
========================================
MOSTRAR PRODUTOS
========================================
*/

function mostrarProdutos(lista){

    const div = document.getElementById("produtos");

    div.innerHTML = "";

    lista.forEach(prod => {

        div.innerHTML += `
            <div class="card">

                <h3>
                    ${prod.PRODUTO || ""}
                </h3>

                <p>
                    <b>Categoria:</b>
                    ${prod.CATEGORIA || "-"}
                </p>

                <p>
                    <b>Quantidade:</b>
                    ${prod.QUANTIDADE || "0"}
                </p>

                <p>
                    <b>Caixa:</b>
                    ${prod.CAIXA || "-"}
                </p>

                <p>
                    <b>ID:</b>
                    ${prod.ID_PRODUTO || "-"}
                </p>

                <button onclick="adicionarEtiquetaPorId('${prod.ID_PRODUTO}')">
                    ➕ Gerar Etiqueta
                </button>

            </div>
        `;

    });

}

/*
========================================
BUSCAR
========================================
*/
function adicionarEtiquetaPorId(id){

    const prod = todosProdutos.find(p =>
        String(p.ID_PRODUTO) === String(id)
    );

    if(!prod) return;

    adicionarEtiqueta(prod);

}
function buscarProdutos(){

    const termo = document
        .getElementById("busca")
        .value
        .toLowerCase()
        .trim();

    const filtrados = todosProdutos.filter(p => {

        const produto = String(p.PRODUTO || "")
            .toLowerCase();

        const categoria = String(p.CATEGORIA || "")
            .toLowerCase();

        const caixa = String(p.CAIXA || "")
            .toLowerCase();

        return (
            produto.includes(termo) ||
            categoria.includes(termo) ||
            caixa.includes(termo)
        );

    });

    mostrarProdutos(filtrados);

}

/*
========================================
GERAR ETIQUETA
========================================
*/

function adicionarEtiqueta(prod){

    const area = document.getElementById("areaEtiqueta");

    const codigo = String(
        prod.ID_PRODUTO || Date.now()
    );

    const idSvg = "barcode_" + Date.now();

    area.innerHTML += `

        <div class="etiqueta">

            <div class="nome-produto">
                ${prod.PRODUTO || ""}
            </div>

            <div class="info">
                <b>Categoria:</b>
                ${prod.CATEGORIA || "-"}
            </div>

            <div class="info">
                <b>Quantidade:</b>
                ${prod.QUANTIDADE || "0"}
            </div>

            <div class="info">
                <b>Caixa:</b>
                ${prod.CAIXA || "-"}
            </div>

            <div class="barra">
                <svg id="${idSvg}"></svg>
            </div>

            <div class="codigo">
                ${codigo}
            </div>

        </div>

    `;

    setTimeout(() => {

        JsBarcode(
            "#" + idSvg,
            codigo,
            {
                format:"CODE128",
                displayValue:false,
                height:60,
                width:2,
                margin:0
            }
        );

    },100);

}

/*
========================================
INICIAR
========================================
*/

document.getElementById("busca")
.addEventListener("input", async function(){

    const termo = this.value.trim();

    // só busca quando digitar 2 letras
    if(termo.length < 2){

        document.getElementById("produtos").innerHTML = "";

        return;
    }

    // carrega apenas 1 vez
    if(todosProdutos.length === 0){
        await carregarProdutos();
    }

    buscarProdutos();

});

</script>



</body>
</html>
