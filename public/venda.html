            <script>
          
            let paginaAtual = 1;
        const limite = 50;
        let carregando = false;


            let todosProdutos = [];
            let categoriaAtual = "";
            let carrinho = [];
            let proximoIdVenda = 0;


        async function carregarDados(reset = false) {
            if (carregando) return;
            carregando = true;

            if (reset) {
                paginaAtual = 1;
                todosProdutos = [];
                document.getElementById("produtos").innerHTML = "";
            }

            document.getElementById("loading").textContent = "⏳ Carregando produtos...";

            try {
                const res = await fetch(
            `${API_URL}?action=listarprodutos&page=${paginaAtual}&limit=${limite}`
        );

                const data = await res.json();

                todosProdutos.push(...(data.rows || []).filter(p => p.CATEGORIA));
                proximoIdVenda = (Number(data.ultimoIdVenda) || 0) + 1;

                preencherCategorias();
                mostrar(todosProdutos);

                // ✅ avança página se ainda tiver mais
                if ((paginaAtual * limite) < data.total) {
                paginaAtual++;
                }

            } catch (e) {
                console.error(e);
                document.getElementById("erro").textContent = "Erro ao carregar produtos.";
            }

            document.getElementById("loading").textContent = "";
            carregando = false;
            }
            
            function preencherCategorias() {
            const ul = document.getElementById("categorias");
            ul.innerHTML = "";
            const categorias = [...new Set(todosProdutos.map(p => p.CATEGORIA).filter(Boolean))].sort();

            ul.innerHTML += `<li><a href="#" class="ativo" onclick="filtrarPorCategoria('')">Todas</a></li>`;

            categorias.forEach(cat => {
                ul.innerHTML += `<li><a href="#" onclick="filtrarPorCategoria('${cat}')">${cat}</a></li>`;
            });
            }
            function irAdmin() {
    window.location.href = "admin.html";
    }
    function enviarPedido() {

    if (carrinho.length === 0) {
        mostrarAlerta("Carrinho vazio");
        return;
    }

    const funcionario = usuarioLogado?.nome || "Sem nome";
    const departamento = "Pedido App";

    const emergencial = document.getElementById("pedidoEmergencial").checked;

    const observacao = carrinho.map(p => 
        `${p.PRODUTO} (x${p.qtdVenda})`
    ).join(", ");

    fetch(API_URL, {
        method: "POST",
        body: new URLSearchParams({
        action: "salvarpedido",
        funcionario,
        departamento,
        observacao,
        emergencial: emergencial ? "SIM" : "NAO"
        })
    })
    .then(r => r.json())
    .then(res => {
        if(res.success){
        mostrarAlerta("Pedido enviado com sucesso!");

        carrinho = [];
        atualizarIcone();
        fecharCarrinho();

        } else {
        mostrarAlerta("Erro ao enviar pedido");
        }
    })
    .catch(err => {
        console.error(err);
        mostrarAlerta("Erro na conexão");
    });

    }

            function filtrarPorCategoria(cat) {
            categoriaAtual = cat;

            document.querySelectorAll("#categorias a").forEach(a => a.classList.remove("ativo"));

            const link = [...document.querySelectorAll("#categorias a")].find(a => a.textContent === (cat || "Todas"));
            if (link) link.classList.add("ativo");

            buscar();
            }
        function dinheiro(valor) {
            return Number(valor || 0).toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
            });
        }

            function buscar() {

    const termo = document
        .getElementById("busca")
        .value
        .toString()
        .toLowerCase()
        .trim();

    const filtrados = todosProdutos.filter(p => {

        const produto = String(p.PRODUTO || "")
            .toLowerCase();

        const caixa = String(p.CAIXA || "")
            .toLowerCase();

        const categoria = String(p.CATEGORIA || "")
            .toLowerCase();

        return (
            (!categoriaAtual || p.CATEGORIA === categoriaAtual) &&
            (
                produto.includes(termo) ||
                caixa.includes(termo) ||
                categoria.includes(termo)
            )
        );

    });

    mostrar(filtrados);
}

            function mostrar(lista) {
            const div = document.getElementById("produtos");
            div.innerHTML = "";

            lista.forEach(p => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                <img 
                    src="${tratarImagem(p['IMAGEM APP'])}" 
                    onclick='abrirModal(${JSON.stringify(p)})'
                    onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Sem+Imagem'"
    >
                <div class="info">
                    <h3>${p.PRODUTO}</h3>
                    <p><b>Categoria:</b> ${p.CATEGORIA}</p>
                    <p><b>Quantidade:</b> ${p.QUANTIDADE || '0'}</p>
                    <p><b>Caixa:</b> ${p.CAIXA || ''}</p>
                    <p><b>Valor:</b> ${dinheiro(p.VALOR_VENDA)}</p>


                </div>

                <button class="btn-add" onclick='addCarrinho(${JSON.stringify(p)})'>
                    ➕ Adicionar
                </button>
                `;

                div.appendChild(card);
            });
            }

        function abrirModal(p) {
            const chave = (p.CATEGORIA || "") + (p.PRODUTO || "");

            document.getElementById("modalImg").src = tratarImagem(p["IMAGEM APP"]).replace("=w500","=w1000");

            document.getElementById("modalDesc").innerHTML = `
            <h2>${p.PRODUTO}</h2>

            <p><b>ID Produto:</b> ${p.ID_PRODUTO || "—"}</p>
            <p><b>Categoria:</b> ${p.CATEGORIA}</p>
            <p><b>Categoria + Produto:</b> ${chave}</p>
            <p><b>Quantidade:</b> ${p.QUANTIDADE || '0'}</p>
            <p><b>Caixa:</b> ${p.CAIXA || ""}</p>

            <h2>
            <p><b>Valor:</b> ${dinheiro(p.VALOR_VENDA)}</p>

            </h2>
            `;

            document.getElementById("modal").style.display = "flex";
        }

            function fecharModal() {
            document.getElementById("modal").style.display = "none";
            }


        function addCarrinho(prod) {

            // 🔎 verifica se o produto já está no carrinho (por ID)
            const index = carrinho.findIndex(p =>
            String(p.ID_PRODUTO) === String(prod.ID_PRODUTO)
            );

            if (index >= 0) {
            // ✅ já existe → soma quantidade
            carrinho[index].qtdVenda =
                Number(carrinho[index].qtdVenda || 0) + 1;
            } else {
            // ✅ não existe → adiciona novo
            carrinho.push({
                ...prod,
                qtdVenda: 1,
                percentual: 0
            });
            }

            atualizarIcone();
        }

        function valorComPercentual(valor, percentual) {
            const v = Number(valor || 0);
            const p = Number(percentual || 0);
            return v + (v * p / 100);
        }

        function atualizarIcone() {
            const totalItens = carrinho.reduce(
            (soma, p) => soma + Number(p.qtdVenda || 0), 0
            );
            document.getElementById("qtdCarrinho").textContent = totalItens;
        }


            function abrirCarrinho() {
                document.getElementById("idVenda").innerHTML =
            "ID da Venda: <b>" + (proximoIdVenda || "—") + "</b>";

            const lista = document.getElementById("listaCarrinho");
            const totalEl = document.getElementById("totalCarrinho");

            lista.innerHTML = "";
            let total = 0;

            if (carrinho.length === 0) {
                lista.innerHTML = "<p>Carrinho vazio.</p>";
                totalEl.innerHTML = "Total: R$ 0,00";
            } else {
                carrinho.forEach((p, i) => {
                const valorBase = Number(p.VALOR_VENDA || 0);
        const percentual = Number(p.percentual || 0);
        const valorFinal = valorComPercentual(valorBase, percentual);
        const subtotal = valorFinal * p.qtdVenda;
        total += subtotal;

        lista.innerHTML += `
            <div class="item-carrinho">

            <img 
                src="${tratarImagem(p['IMAGEM APP'])}" 
                    onerror="this.onerror=null; this.src='https://via.placeholder.com/60?text=Sem+Imagem'"
                    >

            <div class="dados">
                <div><b>${p.PRODUTO || ''}</b></div>
                <div>${p.CATEGORIA || ''}</div>
                <div><b>Caixa:</b> ${p.CAIXA || '-'}</div>

                <div>
                Qtd:
                <input
                    type="number"
                    min="1"
                    step="1"
                    value="${p.qtdVenda}"
                    onchange="alterarQtd(${i}, this.value)"
                    style="width:70px"
                >  % :
                <input
                    type="number"
                    step="0.1"
                    value="${percentual}"
                    onchange="alterarPercentual(${i}, this.value)"
                    style="width:70px"
                >
                </div>

            

                <div>
                Unitário: ${dinheiro(valorFinal)}
                </div>

                <div>
                Subtotal: <b>${dinheiro(subtotal)}</b>
                </div>
            </div>

            <button onclick="remover(${i})">❌</button>
            </div>
            <hr>
        `;


                });

                totalEl.innerHTML = `<b>Total:</b> ${dinheiro(total)}`;

            }

            document.getElementById("modalCarrinho").style.display = "flex";
            }

            function remover(i) {
            carrinho.splice(i, 1);
            atualizarIcone();
            abrirCarrinho();
            }
        function calcularTotalCarrinho() {
            return carrinho.reduce((soma, p) => {
            const valorBase = Number(p.VALOR_VENDA || 0);
            const percentual = Number(p.percentual || 0);
            const valorFinal = valorComPercentual(valorBase, percentual);
            return soma + (valorFinal * Number(p.qtdVenda || 1));
            }, 0);
        }



        function alterarPercentual(index, valor) {
            let p = Number(valor);
            if (isNaN(p)) return;

            if (p > 100) p = 100;
            if (p < -100) p = -100;

            carrinho[index].percentual = p;
            abrirCarrinho();
        }


        
        function bloquearBotoes(status) {
            document.getElementById("btnFinalizarVenda").disabled = status;
            document.getElementById("btnOrcamento").disabled = status;
        }



            function fecharCarrinho() {
            document.getElementById("modalCarrinho").style.display = "none";
            }
        function mostrarSpinner(show) {
            document.getElementById("spinnerVenda").style.display =
            show ? "flex" : "none";
        }

            window.onload = carregarDados;
            // 🔥 RECEBER PEDIDO AUTOMATICO

            </script>

        <script>
            function mostrarAlerta(msg){

  const alerta = document.getElementById("alerta");

  alerta.innerText = msg;

    function tratarImagem(url) {
        if (!url) return "https://via.placeholder.com/300?text=Sem+Imagem";

        // padrão /d/ID/
        let match = url.match(/\/d\/(.*?)\//);
        if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}=w500`;
        }

        // padrão id=ID
        match = url.match(/id=(.*?)(?:&|$)/);
        if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}=w500`;
        }

        return url;
    }
