<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Ponto</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f6f8;
  padding:15px;
}

.container{
  max-width:700px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.1);
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input, button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
  box-sizing:border-box;
}

button{
  background:#1f6feb;
  color:#fff;
  border:none;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.card{
  background:#f9fafb;
  padding:12px;
  margin-top:15px;
  border-radius:8px;
  border-left:5px solid #1f6feb;
}

.total{
  font-weight:bold;
  margin-top:8px;
}

.divisor{
  margin-top:20px;
  margin-bottom:20px;
  border-top:1px solid #ddd;
}

.item{
  padding:5px 0;
  border-bottom:1px solid #eee;
}

.admin{
  color:#16a34a;
  font-weight:bold;
  margin-bottom:15px;
}
</style>
</head>

<body>

<div class="container">

<h2>📊 Relatório de Ponto</h2>

<div class="admin" id="adminNome"></div>

<!-- 🔎 FILTRO POR DIA -->
<label>Filtrar por Data</label>
<input type="date" id="dataFiltro">

<button onclick="carregarDia()">
Buscar por Dia
</button>

<div class="divisor"></div>

<!-- 📅 FILTRO POR MÊS -->
<label>Relatório Mensal</label>
<input type="month" id="mesFiltro">

<button onclick="carregarMes()">
Gerar Relatório
</button>

<div id="resultado"></div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- CONFIG -->
<script src="config.js"></script>

<script>

const API_URL = window.CONFIG.API_URL;

// ========================================
// FIREBASE
// ========================================

const firebaseConfig = {
  apiKey: "AIzaSyCxrHKJhD7sY3msvUrDBbeNNvFeuYsAQuA",
  authDomain: "consulta-estoque-app.firebaseapp.com",
  projectId: "consulta-estoque-app"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let usuarioLogado = null;

// ========================================
// LOGIN + BLOQUEIO
// ========================================

auth.onAuthStateChanged(async user => {

  if(!user){
    window.location.href = "login.html";
    return;
  }

  const doc = await db.collection("usuarios").doc(user.uid).get();

  usuarioLogado = doc.data();

  if(!usuarioLogado){
    alert("Usuário não encontrado");
    return;
  }

  const tipo = (usuarioLogado.tipo || "").toUpperCase();

  // 🔒 SOMENTE ADMIN
  if(tipo !== "ADMIN" && tipo !== "ADMINISTRATIVO"){

    alert("Acesso restrito!");

    window.location.href = "ponto.html";

    return;
  }

  document.getElementById("adminNome").innerText =
    "👤 " + usuarioLogado.nome;

});

// ========================================
// 📊 RELATÓRIO POR DIA
// ========================================

function carregarDia(){

  const dataInput = document.getElementById("dataFiltro").value;

  if(!dataInput){
    alert("Selecione uma data");
    return;
  }

  // yyyy-MM-dd → dd/MM/yyyy
  const partes = dataInput.split("-");

  const dataFormatada =
    `${partes[2]}/${partes[1]}/${partes[0]}`;

  fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"listarpontoadmin",
      data:dataFormatada
    })
  })
  .then(r=>r.json())
  .then(r=>{

    console.log(r);

    let html = "<h3>📅 Resultado do Dia</h3>";

    if(!r.dados || Object.keys(r.dados).length === 0){

      html += "<p>Nenhum registro encontrado</p>";

      document.getElementById("resultado").innerHTML = html;

      return;
    }

    for(let nome in r.dados){

      html += `<div class="card">`;

      html += `<b>👤 ${nome}</b>`;

      r.dados[nome].registros.forEach(p=>{

        const cor =
          p.tipo === "ENTRADA"
          ? "#16a34a"
          : "#dc2626";

        html += `
  <div class="total">
    ⏱ Total:
    ${r.dados[nome].totalFormatado}
  </div>

  <div class="total" style="color:#dc2626;">
    🔥 Hora Extra:
    ${r.dados[nome].horaExtra}
  </div>
`;
      });

      html += `
        <div class="total">
          ⏱ Total:
          ${r.dados[nome].totalFormatado}
        </div>
      `;

      html += `</div>`;
    }

    document.getElementById("resultado").innerHTML = html;

  })
  .catch(err=>{

    console.log(err);

    alert("Erro ao carregar relatório");

  });

}

// ========================================
// 📅 RELATÓRIO MENSAL
// ========================================

function carregarMes(){

  const mes = document.getElementById("mesFiltro").value;

  if(!mes){
    alert("Selecione um mês");
    return;
  }

  fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"relatoriomensal",
      mes:mes
    })
  })
  .then(r=>r.json())
  .then(r=>{

    console.log(r);

    let html = "<h3>📊 Relatório Mensal</h3>";

    if(!r.dados || Object.keys(r.dados).length === 0){

      html += "<p>Nenhum registro encontrado</p>";

      document.getElementById("resultado").innerHTML = html;

      return;
    }

    for(let nome in r.dados){

      html += `
        <div class="card">

          <b>👤 ${nome}</b>

          <div class="total">
            ⏱ ${r.dados[nome]}
          </div>

        </div>
      `;
    }

    document.getElementById("resultado").innerHTML = html;

  })
  .catch(err=>{

    console.log(err);

    alert("Erro ao gerar relatório");

  });

}

</script>

</body>
</html>
