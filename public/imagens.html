<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro de Imagens</title>

<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  padding: 20px;
}

.box {
  background: #fff;
  padding: 20px;
  max-width: 500px;
  margin: auto;
  border-radius: 10px;
}

input {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  background: #1b5500;
  color: #fff;
  cursor: pointer;
  margin-top: 5px;
}

#resultadoBusca {
  max-height: 150px;
  overflow-y: auto;
  border: 1px solid #ccc;
  display: none;
}

.itemBusca {
  padding: 8px;
  cursor: pointer;
}

.itemBusca:hover {
  background: #eee;
}

/* TAGS */
.tag {
  display: inline-block;
  background: #1b5500;
  color: #fff;
  padding: 5px 10px;
  margin: 3px;
  border-radius: 20px;
  font-size: 12px;
}

.tag span {
  margin-left: 8px;
  cursor: pointer;
  color: #ffcccc;
}

/* PREVIEW */
#previewBox {
  text-align: center;
  margin-top: 10px;
}

#previewImg {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  display: none;
}
</style>
</head>

<body>

<div class="box">
  <h2>Cadastro de Imagem</h2>

  <label>Buscar Produto</label>
  <input type="text" id="buscaProduto" placeholder="Digite o nome..." oninput="buscarProduto()">

  <div id="resultadoBusca"></div>

  <label>Produtos Selecionados</label>
  <div id="listaSelecionados"></div>

  <input type="hidden" id="idProduto">

  <label>Link da Imagem</label>
  <input type="text" id="linkImagem" placeholder="Cole o link da imagem" oninput="previewImagem()">

  <div id="previewBox">
    <img id="previewImg">
  </div>

  <button onclick="salvarImagem(event)">Salvar Imagem</button>
</div>
<script src="config.js"></script>
<script>


let produtos = [];
let idsSelecionados = [];

/* BUSCAR PRODUTO */
async function buscarProduto() {
  const termo = document.getElementById("buscaProduto").value.toLowerCase();

  if (!produtos.length) {
    const res = await fetch(CONFIG.API_URL + "?action=listarProdutos");
    const data = await res.json();
    produtos = data.rows || [];
  }

  const filtrados = produtos.filter(p =>
    (p.PRODUTO || "").toLowerCase().includes(termo)
  );

  const div = document.getElementById("resultadoBusca");
  div.innerHTML = "";
  div.style.display = "block";

  filtrados.slice(0, 10).forEach(p => {
    const item = document.createElement("div");
    item.className = "itemBusca";
    item.textContent = p.PRODUTO + " (ID: " + p.ID_PRODUTO + ")";

    item.onclick = () => {
      adicionarProduto(p.ID_PRODUTO, p.PRODUTO);
    };

    div.appendChild(item);
  });
}

/* ADICIONAR PRODUTO */
function adicionarProduto(id, nome) {

  if (idsSelecionados.includes(id)) {
    alert("Produto já adicionado!");
    return;
  }

  idsSelecionados.push(id);

  atualizarListaVisual();

  document.getElementById("idProduto").value = idsSelecionados.join(",");

  document.getElementById("buscaProduto").value = "";
  document.getElementById("resultadoBusca").style.display = "none";
}

/* MOSTRAR TAGS */
function atualizarListaVisual() {
  const div = document.getElementById("listaSelecionados");
  div.innerHTML = "";

  idsSelecionados.forEach(id => {
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.innerHTML = `ID: ${id} <span onclick="removerProduto('${id}')">x</span>`;
    div.appendChild(tag);
  });
}

/* REMOVER */
function removerProduto(id) {
  idsSelecionados = idsSelecionados.filter(i => i != id);

  atualizarListaVisual();
  document.getElementById("idProduto").value = idsSelecionados.join(",");
}

/* PREVIEW */
function previewImagem() {
  const url = document.getElementById("linkImagem").value;
  const img = document.getElementById("previewImg");

  img.onload = () => {
    img.style.display = "block";
  };

  img.onerror = () => {
    img.style.display = "none";
    alert("Imagem inválida!");
  };

  img.src = url;
}



/* FECHAR LISTA */
document.addEventListener("click", (e) => {
  if (!e.target.closest(".box")) {
    document.getElementById("resultadoBusca").style.display = "none";
  }
});

/* SALVAR */
function salvarImagem(event) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = "Salvando...";

  const ids = [...idsSelecionados];
  const link = document.getElementById("linkImagem").value;

  if (!ids.length || !link) {
    alert("Selecione produtos e informe a imagem");
    btn.disabled = false;
    btn.textContent = "Salvar Imagem";
    return;
  }

  let concluidos = 0;
  const total = ids.length;

  window.retornoSalvar = function(resposta) {

    concluidos++;

    btn.textContent = `Salvando ${concluidos}/${total}...`;

    if (concluidos >= total) {

      alert("Imagem salva para todos!");

      // LIMPAR TUDO
      idsSelecionados = [];
      atualizarListaVisual();

      document.getElementById("idProduto").value = "";
      document.getElementById("linkImagem").value = "";
      document.getElementById("buscaProduto").value = "";

      const img = document.getElementById("previewImg");
      img.src = "";
      img.style.display = "none";

      document.getElementById("resultadoBusca").innerHTML = "";
      document.getElementById("resultadoBusca").style.display = "none";

      btn.disabled = false;
      btn.textContent = "Salvar Imagem";
    }
  };

  ids.forEach(id => {

    const script = document.createElement("script");

    script.src =
      CONFIG.API_URL +
      "?action=salvarimagemlink" +
      "&id=" + encodeURIComponent(id) +
      "&url=" + encodeURIComponent(link) +
      "&callback=retornoSalvar" +
      "&_=" + Date.now() + Math.random();

    document.body.appendChild(script);

    script.onload = () => script.remove();
    script.onerror = () => {
      concluidos++;

      if (concluidos >= total) {
        alert("Algumas imagens podem não ter sido salvas.");

        btn.disabled = false;
        btn.textContent = "Salvar Imagem";
      }

      script.remove();
    };
  });
}
</script>

</body>
</html>
