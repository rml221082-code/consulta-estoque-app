<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Orçamentos</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

.container {
  max-width: 1200px;
  margin: auto;
  background: #fff;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 6px 16px rgba(0,0,0,.08);
}

h1 {
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

th {
  background: #0078d4;
  color: #fff;
}

tr:nth-child(even) {
  background: #f2f6fb;
}

button {
  background: #0078d4;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #005a9e;
}

.pdf-link {
  display: block;
  margin-bottom: 6px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Serviços em Orçamento</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Data</th>
        <th>Nota</th>
        <th>Cliente</th>
        <th>Empresa</th>
        <th>Descrição</th>
        <th>Checklist</th>
        <th>PDF</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>
</div>

<script>
/* 🔹 URL ÚNICA E CORRETA DO GAS */
const GAS_URL = "https://script.google.com/macros/s/AKfycbzxdnIzDmsjy06njan7yro4BO78sZ-n9tpp1yTjshrQmdhHu03L7rYnP5ppQtg90wwbng/exec";

/* 🔹 Carregar orçamentos (JSONP) */
function carregarOrcamentos() {
  const script = document.createElement("script");
  script.src = `${GAS_URL}?action=listarorcamentos&callback=renderOrcamentos`;
  document.body.appendChild(script);
}

/* 🔹 Renderiza tabela */
function renderOrcamentos(json) {
  if (!json.success) {
    alert("Erro ao carregar orçamentos");
    return;
  }

  const tbody = document.getElementById("lista");
  tbody.innerHTML = "";

  json.dados.forEach(s => {
    const tr = document.createElement("tr");

    const tdPdf = document.createElement("td");
tdPdf.innerHTML = `
  <button onclick="carregarPdfs(${s.id}, this)">📄 PDFs</button>
  <button style="margin-top:6px;background:#28a745"
          onclick="abrirOrcamento(${s.id}, '${s.nota}')">
    ➕ ORÇAMENTO
  </button>
`;


    tr.innerHTML = `
      <td>${s.id}</td>
      <td>${s.data}</td>
      <td>${s.nota}</td>
      <td>${s.cliente}</td>
      <td>${s.empresa}</td>
      <td>${s.descricao}</td>
      <td>${s.checklist}</td>
    `;

    tr.appendChild(tdPdf);
    tbody.appendChild(tr);
  });
}

/* 🔹 Buscar PDFs do serviço */
async function carregarPdfs(id, btn) {
  const td = btn.parentElement;
  td.innerHTML = "Carregando...";

  try {
    const res = await fetch(
  `${GAS_URL}?action=listararquivosservico&id=${id}`
);

    const json = await res.json();

    td.innerHTML = "";

    if (!json.success || !json.pdfs || json.pdfs.length === 0) {
      td.innerHTML = "<i>Sem PDF</i>";
      return;
    }

    json.pdfs.forEach(p => {
      const a = document.createElement("a");
      a.href = p.url;
      a.target = "_blank";
      a.textContent = "📄 " + p.nome;
      a.className = "pdf-link";
      td.appendChild(a);
    });

  } catch (e) {
    td.innerHTML = "Erro";
    console.error(e);
  }
}

/* 🔹 Inicia */
carregarOrcamentos();
</script>
<div id="modalOrcamento" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:999;
">
  <div style="
    background:#fff;
    max-width:800px;
    margin:5% auto;
    padding:20px;
    border-radius:10px;
  ">
    <h2>🧾 Criar Orçamento</h2>

    <textarea id="textoOrcamento" rows="6" style="width:100%"
      placeholder="Descreva o orçamento..."></textarea>

    <br><br>

    <label>Fotos do orçamento</label>
    <input type="file" id="fotosOrcamento" multiple accept="image/*">

    <br><br>

    <button onclick="salvarOrcamento()">💾 Gerar PDF</button>
    <button onclick="fecharOrcamento()" style="background:#999">Cancelar</button>
  </div>
</div>
<script>
let ORCAMENTO_ID = null;
let ORCAMENTO_NOTA = null;

function abrirOrcamento(id, nota) {
  ORCAMENTO_ID = id;
  ORCAMENTO_NOTA = nota;
  document.getElementById("textoOrcamento").value = "";
  document.getElementById("fotosOrcamento").value = "";
  document.getElementById("modalOrcamento").style.display = "block";
}

function fecharOrcamento() {
  document.getElementById("modalOrcamento").style.display = "none";
}

async function salvarOrcamento() {
  const texto = document.getElementById("textoOrcamento").value;
  const fotos = document.getElementById("fotosOrcamento").files;

  if (!texto.trim()) {
    alert("Digite o texto do orçamento");
    return;
  }

  const fotosBase64 = [];
  for (const f of fotos) {
    const b64 = await toBase64(f);
    fotosBase64.push({
      nome: f.name,
      tipo: f.type,
      dados: b64
    });
  }

  const form = new FormData();
  form.append("action", "salvarorcamento");
  form.append("id", ORCAMENTO_ID);
  form.append("nota", ORCAMENTO_NOTA);
  form.append("texto", texto);
  form.append("fotos", JSON.stringify(fotosBase64));

  const res = await fetch(GAS_URL, {
    method: "POST",
    body: form
  });

  const json = await res.json();

  if (json.success) {
    window.open(json.pdf, "_blank");
    fecharOrcamento();
  } else {
    alert("Erro: " + json.erro);
  }
}

function toBase64(file) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result.split(",")[1]);
    r.readAsDataURL(file);
  });
}
</script>

</body>
</html>
