    <script>
    const API_URL = window.CONFIG.API_URL;
    
    let carrinho = [];
    let produtos = [];
    let produtosBase = [];
    let categoriaAtual = "";

let timerBusca;

function debounceBuscar() {
  clearTimeout(timerBusca);
  timerBusca = setTimeout(buscar, 300);
}
    /* ======= RENDERIZA PRODUTOS ======= */
  function tratarImagem(url) {
  if (!url) return "https://via.placeholder.com/300";

  // padrão /d/ID/
  let match = url.match(/\/d\/(.*?)\//);
  if (match && match[1]) {
    return `https://lh3.googleusercontent.com/d/${match[1]}=w500`;
  }

  // padrão id=ID
  match = url.match(/id=(.*?)(?:&|$)/);
  if (match && match[1]) {
    return `https://lh3.googleusercontent.com/d/${match[1]}=w500`;
  }

  return url;
}
  
  function fecharModal() {
    document.getElementById("modal").style.display = "none";
  }
  function abrirModal(p) {
      const chave = (p.CATEGORIA || "") + (p.PRODUTO || "");

      document.getElementById("modalImg").src = tratarImagem(p["IMAGEM APP"]);

      document.getElementById("modalDesc").innerHTML = `
        <h2>${p.PRODUTO}</h2>

        
        <p><b>Categoria:</b> ${p.CATEGORIA}</p>
        <p><b>Categoria + Produto:</b> ${chave}</p>
        <p><b>Quantidade:</b> ${p.QUANTIDADE || '0'}</p>
        <p><b>Caixa:</b> ${p.CAIXA || ""}</p>

        <h2>
        <p><b>Valor:</b> ${dinheiro(p.VALOR_VENDA)}</p>

        </h2>
      `;

      document.getElementById("modal").style.display = "flex";
    }

      

    /* ======= CARRINHO ======= */

    function addCarrinho(p) {
      const existente = carrinho.find(i => i.ID_PRODUTO === p.ID_PRODUTO);

      if (existente) {
        existente.qtd += 1;
      } else {
        carrinho.push({
          IMAGEM: p["IMAGEM APP"] || "",
          ID_PRODUTO: p.ID_PRODUTO,
          PRODUTO: p.PRODUTO,
          CATEGORIA: p.CATEGORIA,
          CAIXA: p.CAIXA, // ✅ AQUI
          qtd: 1,
          valorCompra: Number(p.VALOR_COMPRA) || 0,
          ipi: 0,
          icms: 0,
          venda: 0,
          total: Number(p.VALOR_COMPRA) || 0
        });
      }

      atualizarIcone();
    }

    function atualizarIcone() {

  let totalItens = 0;

  carrinho.forEach(item => {
    totalItens += item.qtd;
  });

  document.getElementById("qtdCarrinho").innerText = totalItens;
}

    function abrirCarrinho() {
      atualizarCarrinho();
      document.getElementById("modalCarrinho").style.display = "flex";
    }


      
    function dinheiro(valor) {
      return Number(valor || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }
 function buscar() {

    const termo = document
        .getElementById("busca")
        .value
        .toString()
        .toLowerCase()
        .trim();

    const filtrados = produtosBase.filter(p => {

        const produto = String(p.PRODUTO || "")
            .toLowerCase();

        const caixa = String(p.CAIXA || "")
            .toLowerCase();

        const categoria = String(p.CATEGORIA || "")
            .toLowerCase();

        return (
            (!categoriaAtual || p.CATEGORIA === categoriaAtual) &&
            (
                produto.includes(termo) ||
                caixa.includes(termo) ||
                categoria.includes(termo)
            )
        );

    });

    renderizarProdutos(filtrados);
}


    function atualizarCarrinho() {
      const tbody = document.getElementById("listaCarrinho");
      tbody.innerHTML = "";
      let totalGeral = 0;

      carrinho.forEach((i, idx) => {
        const valorFinal =
        
          i.valorCompra +
          (i.valorCompra * i.ipi / 100) +
          (i.valorCompra * i.icms / 100) +
          (i.valorCompra * i.venda / 100);

        i.total = valorFinal;
        totalGeral += i.total * i.qtd;

    tbody.innerHTML += `
<tr>
  <td>${i.CATEGORIA}</td>

  <td style="text-align:left;">
    <div style="display:flex; align-items:center; gap:10px;">
      
      <img src="${tratarImagem(i.IMAGEM)}"
           onerror="this.src='https://via.placeholder.com/50'"
           style="width:50px; height:50px; object-fit:cover; border-radius:6px;">

      <div>
        <b>${i.PRODUTO}</b>
      </div>

    </div>
  </td>

  <td>${i.CAIXA}</td>

  <td>
    <input type="number" min="1" value="${i.qtd}" 
    oninput="carrinho[${idx}].qtd=Number(this.value)||1; agendarAtualizacao()">
  </td>

  <td><input type="number" value="${i.valorCompra}" onchange="carrinho[${idx}].valorCompra=Number(this.value)||0; atualizarCarrinho()"></td>
  <td><input type="number" value="${i.ipi}" onchange="carrinho[${idx}].ipi=Number(this.value)||0; atualizarCarrinho()"></td>
  <td><input type="number" value="${i.icms}" onchange="carrinho[${idx}].icms=Number(this.value)||0; atualizarCarrinho()"></td>
  <td><input type="number" value="${i.venda}" onchange="carrinho[${idx}].venda=Number(this.value)||0; atualizarCarrinho()"></td>

  <td>${i.total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</td>

  <td>
    <button onclick="carrinho.splice(${idx},1); atualizarCarrinho(); atualizarIcone()">❌</button>
  </td>
</tr>
`;
      });

      document.getElementById("totalGeral").innerText = dinheiro(totalGeral);
    }



    </script>
    <!-- 🔥 SOMENTE A PARTE CORRIGIDA -->

  <script>
  function renderizarProdutos(lista) {
  const div = document.getElementById("produtos");
  div.innerHTML = "";

  const fragment = document.createDocumentFragment();

  lista.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    const imagem = tratarImagem(p['IMAGEM APP']);

    card.innerHTML = `
      <img src="${imagem}" 
 onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Sem+Imagem'">

      <div class="info">
        <b>${p.PRODUTO}</b><br>
        Categoria: ${p.CATEGORIA || "-"}<br>
        Estoque: ${p.QUANTIDADE || 0}<br>
        Caixa: ${p.CAIXA || ''}<br>
        Compra: ${Number(p.VALOR_COMPRA || 0)
          .toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
      </div>

      <button class="btn-add">➕ Adicionar</button>
    `;

    // 🔥 EVENTO NA IMAGEM (correto)
    card.querySelector("img")
      .addEventListener("click", () => abrirModal(p));

    // 🔥 BOTÃO
    card.querySelector(".btn-add")
      .addEventListener("click", () => addCarrinhoPorId(p.ID_PRODUTO));

    fragment.appendChild(card);
  });

  div.appendChild(fragment);
}</script>
    <script>
  function renderizarCategorias() {
    const div = document.getElementById("categorias");
    div.innerHTML = "";

    const categorias = [...new Set(
      produtosBase
        .map(p => (p.CATEGORIA || "").trim())
        .filter(Boolean)
    )].sort();

    criarLinkCategoria("Todas", "");

    categorias.forEach(cat => criarLinkCategoria(cat, cat));

    function criarLinkCategoria(nome, valor) {
      const a = document.createElement("a");
      a.href = "#";
      a.textContent = nome;

      // ✅ MARCA COMO ATIVO
      if (valor === categoriaAtual) {
        a.classList.add("ativo");
      }

      a.onclick = e => {
        e.preventDefault();

        categoriaAtual = valor;

        // 🔥 REMOVE ATIVO DE TODOS
        document.querySelectorAll("#categorias a")
          .forEach(el => el.classList.remove("ativo"));

        // 🔥 ADICIONA NO CLICADO
        a.classList.add("ativo");

        buscar();
      };

      div.appendChild(a);
    }
  }

    
    </script>


    <script>
    async function salvarEntrada() {
      if (carrinho.length === 0) {
        alert("Carrinho vazio");
        return;
      }

      const itens = carrinho.map(i => ({
      ID_PRODUTO: i.ID_PRODUTO,
      CATEGORIA: i.CATEGORIA,
      PRODUTO: i.PRODUTO,
      QTD: i.qtd,
      VALOR_COMPRA: i.valorCompra,
      VALOR_VENDA: i.total,   // 👈 TOTAL FINAL
      IPI: i.ipi,
      ICMS: i.icms,
      VENDA: i.venda
    }));


      const form = new URLSearchParams();
      form.append("action", "salvarEntrada");
      form.append("itens", JSON.stringify(itens));

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: form
        });

        const data = await res.json();

        if (data.success) {
          alert("Entrada salva com sucesso!");
          carrinho = [];
          atualizarCarrinho();
          atualizarIcone();
          fecharCarrinho();
        } else {
          alert("Erro: " + data.erro);
        }

      } catch (e) {
        console.error(e);
        alert("Erro ao salvar entrada");
      }
    }
    </script>
    <script>
    async function carregarProdutos() {
      try {
        const url = API_URL + "?action=listarProdutos";

        const res = await fetch(url);
        const data = await res.json();

        if (!data.rows || !Array.isArray(data.rows)) {
          throw new Error("Resposta inválida da API");
        }

        produtosBase = data.rows;
  produtos = [...produtosBase];

  renderizarCategorias();
  renderizarProdutos(produtos);

   carregarCategoriasManual(); // 🔥 GARANTE atualização

      } catch (e) {
        console.error("Erro ao carregar produtos:", e);
        alert("Erro ao carregar produtos. Veja o console.");
      }
    }
    </script>


    <script>
    function addCarrinhoPorId(id) {
      const produto = produtos.find(p => String(p.ID_PRODUTO) === String(id));
      if (!produto) return;
      addCarrinho(produto);
    }
    </script>
    <script>
    let timerCarrinho;
    function agendarAtualizacao() {
      clearTimeout(timerCarrinho);
      timerCarrinho = setTimeout(atualizarCarrinho, 200);
    }
    </script>
    <script>

    document.addEventListener("DOMContentLoaded", async () => {
  await carregarProdutos(); // espera carregar os produtos
  carregarCategoriasManual(); // agora sim funciona
});
    </script>

      .map(p => (p.CATEGORIA || "").trim())

  categorias.forEach(c => {
    const opt = document.createElement("option");

      if (!data.success) {

});
const imagem = document.getElementById("imagemManual").value.trim();

if (imagem) {

    document.body.appendChild(script);

    script.onload = () => script.remove();

    script.onerror = () => {
        console.error("Erro ao salvar imagem");
        script.remove();
    };
}

valorEl.value = "0";

document.getElementById("caixaManual").value = "";
