<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Loja Profissional</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6f8}

/* TOPO */
header{
  position:fixed;
  top:0;
  width:100%;
  height:70px;
  background:#121111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:999;
}

header input{
  width:300px;
  padding:10px;
  border-radius:8px;
  border:none;
}

/* SIDEBAR */
#sidebar{
  position:fixed;
  top:70px;
  left:0;
  bottom:0;
  width:220px;
  background:#fff;
  border-right:1px solid #ddd;
  padding:10px;
  overflow:auto;
}

#categorias a{
  display:block;
  padding:8px;
  border-radius:6px;
  cursor:pointer;
}
#categorias a:hover{background:#121111;color:#fff}
.ativo{background:#121111;color:#fff}

/* MAIN */
main{
  margin-left:220px;
  margin-top:80px;
  padding:20px;
}

#produtos{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.info{padding:10px}

.btn{
  background:#121111;
  color:#fff;
  border:none;
  padding:10px;
  cursor:pointer;
}

/* CARRINHO */
#carrinhoBtn{
  background:#fff;
  color:#000;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

#modalCarrinho{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

#boxCarrinho{
  background:#fff;
  padding:20px;
  width:400px;
  max-height:80vh;
  overflow:auto;
  border-radius:10px;
}
</style>

</head>

<body>

<header>
  <h3>Minha Loja</h3>
  <input id="busca" placeholder="Buscar..." oninput="buscar()">
  <button id="carrinhoBtn" onclick="abrirCarrinho()">🛒 (<span id="qtd">0</span>)</button>
</header>

<aside id="sidebar">
  <h4>Categorias</h4>
  <div id="categorias"></div>
</aside>

<main>
  <div id="produtos"></div>
</main>

<div id="modalCarrinho">
  <div id="boxCarrinho">
    <h2>Carrinho</h2>
    <div id="lista"></div>
    <h3 id="total"></h3>
    <button class="btn" onclick="fecharCarrinho()">Fechar</button>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyqArNZnGzgDzn1mOCkHB2UGinLbANe4HBRfZgZ5neBLj-cQFPGSQl5aWnvf5Joh-vwsA/exec";

let produtos=[], carrinho=[], categoriaAtual="";

/* IMAGEM */
function tratarImagem(p){
 let url=p["IMAGEM APP"]||p["novolink"]||"";
 if(!url) return "https://via.placeholder.com/300";

 let m=url.match(/\/d\/(.*?)\//)||url.match(/id=(.*?)(?:&|$)/);
 if(m) return "https://lh3.googleusercontent.com/d/"+m[1];

 return url;
}

/* CARREGAR */
async function carregar(){
 let r=await fetch(API+"?action=listarprodutos");
 let d=await r.json();
 produtos=d.rows||[];
 montarCategorias();
 mostrar(produtos);
}

/* CATEGORIAS */
function montarCategorias(){
 let cats=[...new Set(produtos.map(p=>p.CATEGORIA))];
 let div=document.getElementById("categorias");
 div.innerHTML='<a onclick="filtrar(\'\')" class="ativo">Todas</a>';

 cats.forEach(c=>{
  div.innerHTML+=`<a onclick="filtrar('${c}')">${c}</a>`;
 });
}

function filtrar(cat){
 categoriaAtual=cat;
 buscar();
}

/* BUSCA */
function buscar(){
 let t=document.getElementById("busca").value.toLowerCase();
 let lista=produtos.filter(p=>
 (!categoriaAtual||p.CATEGORIA==categoriaAtual) &&
 (p.PRODUTO||"").toLowerCase().includes(t)
 );
 mostrar(lista);
}

/* MOSTRAR */
function mostrar(lista){
 let div=document.getElementById("produtos");
 div.innerHTML="";
 lista.forEach(p=>{
  div.innerHTML+=`
   <div class="card">
     <img src="${tratarImagem(p)}">
     <div class="info">
       <h3>${p.PRODUTO}</h3>
       <p>${p.CATEGORIA}</p>
       <p>R$ ${Number(p.VALOR_VENDA||0).toFixed(2)}</p>
     </div>
     <button class="btn" onclick='add(${JSON.stringify(p)})'>Adicionar</button>
   </div>
  `;
 });
}

/* CARRINHO */
function add(p){
 let i=carrinho.findIndex(x=>x.ID_PRODUTO==p.ID_PRODUTO);
 if(i>=0) carrinho[i].qtd++;
 else carrinho.push({...p,qtd:1});
 atualizar();
}

function atualizar(){
 document.getElementById("qtd").innerText=
 carrinho.reduce((s,p)=>s+p.qtd,0);
}

function abrirCarrinho(){
 let lista=document.getElementById("lista");
 let total=0;
 lista.innerHTML="";

 carrinho.forEach((p,i)=>{
  let sub=p.qtd*p.VALOR_VENDA;
  total+=sub;

  lista.innerHTML+=`
   <p>${p.PRODUTO} x${p.qtd} - R$ ${sub.toFixed(2)}
   <button onclick="remover(${i})">❌</button></p>
  `;
 });

 document.getElementById("total").innerText="Total: R$ "+total.toFixed(2);
 document.getElementById("modalCarrinho").style.display="flex";
}

function remover(i){
 carrinho.splice(i,1);
 atualizar();
 abrirCarrinho();
}

function fecharCarrinho(){
 document.getElementById("modalCarrinho").style.display="none";
}

carregar();
</script>

</body>
</html>
