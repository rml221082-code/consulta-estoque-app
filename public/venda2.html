<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>HIDRAUMAN</title>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8}
header{background:#0d6efd;color:#fff;padding:15px;text-align:center;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;padding:20px}
.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,0.1)}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
button{background:#28a745;color:#fff;border:none;padding:10px;width:100%;border-radius:6px;cursor:pointer}
#carrinho{position:fixed;bottom:10px;right:10px;background:#000;color:#fff;padding:15px;border-radius:10px}
</style>

</head>
<body>

<header>HIDRAUMAN</header>

<div class="grid" id="produtos"></div>

<div id="carrinho">
🛒 R$ <span id="total">0.00</span>
<button onclick="finalizar()">Finalizar</button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyqArNZnGzgDzn1mOCkHB2UGinLbANe4HBRfZgZ5neBLj-cQFPGSQl5aWnvf5Joh-vwsA/exec";

let produtos = [];
let carrinho = [];

async function carregarProdutos(){
  const res = await fetch(API + "?action=listarprodutos");
  const json = await res.json();

  produtos = json.rows;

  let html = "";

  produtos.forEach(p => {

  if(Number(p.QUANTIDADE || 0) <= 0) return;

  html += `
    <div class="card">
      <img src="${p.novolink || 'https://via.placeholder.com/200'}">
      <h3>${p.PRODUTO}</h3>
      <p>R$ ${Number(p.VALOR || 0).toFixed(2)}</p>
      <button onclick="add('${p.ID}','${p.PRODUTO}',${p.VALOR},'${p.CATEGORIA}')">
        Comprar
      </button>
    </div>
  `;
});

  document.getElementById("produtos").innerHTML = html;
}

function add(id, nome, preco, categoria){
  carrinho.push({
    idProduto: id,
    produto: nome,
    qtd: 1,
    valorUnitario: preco,
    subtotal: preco,
    categoria: categoria
  });

  atualizar();
}

function atualizar(){
  let total = carrinho.reduce((s,i)=>s+i.subtotal,0);
  document.getElementById("total").innerText = total.toFixed(2);
}

async function finalizar(){

  if(carrinho.length === 0){
    alert("Carrinho vazio");
    return;
  }

  let nome = prompt("Seu nome:");
  let whats = prompt("Seu WhatsApp:");

  let total = carrinho.reduce((s,i)=>s+i.subtotal,0);

  // 🔥 pega próximo ID automaticamente
  const res = await fetch(API + "?action=listarprodutos");
  const dados = await res.json();

  const idVenda = (dados.ultimoIdVenda || 0) + 1;

  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"salvarvenda",
      idVenda,
      totalVenda: total,
      tipo:"VENDA",
      itens: JSON.stringify(carrinho)
    })
  });

  // WhatsApp
  let msg = "🧾 Pedido HIDRAUMAN:%0A";
  carrinho.forEach(i=>{
    msg += `- ${i.produto} R$${i.valorUnitario}%0A`;
  });
  msg += `Total: R$${total}%0A`;
  msg += `Pagamento: PIX`;

  window.open(`https://wa.me/5519992367919?text=${msg}`);

  carrinho=[];
  atualizar();
}

carregarProdutos();
</script>

</body>
</html>
