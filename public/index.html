<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCxrHKJhD7sY3msvUrDBbeNNvFeuYsAQuA",
  authDomain: "consulta-estoque-app.firebaseapp.com",
  projectId: "consulta-estoque-app",
  storageBucket: "consulta-estoque-app.firebasestorage.app",
  messagingSenderId: "1065893590092",
  appId: "1:1065893590092:web:479ebc4a07cf66457430e9"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async user => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  let doc = await db.collection("usuarios").doc(user.uid).get();

  let usuario;

  // cria se não existir
  if (!doc.exists) {
    usuario = {
      nome: user.displayName || "Usuário",
      email: user.email,
      tipo: "funcionario",
      ativo: false
    };

    await db.collection("usuarios").doc(user.uid).set(usuario);
  } else {
    usuario = doc.data();
  }

  // bloqueio
  if (usuario.ativo === false) {
    alert("Aguardando liberação do administrador");
    await auth.signOut();
    window.location.href = "login.html";
    return;
  }

  // =========================
  // 👤 HEADER USUÁRIO
  // =========================

  const header = document.querySelector("header");

  const userBox = document.createElement("div");
  userBox.style.position = "absolute";
  userBox.style.right = "80px";
  userBox.style.top = "10px";
  userBox.style.display = "flex";
  userBox.style.alignItems = "center";
  userBox.style.gap = "10px";
  userBox.style.color = "white";

  const avatar = document.createElement("img");
  avatar.src = user.photoURL || "https://i.imgur.com/6VBx3io.png";
  avatar.style.width = "35px";
  avatar.style.borderRadius = "50%";

  const info = document.createElement("div");
  info.innerHTML = `
    <div><b>${usuario.nome}</b></div>
    <div style="font-size:11px;">${usuario.tipo}</div>
  `;

  const sair = document.createElement("button");
  sair.innerText = "Sair";
  sair.onclick = () => {
    auth.signOut().then(() => {
      window.location.href = "login.html";
    });
  };

  userBox.appendChild(avatar);
  userBox.appendChild(info);
  userBox.appendChild(sair);

  header.appendChild(userBox);

  // 🔥 BOTÃO ADMIN
  if (usuario.tipo === "admin") {
    const btnAdmin = document.createElement("button");
    btnAdmin.innerText = "Admin";
    btnAdmin.style.position = "absolute";
    btnAdmin.style.right = "10px";
    btnAdmin.style.top = "18px";

    btnAdmin.onclick = () => {
      window.location.href = "admin.html";
    };

    header.appendChild(btnAdmin);
  }

  // =========================
  // 🔐 CONTROLE DE BOTÕES
  // =========================

// 🔐 CONTROLE DE ACESSO (FUNCIONA COM VÁRIOS TIPOS)

const tipoUsuario = usuario.tipo;

// Esconde tudo primeiro
document.querySelectorAll("[data-tipo]").forEach(el => {
  el.style.display = "none";
});

// Mostra apenas o permitido
document.querySelectorAll("[data-tipo]").forEach(el => {

  const tiposPermitidos = el.dataset.tipo.split(" ");

  if (tiposPermitidos.includes(tipoUsuario)) {
    el.style.display = "block";
  }

});

});
</script>

if(emailsPermitidos.includes(user.email)){
  document.getElementById("btnServico").style.display = "block";
}
