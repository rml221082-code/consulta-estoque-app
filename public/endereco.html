        <!DOCTYPE html>
        <html lang="pt-BR">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Endereços dos Clientes</title>

        <style>

        body{
            margin:0;
            font-family:Segoe UI,Arial;
            background:#f4f6f8;
        }

        header{
            background:#1b5500;
            color:#fff;
            padding:15px;
            position:sticky;
            top:0;
        }

        h2{
            margin:0;
        }

        .container{
            padding:15px;
        }

        .card{
            background:#fff;
            color:#000;
            border-radius:12px;
            padding:15px;
            margin-bottom:15px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        .cliente{
            font-size:18px;
            font-weight:bold;
            margin-bottom:15px;
        }

        .btn{
            border:none;
            padding:12px;
            border-radius:8px;
            cursor:pointer;
            color:white;
            font-size:15px;
            width:100%;
        }

        .maps{
            background:#0078d4;
        }

        .whats{
            background:#16a34a;
        }

        select{
            width:100%;
            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            margin-top:10px;
        }

        #listaClientes{
            margin-top:20px;
        }

        </style>
        </head>
        <body>

        <header>
            <h2>📍 Endereços dos Fornecedores</h2>
            <div class="container">

        <input
            type="text"
            id="busca"
            placeholder="🔍 Buscar fornecedor..."
            onkeyup="filtrarClientes()"
            style="
                width:100%;
                padding:12px;
                border:1px solid #000000;
                border-radius:8px;
                box-sizing:border-box;
                font-size:16px;
            "
        >

        <div id="listaClientes"></div>

    </div>
        </header>

        <div class="container">

            <div id="listaClientes"></div>

        </div>

        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="config.js"></script>
        <script>
        const API_URL = window.CONFIG.API_URL;
        </script>
        <script>

    const firebaseConfig = {
    apiKey: "AIzaSyCxrHKJhD7sY3msvUrDBbeNNvFeuYsAQuA",
    authDomain: "consulta-estoque-app.firebaseapp.com",
    projectId: "consulta-estoque-app",
    storageBucket: "consulta-estoque-app.firebasestorage.app",
    messagingSenderId: "1065893590092",
    appId: "1:1065893590092:web:479ebc4a07cf66457430e9"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();

    let funcionarios = [];
    let clientes = [];

    // ======================
    // API
    // ======================
    async function apiGet(action){

    const res = await fetch(
        API_URL + "?action=" + action
    );

        return res.json();

    }

    // ======================
    // LOGIN
    // ======================
    auth.onAuthStateChanged(async user => {

        if (!user) {
            window.location.href = "login.html";
            return;
        }

        await carregarFuncionarios();
        await carregarClientes();

    });

    // ======================
    // FUNCIONÁRIOS
    // ======================
    async function carregarFuncionarios(){

        const snap = await db.collection("usuarios").get();

        funcionarios = [];

        snap.forEach(doc => {

            const u = doc.data();

            if (u.nome && u.whatsapp){

                funcionarios.push({
                    nome: u.nome,
                    numero: u.whatsapp
                });

            }

        });

    }

    // ======================
    // FORNECEDORES
    // ======================
    async function carregarClientes(){

        clientes = await apiGet("listarfornecedor");

        console.log("RETORNO API:", clientes);

        renderClientes();

    }

    // ======================
    // MOSTRAR
    // ======================
    function renderClientes(lista = clientes){

        if(!Array.isArray(lista)){
            console.error("clientes não é array", lista);
            return;
        }

        let html = "";

        lista.forEach(c => {

            html += `
            <div class="card">

                <div class="cliente">
                    ${c.empresa || ""}<br>
                    ${c.nome || ""}
                </div>

                <button
                    class="btn maps"
                    onclick="window.open('${c.mapa || ""}','_blank')">
                    📍 Ver Endereço
                </button>

                <select id="func_${c.id}">
                    <option value="">Enviar para...</option>

                    ${funcionarios.map(f => `
                        <option value="${f.numero}">
                            ${f.nome}
                        </option>
                    `).join("")}

                </select>

                <button
                    class="btn whats"
                    onclick="enviarWhats('${c.id}')">
                    📲 Whats
                </button>

            </div>
            `;
        });

        document.getElementById("listaClientes").innerHTML =
            html || "<p>Nenhum fornecedor encontrado.</p>";
    }
    function filtrarClientes(){

        const texto =
            document.getElementById("busca")
            .value
            .toLowerCase()
            .trim();

        const filtrados = clientes.filter(c => {

            return (
                String(c.empresa || "")
                    .toLowerCase()
                    .includes(texto)

                ||

                String(c.nome || "")
                    .toLowerCase()
                    .includes(texto)

                ||

                String(c.fantasia || "")
                    .toLowerCase()
                    .includes(texto)
            );

        });

        renderClientes(filtrados);
    }
    // ======================
    // WHATSAPP
    // ======================
    function enviarWhats(id){

        const cliente =
            clientes.find(c => String(c.id) === String(id));

        if(!cliente){
            alert("Fornecedor não encontrado");
            return;
        }

        const numero =
            document.getElementById("func_" + id).value;

        if(!numero){
            alert("Selecione um funcionário");
            return;
        }

        let telefone = numero.replace(/\D/g,'');

        if(!telefone.startsWith("55")){
            telefone = "55" + telefone;
        }

        const msg =
            "📍 ENDEREÇO DO FORNECEDOR\n\n" +
            "🏢 Empresa: " + (cliente.empresa || "-") + "\n" +
            "👤 Contato: " + (cliente.nome || "-") + "\n" +
            "📞 Telefone: " + (cliente.tel || "-") + "\n\n" +
            "🔗 Google Maps:\n" +
            (cliente.mapa || "-");

        const url =
            "https://api.whatsapp.com/send?phone=" +
            telefone +
            "&text=" +
            encodeURIComponent(msg);

        window.open(url, "_blank");
    }
    </script>

        </body>
        </html>
