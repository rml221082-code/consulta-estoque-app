};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let funcionarios = [];

auth.onAuthStateChanged(async user=>{

    if(!user){
        window.location.href="login.html";
        return;
    }

    await carregarFuncionarios();

    renderClientes();

});

async function carregarFuncionarios(){

    const snap = await db.collection("usuarios").get();

    funcionarios=[];

    snap.forEach(doc=>{

        const u = doc.data();

        if(u.nome && u.whatsapp){

            funcionarios.push({
                nome:u.nome,
                numero:u.whatsapp
            });

        }

    });

}

// =============================
// MOSTRAR CLIENTES
// =============================
function renderClientes(){

    let html = "";

    clientes.forEach(c=>{

        html += `
        <div class="card">

            <div class="cliente">
                ${c.nome}
            </div>

            <button
                class="btn maps"
                onclick="window.open('${c.mapa}','_blank')">
                📍 Ver Endereço
            </button>

            <select id="func_${c.id}">
                <option value="">
                    Enviar para...
                </option>

                ${
                    funcionarios.map(f=>`
                        <option value="${f.numero}">
                            ${f.nome}
                        </option>
                    `).join("")
                }

            </select>

            <button
                class="btn whats"
                onclick="enviarWhats('${c.id}')">

                📲 Whats

            </button>

        </div>
        `;

    });

    document.getElementById("listaClientes").innerHTML = html;

}

// =============================
// ENVIAR WHATS
// =============================
function enviarWhats(id){

    const cliente =
        clientes.find(c=>c.id===id);

    if(!cliente) return;

    const numero =
        document
        .getElementById("func_"+id)
        .value;

    if(!numero){

        alert("Selecione um funcionário");

        return;
    }

    let telefone =
        numero.replace(/\D/g,'');

    if(!telefone.startsWith("55")){

        telefone = "55" + telefone;

    }

    const msg =
        "📍 ENDEREÇO DO CLIENTE\n\n" +
        "🏢 Cliente: " + cliente.nome + "\n\n" +
        "🔗 Google Maps:\n" +
        cliente.mapa;

    const url =
        "https://api.whatsapp.com/send?phone=" +
        telefone +
        "&text=" +
        encodeURIComponent(msg);

    window.open(url,"_blank");

}
