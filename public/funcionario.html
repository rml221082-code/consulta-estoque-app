<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro de Funcionários</title>

<style>
body{
  font-family:Arial;
  background:#f4f6f8;
  padding:20px;
}

.container{
  max-width:800px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.1);
}

h1{margin-bottom:20px}

input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:6px;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:6px;
  background:#2f80ed;
  color:#fff;
  cursor:pointer;
}

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:left;
}
</style>
</head>

<body>

<div class="container" data-tipo="admin administrativo">

<h1>Cadastro de Funcionários</h1>

<input id="nome" placeholder="Nome">
<input id="email" placeholder="Email">
<input id="empregador" placeholder="Empregador">

<button onclick="salvar()">Salvar</button>

<table>
<thead>
<tr>
<th>ID</th>
<th>Nome</th>
<th>Email</th>
<th>Empregador</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>

</div>

<script src="config.js"></script>
<script>
const API_URL = window.CONFIG.API_URL;

function salvar(){

  const nome = document.getElementById("nome").value;
  const email = document.getElementById("email").value;
  const empregador = document.getElementById("empregador").value;

  fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"salvarfuncionario",
      nome,
      email,
      empregador
    })
  })
  .then(r=>r.json())
  .then(r=>{
    if(r.success){
      alert("Salvo!");
      carregar();
    }else{
      alert(r.erro);
    }
  });

}

function carregar(){

  fetch(API_URL+"?action=listarfuncionarios")
  .then(r=>r.json())
  .then(r=>{

    const tbody = document.getElementById("lista");
    tbody.innerHTML = "";

    r.rows.forEach(f=>{

      tbody.innerHTML += `
        <tr>
          <td>${f.id}</td>
          <td>${f.nome}</td>
          <td>${f.email}</td>
          <td>${f.empregador}</td>
        </tr>
      `;

    });

  });

}

carregar();
</script>

</body>
</html>
