<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>Entrada de Notas (XML)</title>

<style>
*{box-sizing:border-box}

body{
font-family:'Segoe UI',Arial,sans-serif;
background:#f4f6f8;
padding:20px
}

.container{
max-width:900px;
margin:auto;
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,.08)
}

h1{margin-bottom:20px}

label{
font-weight:600;
margin-top:12px;
display:block
}

input,select,textarea{
width:100%;
padding:8px 10px;
margin-top:4px;
border:1px solid #ccc;
border-radius:6px
}

textarea{resize:vertical}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}

button{
margin-top:20px;
background:#0078d4;
color:#fff;
border:none;
padding:12px 18px;
border-radius:6px;
cursor:pointer;
font-weight:600
}

button:hover{background:#005a9e}

.toggle-container{
display:flex;
align-items:center;
gap:10px;
margin-top:15px;
}

.toggle{
position:relative;
width:50px;
height:26px;
}

.toggle input{opacity:0;width:0;height:0;}

.slider{
position:absolute;
top:0;left:0;right:0;bottom:0;
background:#ccc;
border-radius:30px;
}

.slider:before{
content:"";
position:absolute;
height:20px;width:20px;
left:3px;bottom:3px;
background:white;
border-radius:50%;
}

.toggle input:checked + .slider{
background:#ff3b3b;
}

.toggle input:checked + .slider:before{
transform:translateX(24px);
}
</style>
</head>

<body>

<div class="container">

<h1>📄 Entrada de Notas (XML)</h1>

<label>Importar XML</label>
<input type="file" id="xmlNota" accept=".xml">
<button type="button" onclick="lerXMLNota()">📥 Ler XML</button>

<form id="formNota">

<label>Empresa</label>
<select id="empresa" required>
<option value="">Selecione</option>
<option>HIDRAUMAN</option>
<option>HIDRAUFLEX</option>
</select>

<div class="row">
<div>
<label>Data</label>
<input type="date" id="dataCompra" required>
</div>

<div>
<label>Nº Nota</label>
<input type="text" id="numeroNota" required>
</div>
</div>

<label>Fornecedor</label>
<input type="text" id="fornecedor" required>

<div class="row">
<div>
<label>Valor Total</label>
<input type="text" id="valorTotal" required>
</div>

<div>
<label>Parcelas</label>
<input type="number" id="qtdParcelas" min="1" max="5">
</div>
</div>

<div class="row">
<div><label>Parcela 1</label><input id="valorParcela1"></div>
<div><label>Vencimento</label><input type="date" id="vencimento1"></div>

<div><label>Parcela 2</label><input id="valorParcela2"></div>
<div><label>Vencimento</label><input type="date" id="vencimento2"></div>

<div><label>Parcela 3</label><input id="valorParcela3"></div>
<div><label>Vencimento</label><input type="date" id="vencimento3"></div>

<div><label>Parcela 4</label><input id="valorParcela4"></div>
<div><label>Vencimento</label><input type="date" id="vencimento4"></div>

<div><label>Parcela 5</label><input id="valorParcela5"></div>
<div><label>Vencimento</label><input type="date" id="vencimento5"></div>
</div>

<label>Quem solicitou</label>
<select id="solicitante">
<option value="">Selecione</option>
<option>Altair</option>
<option>Daniel</option>
<option>Duarte</option>
<option>Guilherme</option>
<option>Josué</option>
<option>Juliana</option>
<option>Júlio</option>
<option>Mayara</option>
<option>Robson</option>
<option>Samuel</option>
</select>

<div class="toggle-container">
<label class="toggle">
<input type="checkbox" id="emergencial">
<span class="slider"></span>
</label>
<span>Emergencial</span>
</div>

<label>Observações</label>
<textarea id="obs"></textarea>

<label>PDF</label>
<input type="file" id="pdf" accept="application/pdf">

<button id="btnSalvar">💾 Salvar Nota</button>

</form>
</div>

<script>

const GAS_URL="https://script.google.com/macros/s/AKfycbwxXSEvXQQu15VA8esNJCtdbnsKhPskvHe6PeBsw8Jq0FBTysqR8c-p2ix_21cYGjiVcA/exec";

// ================= XML =================
function lerXMLNota(){

const file=xmlNota.files[0];
if(!file) return alert("Selecione XML");

const reader=new FileReader();

reader.onload=e=>{

const xml=new DOMParser().parseFromString(e.target.result,"text/xml");

// NOTA
numeroNota.value=xml.getElementsByTagName("nNF")[0]?.textContent||"";

// DATA
let data=xml.getElementsByTagName("dhEmi")[0]?.textContent || "";
if(data.includes("T")) data=data.split("T")[0];
dataCompra.value=data;

// FORNECEDOR (emit)
const emit=xml.getElementsByTagName("emit")[0];

let fornecedorXML = emit?.getElementsByTagName("xFant")[0]?.textContent;

if(!fornecedorXML){
fornecedorXML = emit?.getElementsByTagName("xNome")[0]?.textContent || "";
}

fornecedor.value=fornecedorXML;

// EMPRESA (dest)
const destNome = xml.getElementsByTagName("dest")[0]
?.getElementsByTagName("xNome")[0]?.textContent || "";

if(destNome.toUpperCase().includes("HIDRAUMAN")){
empresa.value="HIDRAUMAN";
}else if(destNome.toUpperCase().includes("HIDRAUFLEX")){
empresa.value="HIDRAUFLEX";
}

// TOTAL
const total=xml.getElementsByTagName("vNF")[0]?.textContent||0;

valorTotal.value=new Intl.NumberFormat('pt-BR',{
style:'currency',currency:'BRL'
}).format(total);

alert("XML carregado!");
};

reader.readAsText(file);
}

// ================= DUPLICATA =================
async function verificarDuplicata(){

const res = await fetch(GAS_URL,{
  method:'POST',
  body:new URLSearchParams({
    action:'listarnotasfiscais'
  })
});

const r = await res.json();

if(!r.rows) return false; // segurança

const nota = numeroNota.value.trim();
const fornecedorTxt = fornecedor.value.trim().toUpperCase();

return r.rows.some(n =>
  String(n.numeroNota).trim() === nota &&
  String(n.fornecedor).trim().toUpperCase() === fornecedorTxt
);

}

// ================= MOEDA =================
function moedaParaNumero(v){
return Number(v.replace(/\./g,'').replace(',','.').replace(/[^\d.-]/g,''))
}

function formatarMoeda(campo){
campo.addEventListener("input",()=>{
let v=campo.value.replace(/\D/g,'')
v=(v/100).toFixed(2)+''
v=v.replace(".",",")
v=v.replace(/\B(?=(\d{3})+(?!\d))/g,".")
campo.value="R$ "+v
})
}

formatarMoeda(valorTotal);

// ================= PARCELAS =================
function calcularParcelas(){

const total=moedaParaNumero(valorTotal.value)
const qtd=parseInt(qtdParcelas.value)

if(!total||!qtd)return

const valor=total/qtd

for(let i=1;i<=5;i++){

const campo=document.getElementById("valorParcela"+i)

if(i<=qtd){
campo.value=new Intl.NumberFormat('pt-BR',{
style:'currency',currency:'BRL'
}).format(valor)
}else{
campo.value=""
}
}
}

valorTotal.addEventListener("blur",calcularParcelas)
qtdParcelas.addEventListener("input",calcularParcelas)

// ================= BASE64 =================
function toBase64(file){
return new Promise(res=>{
const r=new FileReader()
r.onload=e=>res(e.target.result.split(',')[1])
r.readAsDataURL(file)
})
}

// ================= SALVAR =================
formNota.addEventListener("submit",async e=>{

e.preventDefault()

// 🔎 DUPLICATA
if(await verificarDuplicata()){
alert("⚠️ Nota já cadastrada!");
return;
}

btnSalvar.disabled=true
btnSalvar.innerText="Salvando..."

let arquivo=null;

if(pdf.files[0]){
const base64=await toBase64(pdf.files[0]);
arquivo=JSON.stringify({
nome:pdf.files[0].name,
tipo:pdf.files[0].type,
dados:base64
});
}

const form=new FormData();

form.append('action','salvarNotaFiscal');
form.append('empresa',empresa.value);
form.append('dataCompra',dataCompra.value);
form.append('numeroNota',numeroNota.value);
form.append('fornecedor',fornecedor.value);
form.append('valorTotal',moedaParaNumero(valorTotal.value));
form.append('qtdParcelas',qtdParcelas.value);

for(let i=1;i<=5;i++){
form.append('valorParcela'+i,moedaParaNumero(document.getElementById('valorParcela'+i).value));
form.append('vencimento'+i,document.getElementById('vencimento'+i).value);
}

form.append('solicitante',solicitante.value);
form.append('emergencial',emergencial.checked?'SIM':'NAO');
form.append('obs',obs.value);

if(arquivo) form.append('arquivo',arquivo);

const res=await fetch(GAS_URL,{method:'POST',body:form});
const r=await res.json();

if(r.success){
alert("✅ Nota salva!");
formNota.reset();
}else{
alert("Erro: "+r.erro);
}

btnSalvar.disabled=false
btnSalvar.innerText="Salvar Nota"

});

</script>

</body>
</html>
